# Base AI-slop deny-list rule.
#
# This is the shared deny-list of AI-writing markers that the project's own
# `House.AISlop` rule extends. Tokens are drawn from the Wikipedia "Signs of AI
# writing" list (Aug 2026) and the tbhb/vale-ai-tells v1.31.0 word-lists
# (MIT). The rule is deliberately conservative: it flags only high-precision
# AI fingerprints, not ordinary vocabulary, so it stays green on the existing
# tree. Project-specific additions and removals belong in
# .vale/styles/House/AISlop.yml (tokens+ / tokens-), and false-positive
# overrides belong in .vale/config/vocabularies/House/accept.txt.
extends: existence
message: "AI-slop: '%s'. Replace with a concrete, specific word."
level: error
ignorecase: true
tokens:
  # Overused AI vocabulary (tbhb/vale-ai-tells OverusedVocabulary).
