<template id="act-4-mark-template">
  <div data-composition-id="act-4-mark" data-width="1920" data-height="1080"
       data-start="0" data-duration="13.0">
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage-hero.woff2") format("woff2"); font-weight: 700 800; font-display: block; }
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/instrument-sans-latin.woff2") format("woff2"); font-weight: 400 600; font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-500.woff2") format("woff2"); font-weight: 500; font-display: block; }

      .a4 {
        position: absolute; inset: 0;
        background: var(--ink);
        font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--bone);
      }
      .a4-top {
        position: absolute; left: 96px; top: 96px;
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 22px;
        letter-spacing: 0.14em; text-transform: uppercase; color: #8c8a80;
      }
      .a4-h {
        position: absolute; left: 96px; top: 150px;
        font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif;
        font-weight: 800; font-size: 96px; line-height: 0.98; letter-spacing: -0.04em;
      }
      /* The mark: one real change, struck through and replaced. */
      .a4-row {
        position: absolute; left: 96px; top: 420px; width: 1728px;
        font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif;
        font-weight: 700; font-size: 68px; line-height: 1.18; letter-spacing: -0.025em;
      }
      .a4-before { color: #6d6a61; }
      .a4-after { color: var(--accent); }
      .a4-rule {
        position: absolute; left: 96px; top: 452px; height: 5px; background: var(--bone);
        width: 0;
      }
      .a4-shot {
        position: absolute; left: 96px; top: 616px; width: 620px; height: 388px;
        border-radius: 10px; border: 1px solid #2a2823; object-fit: cover; object-position: 0 0;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      }
      .a4-cap {
        position: absolute; left: 96px; top: 1020px;
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 16px;
        letter-spacing: 0.06em; text-transform: uppercase; color: #6d6a61;
      }
      .a4-facts {
        position: absolute; left: 960px; top: 720px; width: 864px;
        display: flex; flex-direction: column; gap: 34px;
      }
      .a4-fact {
        border-left: 2px solid var(--accent); padding-left: 26px;
      }
      .a4-fact-k {
        font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 18px;
        letter-spacing: 0.1em; text-transform: uppercase; color: #8c8a80; margin-bottom: 8px;
      }
      .a4-fact-v {
        font-size: 34px; line-height: 1.3; color: #d8d4c8;
      }
    </style>

    <div class="a4 clip" data-start="0" data-duration="13.0" id="act-4-mark-a4-1">
      <div class="a4-top clip" data-start="0.10" data-duration="12.90" id="act-4-mark-a4-top-1">Every change, in one line</div>
      <h1 class="a4-h clip" data-start="0.40" data-duration="12.60" id="act-4-mark-a4-h-1">Not a news feed.<br /><span style="color:var(--accent)">A mark.</span></h1>

      <div class="a4-row clip" data-start="1.20" data-duration="11.80" id="act-4-mark-a4-row-1">
        <span class="a4-before" id="a4-before">Annual plan &mdash; 20% off</span><br />
        <span class="a4-after">Annual plan &mdash; 30% off</span>
      </div>
      <div class="a4-rule clip" data-start="1.20" data-duration="11.80" id="a4-rule"></div>

      <img class="a4-shot clip" data-start="2.40" data-duration="10.60"
           src="assets/keyframe-alerts-1440x900.png" width="620" height="388" alt="" id="act-4-mark-a4-shot-1">
      <div class="a4-cap clip" data-start="2.50" data-duration="10.50" id="act-4-mark-a4-cap-1">Screenshot behind the change</div>

      <div class="a4-facts">
        <div class="a4-fact clip" data-start="2.60" data-duration="10.40" id="act-4-mark-a4-fact-1">
          <div class="a4-fact-k">What changed</div>
          <div class="a4-fact-v">The words on their pricing page.</div>
        </div>
        <div class="a4-fact clip" data-start="3.00" data-duration="10.00" id="act-4-mark-a4-fact-2">
          <div class="a4-fact-k">When we saw it</div>
          <div class="a4-fact-v">The next sweep after you switched them on.</div>
        </div>
        <div class="a4-fact clip" data-start="3.40" data-duration="9.60" id="act-4-mark-a4-fact-3">
          <div class="a4-fact-k">The proof</div>
          <div class="a4-fact-v">Tap any line for the screenshot.</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var ID = "act-4-mark";
        var tl = gsap.timeline({ paused: true });
        // The strike-through draws itself across the "before" line.
        tl.fromTo("#a4-rule", { width: 0 }, { width: 1050, duration: 0.45, ease: "power2.inOut" }, 1.20)
          .fromTo("#a4-before", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.05)
          .fromTo(".a4-before", { color: "#6d6a61" }, { color: "#3a382f", duration: 0.4, ease: "none" }, 1.70)
          .fromTo(".a4-after", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.80)
          .fromTo(".a4-shot", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 2.40)
          .fromTo(".a4-fact", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out", stagger: 0.14 }, 2.60)
          .fromTo(".a4-h", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.40);
        window.__timelines[ID] = tl;
        tl.seek(0);
      })();
    </script>
  </div>
</template>
