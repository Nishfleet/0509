<template id="act-2-one-box-template">
  <div data-composition-id="act-2-one-box" data-width="1920" data-height="1080" data-start="0" data-duration="10.0">
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("assets/fonts/bricolage-hero.woff2") format("woff2");
        font-weight: 700 800;
        font-display: block;
      }
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("assets/fonts/bricolage-grotesque-latin.woff2") format("woff2");
        font-weight: 200 800;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("assets/fonts/instrument-sans-latin.woff2") format("woff2");
        font-weight: 400 600;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("assets/fonts/ibm-plex-mono-latin-400.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("assets/fonts/ibm-plex-mono-latin-500.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }

      .a2 {
        position: absolute;
        inset: 0;
        background: var(--ink);
        font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--bone);
      }
      .a2-label {
        position: absolute;
        left: 96px;
        top: 232px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8c8a80;
      }
      .a2-h {
        position: absolute;
        left: 96px;
        top: 280px;
        width: 780px;
        font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif;
        font-weight: 800;
        font-size: 124px;
        line-height: 0.94;
        letter-spacing: -0.045em;
      }
      .a2-h .one {
        color: var(--green);
      }
      .a2-sub {
        position: absolute;
        left: 96px;
        top: 628px;
        width: 740px;
        font-size: 32px;
        line-height: 1.34;
        color: #b9b5aa;
      }
      .a2-shot {
        position: absolute;
        left: 1048px;
        top: 210px;
        width: 776px;
        height: 620px;
        border-radius: 12px;
        border: 1px solid #2a2823;
        object-fit: cover;
        object-position: 50% 42%;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
      }
      .a2-cap {
        position: absolute;
        left: 1048px;
        top: 846px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 16px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8a867c;
      }
      /* The one box, drawn as a caret-tracked type-on of the real placeholder. */
      .a2-box {
        position: absolute;
        left: 96px;
        top: 762px;
        width: 720px;
        height: 96px;
        border: 1px solid #33302a;
        border-radius: 8px;
        background: #171512;
        display: flex;
        align-items: center;
        padding: 0 26px;
      }
      .a2-box-txt {
        font-family: "Instrument Sans", ui-sans-serif, sans-serif;
        font-size: 27px;
        color: #e6e2d6;
        white-space: nowrap;
      }
      .a2-carets {
        display: inline-block;
        width: 3px;
        height: 34px;
        margin-left: 4px;
        background: var(--green);
        vertical-align: middle;
      }
    </style>

    <div class="a2 clip" data-start="0" data-duration="10.0" id="act-2-one-box-a2-1">
      <div class="a2-label clip" data-start="0.10" data-duration="9.90" id="act-2-one-box-a2-label-1">Step one</div>
      <h1 class="a2-h clip" data-start="0" data-duration="10.0" id="act-2-one-box-a2-h-1">
        <span class="one">One box</span><br />to fill in.
      </h1>
      <p class="a2-sub clip" data-start="3.90" data-duration="6.10" id="act-2-one-box-a2-sub-1">
        Your website address or your social username. That is the whole setup.
      </p>
      <img
        class="a2-shot clip"
        data-start="0.60"
        data-duration="9.40"
        src="assets/app-login-1440x900.png"
        width="776"
        height="620"
        alt=""
        id="act-2-one-box-a2-shot-1"
      />
      <div class="a2-cap clip" data-start="0.70" data-duration="9.30" id="act-2-one-box-a2-cap-1">
        The sign-up box, as shipped
      </div>
      <div class="a2-box clip" data-start="4.30" data-duration="5.40" id="act-2-one-box-a2-box-1">
        <span class="a2-box-txt" id="a2-typed"></span><span class="a2-carets"></span>
      </div>
    </div>

    <script>
      (function () {
        var ID = "act-2-one-box";
        var PLACEHOLDER = "yourbrand.com";
        var el = document.getElementById("a2-typed");
        var tl = gsap.timeline({ paused: true });
        // 2.6s of type-on = 13 chars, one every 200ms.
        for (var i = 0; i <= PLACEHOLDER.length; i++) {
          (function (n) {
            tl.set(el, { textContent: PLACEHOLDER.slice(0, n) }, 4.3 + n * 0.2);
          })(i);
        }
        tl.fromTo(".a2-h", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.0)
          .fromTo(".a2-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.9)
          .fromTo(".a2-shot", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 1.0, ease: "power2.out" }, 0.6)
          .fromTo(".a2-box", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.3);
        window.__timelines[ID] = tl;
        tl.seek(0);
      })();
    </script>
  </div>
</template>
