nd it didn't! Again, it said the text was too small, but the whole point of using two documents (according to Copilot) was so the text would be big enough to recognize. The best part about this whole situation is that I signed up with my college email address, and every time it requests verification, it asks ME if I would like to use my student email already on file. Make it make sense. I deleted my GitHub account within 6 hours of having it, and I have no intention of ever using it again. Copilot is also the least intelligent AI product on the market right now; I would highly suggest investing elsewhere and using a different platform. ","reviewRating":{"@type":"Rating","bestRating":"5","worstRating":"1","ratingValue":"1"},"publisher":{"@id":"https://www.trustpilot.com/#/schema/Organization/1"},"inLanguage":"en"},{"@type":"Review","@id":"https://www.trustpilot.com/#/schema/Review/github.com/6a5d2b4f95048efec203191f","itemReviewed":{"@id":"https://www.trustpilot.com/#/schema/Organization/github.com"},"author":{"@type":"Person","name":"Ben lee","url":"https://www.trustpilot.com/users/5d14017fbe59e87ba9dd9102/"},"datePublished":"2026-07-19T21:53:51.000Z","headline":"Github dosnt support small business i…","reviewBody":"Github dosnt support small business i only have 1 GitHub account support are saying i have multiple account witch I don't and they don't want to look into it I'm trying to run a business i even offered to pay the the GitHub enterprise but got told no we are leaving your account suspended even though i have multiple projects that I can no longer access also took them over a month to say 1 sentence wouldn't recommend using  ","reviewRating":{"@type":"Rating","bestRating":"5","worstRating":"1","ratingValue":"1"},"publisher":{"@id":"https://www.trustpilot.com/#/schema/Organization/1"},"inLanguage":"en"},{"@type":"Review","@id":"https://www.trustpilot.com/#/schema/Review/github.com/6a549b32d728b435092059ea","itemReviewed":{"@id":"https://www.trustpilot.com/#/
