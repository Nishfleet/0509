For every $1,000 in lottery winnings someone in a neighbourhood won... the bankruptcy rate of their NEIGHBOURS went up by 2.4\u0025.\n\nNot the winners. The neighbours.\n\nLet that sit for a second. Someone across the street wins money, and YOU are more likely to go broke. \n\nWhen you see someone nearby succeeding, you start making decisions based on what's working for them. New car. New kitchen. New wardrobe. New everything. Without realizing their context, their income, and their situation is completely different from yours.\n\nIt's \"keeping up with the Joneses\" but with receipts.\n\nPhillip Jackson says this is exactly what happens to Shopify merchants every single day.\n\nWe see what Glossier is doing. We copy it.\nWe see what Gymshark is doing. We copy it.\nWe see what Ridge Wallet is doing. We copy it.\nWe see the Slack thread about what tech stack Kith uses. We copy it.\n\nWe read a Twitter thread about a $100M brand's email flow. We copy it.\n\nAnd we do this WITHOUT asking...\n...do their customers match mine?\n...do their budgets match mine?\n...does their stage match mine?\n...does their margin structure match mine?\n...does their audience give a crap about the same things?\n\nusually no.\n\nHere's my Shopify 1\u0025 takeaway for this one.\nNext time you see a brand doing something cool and your first instinct is \"we should do that\"... pause.\n\nAsk yourself three questions first:\n\nAre their customers actually my customers?\nDo I have the same margin structure to afford that move?\nAm I copying the tactic or the thinking behind the tactic?\n\nThe tactic is usually the trap. The thinking is the gold.\nCopy the thinking. Ignore the tactic. Run your own playbook.\n\n\ud83c\udfa7 Full episode link in bio, or: https:\/\/www.shopify1percent.com\/futurecommerce\/ \n\n\u0040philwinkle \u0040futurecommerce #Shopify #ecommerce #podcast #Shopify1Percent"},"cta_type":"VIEW_INSTAGRAM_PROFILE","display_format":"VIDEO","link_description":null,"link_url":"http:\/\
