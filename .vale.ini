# Vale configuration for the 0509 content tree.
#
# Styles
# ------
# BasedOnStyles pulls in the vendored `Std` package (see .vale/styles/Std/NOTICE
# for provenance) and the project's own `House` style. `House.AISlop` extends
# `Std.AISlop` and adds/removes tokens for this repo's voice.
#
# SentenceLength
# --------------
# `Std.Readability.SentenceLength` is raised to `error` and its `max` is
# parameterised here. The initial value is seeded at the tree's measured
# maximum so the gate is green on day one; the weekly quality ratchet
# (scripts/quality-ratchet.mjs + .github/workflows/quality-ratchet.yml)
# recomputes the ceiling against origin/main and only ever lowers it.
#
# Vocab
# -----
# False-positive overrides live in .vale/config/vocabularies/House/accept.txt
# (the path Vale 3.20.0 actually reads for a `Vocab = House` entry).

StylesPath = .vale
MinAlertLevel = error
Vocab = House

BasedOnStyles = Std, House

[*.md]
Std.Readability.SentenceLength = error
Std.Readability.SentenceLength.max = 176
