# Vale configuration for the 0509 content tree.
#
# StylesPath points at .vale/styles so the vendored `Std` package lives at
# .vale/styles/Std (see .vale/styles/Std/NOTICE for provenance and licence)
# and the project's own `House` style at .vale/styles/House. `House.AISlop`
# extends `Std.AISlop` and adds/removes tokens for this repo's voice.
# `Std.AISlop = NO` switches the parent rule off so each hit is reported once,
# by the child. False-positive overrides live in
# .vale/styles/config/vocabularies/House/accept.txt — the path Vale resolves
# for `Vocab = House` under this StylesPath.
#
# `Std.Readability.SentenceLength` is raised to `error` and its `max` is
# parameterised here. The initial value is seeded at the tree's measured
# maximum so the gate is green on day one; the weekly quality ratchet
# (scripts/quality-ratchet.mjs + .github/workflows/quality-ratchet.yml)
# recomputes the ceiling against origin/main and only ever lowers it.

StylesPath = .vale/styles
Vocab = House

[*.md]
BasedOnStyles = Std, House

Std.AISlop = NO
Std.Readability.SentenceLength = error
Std.Readability.SentenceLength[max] = 176