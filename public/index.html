<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Five to Nine</title>
    <meta
      name="description"
      content="Quietly, we're rebuilding. You'll see where you stand when it's ready."
    />
    <meta name="robots" content="noindex" />
    <style>
/* Static coming-soon styles. Tailwind scans app/ only, so deleting the
   landing route would drop these utilities from the hashed bundle.
   The headline is the LCP element. A web face that finishes before it is a
   simulated-4G dependency — inlined faces missed the 1.5s budget that way.
   These stacks paint with the document. Brand faces stay on /design/landing. */
:root {
  --color-bone: #f4f1e8;
  --color-ink: #0e0d0a;
  --color-ink-soft: #55524a;
  --color-ink-faint: #8e8878;
  --color-line: #ddd6c6;
  --color-accent: #16c47f;
  --color-on-accent: #0e0d0a;
  --font-display: ui-sans-serif, system-ui, sans-serif;
  --font-sans: ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --spacing: 0.25rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bone: #14130f;
    --color-ink: #f2efe4;
    --color-ink-soft: #a9a294;
    --color-ink-faint: #7b7568;
    --color-line: #322e25;
    --color-accent: #2ee59c;
    --color-on-accent: #0e0d0a;
    color-scheme: dark;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--color-bone);
  color: var(--color-ink);
  max-width: 100%;
  overflow-x: hidden;
}

body {
  font-family: var(--font-sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1 {
  font-size: inherit;
  font-weight: inherit;
  margin: 0;
}

a {
  color: inherit;
  text-decoration: inherit;
}

.mx-auto { margin-inline: auto; }
.mt-7 { margin-top: calc(var(--spacing) * 7); }
.flex { display: flex; }
.min-h-dvh { min-height: 100dvh; }
.w-full { width: 100%; }
.max-w-\[34rem\] { max-width: 34rem; }
.max-w-\[64rem\] { max-width: 64rem; }
.flex-col { flex-direction: column; }
.justify-between { justify-content: space-between; }
.border-t { border-top-width: 1px; border-top-style: solid; }
.border-line { border-color: var(--color-line); }
.bg-accent { background-color: var(--color-accent); }
.px-6 { padding-inline: calc(var(--spacing) * 6); }
.px-\[5px\] { padding-inline: 5px; }
.py-12 { padding-block: calc(var(--spacing) * 12); }
.py-20 { padding-block: calc(var(--spacing) * 20); }
.pt-7 { padding-top: calc(var(--spacing) * 7); }
.font-display { font-family: var(--font-display); }
.font-mono { font-family: var(--font-mono); }
.text-base { font-size: 1rem; line-height: 1.5; }
.text-\[0\.72rem\] { font-size: 0.72rem; }
.text-\[clamp\(1\.75rem\,3\.6vw\,2\.9rem\)\] { font-size: clamp(1.75rem, 3.6vw, 2.9rem); }
.text-\[clamp\(1rem\,1\.3vw\,1\.1rem\)\] { font-size: clamp(1rem, 1.3vw, 1.1rem); }
.leading-\[1\.15\] { line-height: 1.15; }
.leading-\[1\.65\] { line-height: 1.65; }
.font-bold { font-weight: 700; }
.font-semibold { font-weight: 600; }
.tracking-\[-0\.02em\] { letter-spacing: -0.02em; }
.tracking-\[-0\.03em\] { letter-spacing: -0.03em; }
.tracking-\[0\.06em\] { letter-spacing: 0.06em; }
.text-ink-faint { color: var(--color-ink-faint); }
.text-ink-soft { color: var(--color-ink-soft); }
.text-on-accent { color: var(--color-on-accent); }
.underline { text-decoration-line: underline; }
.decoration-1 { text-decoration-thickness: 1px; }
.underline-offset-4 { text-underline-offset: 4px; }
.transition-colors { transition-property: color; transition-duration: 150ms; }
.duration-150 { transition-duration: 150ms; }

@media (hover: hover) {
  .hover\:text-ink:hover { color: var(--color-ink); }
}

@media (width >= 40rem) {
  .sm\:px-12 { padding-inline: calc(var(--spacing) * 12); }
  .sm\:py-16 { padding-block: calc(var(--spacing) * 16); }
  .sm\:py-28 { padding-block: calc(var(--spacing) * 28); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
    </style>
  </head>
  <body>
    <main
      class="mx-auto flex min-h-dvh w-full max-w-[64rem] flex-col justify-between px-6 py-12 sm:px-12 sm:py-16"
    >
      <header>
        <span class="font-display text-base font-bold tracking-[-0.03em]">
          05<span class="bg-accent text-on-accent px-[5px]">09</span>
        </span>
      </header>

      <div class="max-w-[34rem] py-20 sm:py-28">
        <h1
          class="font-display text-[clamp(1.75rem,3.6vw,2.9rem)] leading-[1.15] font-semibold tracking-[-0.02em]"
        >
          Quietly, we&rsquo;re rebuilding.
        </h1>

        <p class="text-ink-soft mt-7 text-[clamp(1rem,1.3vw,1.1rem)] leading-[1.65]">
          You&rsquo;ll see where you stand when it&rsquo;s ready.
        </p>
      </div>

      <footer
        class="border-line text-ink-faint border-t pt-7 font-mono text-[0.72rem] tracking-[0.06em]"
      >
        <a
          class="hover:text-ink underline decoration-1 underline-offset-4 transition-colors duration-150"
          href="mailto:support@0509.io"
        >
          support@0509.io
        </a>
        <span aria-hidden="true"> · </span>
        <a
          class="hover:text-ink underline decoration-1 underline-offset-4 transition-colors duration-150"
          href="/privacy"
        >
          Privacy
        </a>
        <span aria-hidden="true"> · </span>
        <a
          class="hover:text-ink underline decoration-1 underline-offset-4 transition-colors duration-150"
          href="/terms"
        >
          Terms
        </a>
      </footer>
    </main>
  </body>
</html>
