name: semgrep-actionlint

# New standalone workflow for the fleet-wide semgrep + actionlint gates.
# Kept as a separate file to avoid touching ci.yml / secret-scan.yml, whose
# required-context jobs (codex-node-checks, Gitleaks) carry strict fork-guard
# authorizers that must not be disturbed (smallest-diff rule for the flagship).
# semgrep is a required context now (live main-merge-queue ruleset, verified
# 2026-09-13); actionlint is not - that asymmetry is exactly why only
# actionlint may skip, and why semgrep keeps running on every event.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    # Consumes the canonical no-hand-built-orchestration ruleset by PINNED
    # raw URL at Nishfleet/siterep-public@4738f06 (exact commit SHA) plus
    # p/default for defense-in-depth. Per-repo copies of the ruleset are
    # forbidden — one canonical source, every repo consumes it by pin.
    # Fails only on ERROR/HIGH findings; lower-severity p/default noise is
    # reported but does not block.
    #
    # NOTE: as of this PR the gate reports 21 pre-existing ERROR/HIGH
    # findings in ops/ and scripts/ (advisory-file-lock mutexes, retry
    # counters, liveness pollers, a state-ledger line). These are
    # pre-existing hand-built orchestration patterns the gate is designed
    # to catch — they predate
    # this gate and are follow-up work items, not regressions from this PR.
    # The orchestrator cannot require this context until they are cleared.
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: read lets the changed-file detector below call the PR
    # files API; without it the GITHUB_TOKEN (workflow grants only
    # contents: read) would 403 and the detector would always fall back to
    # running actionlint unconditionally (fail-open, but with no saving).
    # Job-level permissions replace the inherited set, so contents: read is
    # re-declared explicitly.
    permissions:
      contents: read
      pull-requests: read
    # Issue #3263: exports the changed-file detector's verdict so the
    # actionlint job can gate on it via needs.semgrep.outputs.actionlint.
    # Without this block the expression reads an empty string and the gate
    # always runs.
    outputs:
      actionlint: ${{ steps.changes.outputs.actionlint }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect .github changes (gates the actionlint job)
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Issue #3263: actionlint's entire input is `.github/**` (workflow
          # and job wiring), so on a pull_request that touches no `.github/**`
          # file its verdict cannot differ from the previous run. This step
          # records whether the PR touches that tree and the actionlint job's
          # job-level `if` skips itself when it does not. Non-PR events (push
          # to main, merge_group) set no output, so actionlint keeps running
          # exactly as before there. Fail-open: when the files API is
          # unavailable the step reports "true" so the linter still runs —
          # skipping a gate is the weaker failure mode, and this keeps the
          # required semgrep verdict unaffected either way.
          if ! files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[] | .filename' 2>/dev/null)"; then
            echo "::warning::files API unavailable; running actionlint unconditionally"
            echo "actionlint=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bracket form (no escaping): matches paths like
          # .github/workflows/ci.yml. A '\\.' pattern would require a literal
          # backslash in the filename and never match.
          if printf '%s' "$files" | grep -q '^[.]github/'; then
            echo "actionlint=true" >> "$GITHUB_OUTPUT"
          else
            echo "actionlint=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR touches no .github/** files; actionlint job will skip"
          fi
      - name: Install semgrep (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          # Pinned to an exact release (published 2026-07-28, >7 days old).
          # Bump deliberately; do not use `latest` or a floating range.
          pip install semgrep==1.172.0
      - name: Semgrep scan (canonical orchestration gate + p/default)
        run: |
          set -uo pipefail
          # The job fails only on ERROR/HIGH-tier findings (semgrep's ERROR
          # == HIGH); lower-severity p/default findings are reported but do
          # not block, so pre-existing MEDIUM/WARNING/INFO noise does not
          # stall every PR.
          CANONICAL_SHA="4738f06365012bc9f1f54c5981cedf9ddd3fa1eb"
          CANONICAL_URL="https://raw.githubusercontent.com/Nishfleet/siterep-public/${CANONICAL_SHA}/.semgrep/no-hand-built-orchestration.yml"
          semgrep --config "${CANONICAL_URL}" \
                  --config p/default \
                  --quiet --metrics=off --json > semgrep-results.json
          jq -r '.results[] | "::" + (.extra.severity | ascii_downcase) + "::" + .path + ":" + (.start.line|tostring) + " [" + .check_id + "] " + (.extra.message | gsub("\n";" "))' semgrep-results.json 2>/dev/null || true
          if jq -e '[.results[] | select(.extra.severity | ascii_downcase | IN("error","high"))] | length > 0' semgrep-results.json >/dev/null 2>&1; then
            echo "::error::Semgrep found ERROR/HIGH-severity findings (listed above)."
            exit 1
          fi
          echo "::notice::Semgrep clean (no ERROR/HIGH findings)."

  actionlint:
    # Lint job config is wiring (not a ruleset), so per-repo duplication is
    # acceptable — only the semgrep ruleset stays canonical. Same job shape
    # as aiconverter-app / siterep-public: SHA-pinned action, shellcheck/
    # pyflakes off for hermeticism.
    #
    # Issue #3263: this job only judges `.github/**`, so it is gated by a
    # job-level `if` on the semgrep job's changed-file detection. This
    # workflow cannot carry a workflow-level `paths:` filter without also
    # gating semgrep (a required context that must run on EVERY PR), and this
    # context is not required, so a skipped run costs nothing. Unlike
    # release-proof, the skip decision needs the PR's changed-file list, so
    # it reads the output of the (always-running) semgrep job rather than
    # adding a second detector job: no extra check run, no extra checkout.
    # Fail-open: a missing output (non-PR event, or the detection step
    # unavailable) runs the linter, it never silently skips the gate.
    # always() keeps that decision evaluating when semgrep itself fails, so a
    # red run still shows whether the PR also broke the workflow wiring.
    name: actionlint
    needs: semgrep
    if: always() && needs.semgrep.outputs.actionlint != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: false
          pyflakes: false
