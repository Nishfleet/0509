name: Search tier canary

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:17 UTC. The :17 offset follows the ops-guard convention of
    # avoiding whole-minute collisions with other scheduled canaries. The
    # canary verifies the §1.8 six-domain set (issue #1452) returns at least
    # one verified/likely row on the keyword tier-label path — a dead-end or
    # blanket-unmatched regression must fail loud, never exit 0.
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: search-tier-canary
  cancel-in-progress: false

jobs:
  six-domain-tier-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Run six-domain tier canary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/search-tier-canary.mjs
