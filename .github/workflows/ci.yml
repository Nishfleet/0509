name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-node-checks:
    if: github.repository == 'nish3451/0509' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.RECOVERY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Acquire deploy window (serialize with fleet lanes on the VPS runner)
        shell: bash
        run: ./scripts/deploy-window-lock.sh acquire

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Typecheck
        run: npm run typecheck

      - name: Release deploy window
        if: always()
        shell: bash
        run: ./scripts/deploy-window-lock.sh release
