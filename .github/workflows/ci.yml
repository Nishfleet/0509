name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for verification
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  authorize_release:
    name: Authorize exact verification candidate
    # No job-level fork guard here: a fork PR must produce a real job outcome,
    # never a skip (GitHub accepts skipped required contexts as satisfied).
    # The fork guard lives in the authorize step below, which refuses fork PRs
    # with a real failure. This job is not itself a required context; the
    # required codex-node-checks job below turns any failed authorization into
    # a real failure via its "Require authorization gate" step.
    if: github.repository == 'nish3451/0509'
    runs-on: [self-hosted, linux, x64, vps-verify]
    permissions: {}
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Authorize verification request
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "nish3451/0509"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  codex-node-checks:
    # Required context. It runs unconditionally (never skips on a fork PR):
    # the "Require authorization gate" step below turns any failed or skipped
    # authorization (fork PRs included) into a real job failure. A gate that
    # cannot verify must say no, never render as green.
    if: >-
      github.repository == 'nish3451/0509' &&
      !cancelled()
    needs: authorize_release
    runs-on: [self-hosted, linux, x64, vps-verify]
    permissions:
      contents: read
    # The 270m job cap bounds setup plus all per-step waits. Each heavy step has
    # one 180m total budget shared between its lane slot and the deploy gate.
    timeout-minutes: 270
    steps:
      - name: Require authorization gate
        if: needs.authorize_release.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::codex-node-checks refused: authorize_release concluded '${{ needs.authorize_release.result }}' (expected 'success'). Fork PRs and unapproved dispatch candidates are never verified."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize_release.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ needs.authorize_release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            ./scripts/deploy-window-lock.sh run -- npm ci --ignore-scripts
          else
            ./scripts/deploy-window-lock.sh run -- npm install --ignore-scripts
          fi
      - name: Build
        run: ./scripts/deploy-window-lock.sh run -- npm run build
      - name: Test
        # Vitest 4.1.x hardcodes the forks-worker startup budget (90s ready /
        # 60s handshake) and the suite forks one worker per file, so a load
        # spike on the shared vps-verify runner can intermittently kill the
        # step with "[vitest-pool]: Timeout starting forks runner." The wrapper
        # retries once only on that exact startup-timeout signature; every real
        # test failure still fails the step immediately.
        run: ./scripts/deploy-window-lock.sh run -- ./scripts/ci-vitest-run.sh
      - name: Typecheck
        env:
          # Node derives a ~1.2 GiB heap from the 3 GiB runner cgroup, while
          # this project's composite TypeScript build needs more headroom.
          # Keep it below MemoryHigh/MemoryMax so systemd still fails closed.
          NODE_OPTIONS: --max-old-space-size=2048
        run: ./scripts/deploy-window-lock.sh run -- npm run typecheck
