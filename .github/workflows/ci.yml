# One CI file, GitHub-hosted runners. The template the other product repos copy: docs/ci-template.md.
# Each job names the incident or standing rule that keeps it. The ruleset requires `ci-ok`, which
# passes only when every job it needs reports success, so a skipped job fails it (0509#7013).
# No job that ci-ok needs carries a job-level `if:`; conditions sit on steps so every such job always reports.
name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  checks:
    # Correction ladder rung 2 (AGENTS.md): typecheck, lint, workflow audit, coverage floor, build.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with: {inputs: .github/workflows, online-audits: false, advanced-security: false}
      - run: npx vitest run --project node --coverage
      - run: npm run build

  test:
    # The workerd test projects, four shards: one job hit the 25-minute timeout (0509#7163).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx vitest run --project '!node' --shard "$SHARD"

  e2e:
    # The built Worker in a browser, plus the JS and Lighthouse budgets (docs/REBUILD-DONE.md B, 0509#4134, 0509#4224).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --config vitest.bundle.config.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npx lhci collect --url=http://127.0.0.1:8787/ --start-server-command="npx wrangler dev --env-file .dev.vars.example --port 8787 --local" --start-server-ready-pattern="Ready on" --start-server-ready-timeout=120000 --number-of-runs=3
      - run: npx lhci assert --budgets-file=lighthouse-budget.pr.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: playwright-report, path: "playwright-report/\ntest-results/", retention-days: 7}

  secrets:
    # Public repo: no secret and no private infrastructure detail in a new commit (AGENTS.md, public-repo-text rule).
    # The rules file extends gitleaks' defaults. Only the new commits are scanned, so old history cannot fail it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    env:
      RANGE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}..${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && gitleaks git . --config .github/gitleaks-private-detail.toml --redact --exit-code 1 --log-opts "$RANGE"

  semgrep:
    # The rollover catch-up call-site rule (0509#5661), the fleet no-glue rule (fleet-ops#8459), and the
    # latest-row tie-break rule (0509#7863), which fails only new sites (--baseline-commit) until the old ones are fixed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - run: semgrep scan --config p/typescript --config p/security-audit --config .semgrep/rollover-catch-up.yml --config https://raw.githubusercontent.com/Nishfleet/fleet-ops/59f43b2bdc2a07ae1a5909117c4bad17a3666abe/.semgrep/no-glue.yml --error
      - run: semgrep scan --test --config .semgrep/rollover-catch-up.yml .semgrep/rollover-catch-up.ts
      - run: semgrep scan --test --config .semgrep/latest-row-tie-break.yml .semgrep/latest-row-tie-break.ts
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && semgrep scan --config .semgrep/latest-row-tie-break.yml --baseline-commit "$BASE" --error

  preview-build:
    # Owner acceptance (fleet-ops#10935): every pull request gets a preview link on staging data.
    # PR code builds here with no secret; the upload job below holds the token and runs no PR code.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx react-router build --mode preview
        env:
          CLOUDFLARE_VITE_FORCE_BUILD_OUTPUT: "true"
          PREVIEW_ORIGIN: https://pr-${{ github.event.pull_request.number }}-0509-preview.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: preview-build, path: .cloudflare/output, include-hidden-files: true, retention-days: 3}

  preview:
    # Uploads the build as a never-deployed version of 0509-preview with a pr-<number> alias, on
    # staging's D1, R2, KV and queues. Cloudflare gives no preview URL to a Worker that implements a
    # Durable Object, so this Worker exports none and binds staging's (cloudflare.config.ts, preview mode).
    # Dependabot, fork and merge-queue runs get no secret and report success without an upload.
    needs: preview-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: {name: preview, url: "${{ steps.upload.outputs.url }}"}
    env:
      UPLOAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: preview-build, path: .cloudflare/output}
      - id: upload
        if: env.UPLOAD == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED: https://pr-${{ github.event.pull_request.number }}-0509-preview.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
        run: |
          set -o pipefail
          npx --yes cf@1.0.0-beta.17 workers versions create --prebuilt --mode preview --preview-alias "pr-$PR" --message "PR #$PR" | tee upload.log
          url=$(grep -oE "https://pr-$PR-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)
          [ "$url" = "$EXPECTED" ] || { echo "::error::preview URL '$url' is not the sign-in origin '$EXPECTED'"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - if: env.UPLOAD != 'true'
        run: echo "No upload on $GITHUB_EVENT_NAME; the preview needs a same-repo, non-Dependabot pull request."

  base-fresh:
    # Kept only while ruleset 21391031 still requires this context (docs/incidents/2026-10-07-stale-base-queue-ejections.md).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The merge queue tests the merge result, so a stale base cannot land."

  dependency-review:
    # GitHub's own check: fails a PR that adds a dependency with a known vulnerability.
    # Outside ci-ok by design: it has nothing to compare on merge_group, so it skips there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-ok:
    # One verdict for the ruleset; an allowlist, because a cancelled job once passed a denylist
    # (docs/incidents/2026-10-05-ci-ok-passed-with-gates-cancelled.md).
    needs: [checks, test, e2e, secrets, semgrep, preview-build, preview]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
