  dependabot-critical-check:
    # Required context (branch protection). Same no-skip contract as
    # codex-node-checks: no job-level if:/needs:, authorizer is step 1,
    # fork PR or unapproved dispatch fails with a real failure.
    # Queries open critical Dependabot alerts on direct dependencies.
    name: dependabot-critical-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      vulnerability-alerts: read
    timeout-minutes: 10
    steps:
      - name: Authorize exact verification candidate
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "Nishfleet/0509"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
