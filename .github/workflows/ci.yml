name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  codex-node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
