name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for verification
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  vulnerability-alerts: read

env:
  VITEST_TOTAL_SHARDS: "4"

jobs:
  codex-node-checks:
    # Required context (branch protection). It must be structurally incapable
    # of concluding SKIPPED: GitHub counts a skipped required context as
    # satisfying branch protection, so there is NO job-level `if:` and NO
    # `needs` here (a job with needs is skipped when its dependency fails;
    # an if: can skip on cancellation or any future condition edit). The
    # authorizer is step 1 of THIS job, so a fork PR or unapproved dispatch
    # candidate fails the required check with a real failure - a gate that
    # cannot verify must say no, never render green or skipped. This contract
    # is identical for the sibling shard jobs below; tests/required-context-no-skip.test.ts
    # enforces it structurally across all of them.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The sibling-shard aggregate step (0509#3261) reads the Checks API.
      checks: read
    # The 270m job cap bounds setup plus all per-step waits. Each heavy step has
    # one 180m total budget shared between its lane slot and the deploy gate.
    timeout-minutes: 270
    steps:
      - name: Authorize exact verification candidate
        # Fork guard as a step, not a job: it refuses fork PRs and unapproved
        # dispatch candidates with a real failure of the required job.
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "Nishfleet/0509"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            merge_group)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" =~ ^refs/heads/gh-readonly-queue/ ]]
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - name: Build
        run: npm run build
      - name: Test (shard 1 of ${{ env.VITEST_TOTAL_SHARDS }})
        run: |
          set -euo pipefail
          bash ./scripts/ci-vitest-run.sh -- \
            npx --no-install vitest run --configLoader runner \
              --shard=1/${{ env.VITEST_TOTAL_SHARDS }} \
              --project node --coverage
          bash ./scripts/ci-vitest-run.sh -- \
            npx --no-install vitest run --configLoader runner \
              --project workers
      - name: Typecheck
        env:
          # 4096 MB, uniformly with deploy-production.yml and
          # preview-assert.yml (0509#3303): the old 2048 MB pin sat at the
          # measured `tsc -b` peak (~2030 MB, run 34693260245) so the step
          # exited 134 intermittently and unpredictably on retrigger.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck
      - name: Fail if any sibling shard failed (aggregate, 0509#3261)
        # ONLY "codex-node-checks" (this job) is in required_status_checks;
        # shards 2-4 are not, so before this step a red shard merged red
        # (0509#3261: #3336 merged while codex-node-checks-shard-4 was failing).
        # The never-conclude-skipped contract (tests/required-context-no-skip.test.ts)
        # bans `needs:` on this required job, so the aggregate polls the Checks
        # API for the three sibling shard check-runs of the SAME head SHA and
        # fails this required context when any concludes non-success. A
        # conclusion that never arrives fails closed at the deadline: a gate
        # that cannot verify must say no, never render green or skipped. The
        # 200m deadline covers a sibling's 180m lane-slot budget (see the job
        # cap comment); the 270m job cap bounds setup + own work + this wait.
        # Latest check-run per name: the endpoint returns the most recent
        # first, so a re-run's fresh check-run shadows a stale one.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.authorize.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 200 * 60))
          while :; do
            pending=0
            bad=""
            for shard in 2 3 4; do
              state="$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/${REPO}/commits/${SHA}/check-runs?check_name=codex-node-checks-shard-${shard}&per_page=1" \
                --jq '.check_runs[0] // {} | "\(.status // "missing") \(.conclusion // "pending")"' \
                2>/dev/null || echo "missing pending")"
              status="${state%% *}"
              conclusion="${state#* }"
              echo "codex-node-checks-shard-${shard}: status=${status} conclusion=${conclusion}"
              if [ "${status}" != "completed" ]; then
                pending=$((pending + 1))
              elif [ "${conclusion}" != "success" ]; then
                bad="${bad} shard-${shard}=${conclusion}"
              fi
            done
            if [ -n "${bad}" ]; then
              echo "::error::Aggregate: a sibling shard did not conclude success on ${SHA}:${bad} (0509#3261)"
              exit 1
            fi
            if [ "${pending}" -eq 0 ]; then
              echo "Aggregate: all three sibling shards concluded success on ${SHA}"
              exit 0
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::Aggregate: ${pending} sibling shard(s) unresolved at the 200m deadline - failing closed (0509#3261)"
              exit 1
            fi
            sleep 60
          done

