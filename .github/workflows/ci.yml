name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-node-checks:
    if: github.repository == 'nish3451/0509' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.RECOVERY_RUNNER || 'ubuntu-latest' }}
    # Bounded verification lanes allow CI to share the VPS without blocking every
    # isolated fleet worktree behind one global owner.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            ./scripts/deploy-window-lock.sh run -- npm ci --ignore-scripts
          else
            ./scripts/deploy-window-lock.sh run -- npm install --ignore-scripts
          fi
      - name: Build
        run: ./scripts/deploy-window-lock.sh run -- npm run build
      - name: Test
        run: ./scripts/deploy-window-lock.sh run -- npm run test
      - name: Typecheck
        run: ./scripts/deploy-window-lock.sh run -- npm run typecheck
