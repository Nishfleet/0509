name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for verification
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  vulnerability-alerts: read

env:
  VITEST_TOTAL_SHARDS: "4"

jobs:
  codex-node-checks:
    # Required context (branch protection). It must be structurally incapable
    # of concluding SKIPPED: GitHub counts a skipped required context as
    # satisfying branch protection, so there is NO job-level `if:` and NO
    # `needs` here (a job with needs is skipped when its dependency fails;
    # an if: can skip on cancellation or any future condition edit). The
    # authorizer is step 1 of THIS job, so a fork PR or unapproved dispatch
    # candidate fails the required check with a real failure - a gate that
    # cannot verify must say no, never render green or skipped. This contract
    # is identical for the sibling shard jobs below; tests/required-context-no-skip.test.ts
    # enforces it structurally across all of them.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The 270m job cap bounds setup plus all per-step waits. Each heavy step has
    # one 180m total budget shared between its lane slot and the deploy gate.
    timeout-minutes: 270
    steps:
      - name: Authorize exact verification candidate
        # Fork guard as a step, not a job: it refuses fork PRs and unapproved
        # dispatch candidates with a real failure of the required job.
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "Nishfleet/0509"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            merge_group)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" =~ ^refs/heads/gh-readonly-queue/ ]]
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - name: Build
        run: npm run build
      - name: npm audit (high gate)
        # Standing rule from issue #2970: nothing fails silently. A high-or-above
        # advisory in the dependency tree fails this required check.
        #
        # Deliberately NOT `--omit=dev`: the four advisories #2970 was opened
        # for (sharp, browserslist, baseline-browser-mapping,
        # @simplewebauthn/server) are dev/transitive in this lockfile, so an
        # --omit=dev run cannot see sharp or browserslist at all and the gate
        # would be decorative for the very class it exists to catch. Measured:
        # with the vulnerable sharp 0.35.3 pinned, `--omit=dev --audit-level=high`
        # exits 0 while `--audit-level=high` exits 1. The production-only view is
        # still printed below as signal, not used as the gate.
        #
        # This step lives in codex-node-checks (shard 1) rather than in
        # dependabot-critical-check on purpose. That job carries an extra
        # `vulnerability-alerts: read` permission, which makes it the one job in
        # this workflow that CodeQL's cache-poisoning/poisonable-step query
        # (CWE-349, high) reports for running a package-manager command after a
        # dynamic-ref checkout under workflow_dispatch. Shard 1 already installs
        # dependencies, already runs npm, is already a required context, and is
        # not reported — so the audit runs here and the sink is removed rather
        # than suppressed or regex-shaped around.
        run: |
          set -euo pipefail
          echo '::group::production dependencies (--omit=dev, informational)'
          npm audit --omit=dev || true
          echo '::endgroup::'
          npm audit --audit-level=high
      - name: Test (shard 1 of ${{ env.VITEST_TOTAL_SHARDS }})
        run: |
          set -euo pipefail
          bash ./scripts/ci-vitest-run.sh -- \
            npx --no-install vitest run --configLoader runner \
              --shard=1/${{ env.VITEST_TOTAL_SHARDS }} \
              --project node --coverage
          bash ./scripts/ci-vitest-run.sh -- \
            npx --no-install vitest run --configLoader runner \
              --project workers
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run typecheck

  codex-node-checks-shard-2:
