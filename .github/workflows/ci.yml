              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - name: Query open critical Dependabot alerts on direct deps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alerts=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dependabot/alerts?state=open&severity=critical&dependency_type=direct" \
            --jq 'length')
          if [ "$alerts" -gt 0 ]; then
            echo "::error::Found $alerts open critical Dependabot alert(s) on direct dependencies"
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/dependabot/alerts?state=open&severity=critical&dependency_type=direct" \
              --jq '.[] | "\(.security_vulnerability.package.name) \(.security_vulnerability.severity) \(.security_vulnerability.advisory.ghsa_id) \(.html_url)"'
            exit 1
          fi
          echo "No open critical Dependabot alerts on direct dependencies"
