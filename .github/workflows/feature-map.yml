# Maintains .agents/skills/verify/feature-map.md from a run of the app (0509#4252).
# A drifted map opens one PR. A clean map writes "no drift at <sha>" and the
# route list to the job summary. A run that does neither fails.
#
# anthropics/claude-code-action throws "Unsupported event type: push"
# (it accepts workflow_dispatch). A push re-dispatches this workflow, and the
# action runs on that workflow_dispatch. GITHUB_TOKEN is allowed to create
# workflow_dispatch runs.
name: feature-map

on:
  push:
    branches:
      - main
    paths:
      - app/routes.ts
      - app/routes/**
      - e2e/**
      - .agents/skills/verify/**
  pull_request:
    paths:
      - app/routes.ts
      - app/routes/**
      - e2e/**
      - .agents/skills/verify/**
  workflow_dispatch:

concurrency:
  group: feature-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  relay:
    name: re-dispatch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-dispatch so the action runs on workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run feature-map.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  sync:
    name: feature-map
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Mint worker app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.NISHFLEET_WORKER_APP_ID }}
          private-key: ${{ secrets.NISHFLEET_WORKER_PRIVATE_KEY }}
          owner: Nishfleet
          repositories: "0509"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Sync the feature map
        id: claude
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # main 2026-09-22, Claude Code 2.1.280 (first to know claude-opus-5-5)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          # workflow_dispatch from the relay is github-actions. A direct
          # dispatch by the worker app is nishfleet-worker. The prompt is
          # this file, not text the actor supplies.
          allowed_bots: "nishfleet-worker,github-actions"
          prompt: |
            SHA: ${{ env.SHA }}
            REPO: ${{ github.repository }}
            BASE: ${{ env.BASE }}

            You maintain `.agents/skills/verify/feature-map.md`. Read `.agents/skills/verify/SKILL.md` and follow its Local section. Do this and nothing else.

            1. Read `app/routes.ts`, every route module's rendered controls, and the `e2e/` test titles.
            2. Build the app and drive every route with the verify skill (`npm run verify:start`, then `take_snapshot` per route). The map's Reach column must name the controls the snapshot actually shows, by role and accessible name. In one shell: `npm run build`, `export PLAYWRIGHT_LOCAL_PORT="${PLAYWRIGHT_LOCAL_PORT:-$((8000 + $$ % 1000))}"`, `npx wrangler d1 migrations apply 0509 --local </dev/null`, then start the server in the background with `npx wrangler dev --env-file .dev.vars.example --local --port "$PLAYWRIGHT_LOCAL_PORT" </dev/null &`. Do not leave `wrangler dev` in the foreground. Wait until `curl -fsS "http://127.0.0.1:${PLAYWRIGHT_LOCAL_PORT}/api/health"` returns. Then `npx chrome-devtools new_page` and `take_snapshot` for every route in `app/routes.ts`.
            3. If any row drifted, open a pull request titled exactly `feature-map: sync with ${{ env.SHA }}` against branch `${{ env.BASE }}` that changes only `.agents/skills/verify/feature-map.md`. The pull request body carries the `take_snapshot` output each changed row was built from. Drift means: a route in `app/routes.ts` with no row; a route row whose path is not a route in `app/routes.ts`; a Proof cell that names a `e2e/` or `tests/` file that is not in the repo; a Reach cell that names a control the snapshot of that rendered page lacks. Rows under the heading "Not a route" are not route rows. A route that redirects to `/login` shows the login page to an anonymous session: record that snapshot, and do not rewrite that row's signed-in controls because they were behind the redirect.
            4. No drift: write `no drift at ${{ env.SHA }}` and the route list to `$GITHUB_STEP_SUMMARY`. A silent run counts as a failure: if you neither open that pull request nor write that line, exit non-zero.
            The job fails loudly if the app does not start or a route returns 5xx. Write the first line of `$RUNNER_TEMP/feature-map-outcome.txt` as exactly one of:
            - `no drift at ${{ env.SHA }}` followed by the route list, one path per line
            - `opened PR <number>`
            - `app failed: <reason>`
            - `route failed: <url> <status>`
            Append that same text to `$GITHUB_STEP_SUMMARY`. On `app failed` or `route failed`, exit non-zero. Do not edit any file except `.agents/skills/verify/feature-map.md`. Do not push to `main`. Open the pull request with `gh pr create` using the branch `feature-map-sync-${{ env.SHA }}`.
          claude_args: |
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh:*),Bash(curl:*)"

      - name: A silent run is a failure
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          outcome="${RUNNER_TEMP}/feature-map-outcome.txt"
          if [ -s "$outcome" ]; then
            cat "$outcome" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CLAUDE_OUTCOME" != "success" ]; then
            echo "claude step ${CLAUDE_OUTCOME}" >&2
            exit 1
          fi
          if [ ! -s "$outcome" ]; then
            echo "silent run: no outcome file" >&2
            exit 1
          fi
          first=$(head -n 1 "$outcome")
          if [ "$first" = "no drift at ${SHA}" ]; then
            test -n "$(tail -n +2 "$outcome")"
            exit 0
          fi
          number=$(printf '%s\n' "$first" | sed -n 's/^opened PR #\{0,1\}\([0-9][0-9]*\)$/\1/p')
          if [ -n "$number" ]; then
            title=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
            test "$title" = "feature-map: sync with ${SHA}"
            files=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json files --jq '[.files[].filename] | join(" ")')
            test "$files" = ".agents/skills/verify/feature-map.md"
            exit 0
          fi
          case "$first" in
            "app failed:"*|"route failed:"*)
              echo "$first" >&2
              exit 1
              ;;
            *)
              echo "silent run: ${first}" >&2
              exit 1
              ;;
          esac
