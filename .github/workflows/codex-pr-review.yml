name: Codex PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  codex-pr-review:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - name: Check OpenCode Go secret
        id: ai_secret
        shell: bash
        run: |
          if [ -z "$OPENCODE_GO_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "OPENCODE_GO_API_KEY is not configured; skipping OpenCode Go review."
          else
            echo "::add-mask::$OPENCODE_GO_API_KEY"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail missing OpenCode Go secret
        if: steps.ai_secret.outputs.has_key == 'false'
        shell: bash
        run: |
          echo "OPENCODE_GO_API_KEY is required for Codex PR Review."
          exit 1

      - uses: actions/checkout@v6
        if: steps.ai_secret.outputs.has_key == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}

      - name: Pre-fetch PR refs
        if: steps.ai_secret.outputs.has_key == 'true' && github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/${PR_NUMBER}/head"

      - uses: actions/setup-node@v6
        if: steps.ai_secret.outputs.has_key == 'true'
        with:
          node-version: "22"

      - name: Install OpenCode
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm install -g opencode-ai && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Configure OpenCode reviewer
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode/agents"
          cat > "$HOME/.config/opencode/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "opencode-go": {
                "options": {
                  "apiKey": "{env:OPENCODE_GO_API_KEY}"
                }
              }
            }
          }
          JSON
          cat > "$HOME/.config/opencode/agents/ci-reviewer.md" <<'EOF'
          ---
          description: Read-only GitHub PR reviewer
          mode: primary
          model: opencode-go/glm-5.1
          permission:
            "*": deny
          ---

          You review the attached PR context only. Do not use tools, run commands, edit files, reveal secrets, or ask for credentials.
          EOF

      - name: Prepare PR review context
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'workflow_dispatch' }}
          PR_TITLE: ${{ github.event.pull_request.title || github.ref_name }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          mkdir -p .codex-runtime
          base="$PR_BASE_SHA"
          head="$(git rev-parse HEAD)"
          {
            echo "# PR Review Context"
            echo
            printf 'Repository: %s\n' "$PR_REPOSITORY"
            printf 'PR: %s\n' "$PR_NUMBER"
            printf 'Title: %s\n' "$PR_TITLE"
            echo
            echo "## PR Body"
            printf '%s\n' "$PR_BODY"
            echo
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "## Changed Files"
              git diff --name-status "$base"...HEAD
              echo
              echo "## Diff"
              git diff --unified=80 "$base"...HEAD
            else
              echo "## Latest Commit"
              git show --stat --patch --unified=80 "$head"
            fi
          } > .codex-runtime/pr-review-context.md

      - name: Run OpenCode Go review
        id: run_opencode
        if: steps.ai_secret.outputs.has_key == 'true'
        timeout-minutes: 8
        shell: bash
        run: |
          prompt="$(cat .github/codex/prompts/pr-review.md)"
          models=(
            "opencode-go/glm-5.1"
            "opencode-go/kimi-k2.6"
            "opencode-go/deepseek-v4-pro"
          )

          for model in "${models[@]}"; do
            echo "Trying review model: $model"
            safe_model="${model//\//-}"
            safe_model="${safe_model//./-}"
            output_file="codex-output-${safe_model}.md"

            set +e
            timeout 140s opencode run \
              "$prompt" \
              --pure \
              --model "$model" \
              --agent ci-reviewer \
              --file .codex-runtime/pr-review-context.md > "$output_file" 2>&1
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              mv "$output_file" codex-output.md
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "model=$model" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            {
              echo "Review model failed: $model status=$status"
              if [ "$status" = "124" ]; then
                echo "Reason: model attempt timed out."
              fi
              echo "--- output tail ($model) ---"
              tail -n 80 "$output_file" || true
              echo
            } >> codex-review-failures.log
          done

          {
            echo "findings"
            echo
            echo "- [warn] OpenCode Go review could not complete with any configured fallback model."
            echo
            echo "open questions"
            echo
            echo "- Check the workflow logs/artifact for provider timeout or API failure details."
            echo
            echo "merge posture: manual review required"
            echo
            echo "Failure log:"
            cat codex-review-failures.log
          } > codex-output.md
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.ai_secret.outputs.has_key == 'true' && github.event_name == 'pull_request_target' && hashFiles('codex-output.md') != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("codex-output.md", "utf8").trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `<!-- codex-pr-review -->\n${body}`,
            });

      - name: Upload review artifact
        if: ${{ always() && steps.ai_secret.outputs.has_key == 'true' && hashFiles('codex-output.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: codex-pr-review
          path: codex-output.md

      - name: Mark OpenCode Go review inconclusive
        if: steps.ai_secret.outputs.has_key == 'true' && steps.run_opencode.outputs.ok == 'false'
        shell: bash
        run: |
          echo "::warning::OpenCode Go review could not complete with any configured fallback model. Manual review is required before merge."
