name: Cross-browser matrix

# Re-homed from the production deploy (2026-07-20): the engine matrix is a
# DIAGNOSTIC, not a release gate. It runs nightly and on demand; failures
# open visibility, not blocked deploys. The canonical chromium 66-journey
# proof remains the deploy's release gate.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

concurrency:
  group: cross-browser-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Engine matrix (firefox/webkit/mobile)
    if: github.repository == 'Nishfleet/0509' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Run cross-browser risk proof
        run: node scripts/run-cross-browser-risk-proof.mjs

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-browser-failures
          path: test-results/
          retention-days: 7
