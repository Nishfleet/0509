name: Cross-browser matrix

# Re-homed from the production deploy (2026-07-20): the engine matrix is a
# DIAGNOSTIC, not a release gate. It runs nightly and on demand; failures
# open visibility, not blocked deploys. The canonical chromium 66-journey
# proof remains the deploy's release gate.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Engine matrix (firefox/webkit/mobile)
    if: github.repository == 'nish3451/0509'
    runs-on: ${{ vars.MONITORING_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers with system dependencies
        if: runner.environment == 'github-hosted'
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Install Playwright browsers
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium firefox webkit

      - name: Build
        run: npm run build

      - name: Run cross-browser risk proof
        run: node scripts/run-cross-browser-risk-proof.mjs

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-failures
          path: test-results/
          retention-days: 7
