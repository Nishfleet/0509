name: Cross-browser matrix

# Re-homed from the production deploy (2026-07-20): the engine matrix is a
# DIAGNOSTIC, not a release gate. It runs nightly and on demand; failures
# open visibility, not blocked deploys. The canonical chromium 66-journey
# proof remains the deploy's release gate.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

concurrency:
  group: cross-browser-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Engine matrix (firefox/webkit/mobile)
    if: github.repository == 'nish3451/0509' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vps-verify]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install dependencies
        run: ./scripts/deploy-window-lock.sh run -- npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./scripts/deploy-window-lock.sh run -- npx playwright install chromium firefox webkit

      - name: Build
        run: ./scripts/deploy-window-lock.sh run -- npm run build

      - name: Run cross-browser risk proof
        run: ./scripts/deploy-window-lock.sh run -- node scripts/run-cross-browser-risk-proof.mjs

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-browser-failures
          path: test-results/
          retention-days: 7
