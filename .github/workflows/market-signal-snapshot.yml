name: Daily market-signal D1 snapshot

# Restores the daily 0509 market-signal D1 snapshot after the host cron's
# wrangler OAuth session expired 2026-08-04T13:26:24Z and could not refresh in
# a non-interactive cron (no CLOUDFLARE_API_TOKEN there), which left the
# snapshot stale for five mornings (scout 2026-08-09; see PR #557 for the
# self-diagnosing failure classifier). This workflow generates the snapshot on
# a GitHub-hosted runner using the production-environment
# Cloudflare token secrets and commits it to main, so the host Hermes job
# never needs a Cloudflare credential at all.
#
# History: this job previously required a self-hosted runner because
# GitHub-hosted jobs were intermittently refused with "recent account payments
# have failed or your spending limit needs to be increased", which is exactly
# how the snapshot went stale before. That billing fault is resolved and every
# workflow in this repository now runs on GitHub-hosted runners (2026-08-23).
# If hosted jobs start being refused again, this is the first symptom to expect.
#
# The commit is a no-op when the snapshot is unchanged.
#
# The snapshot is published to a dedicated automation-owned data branch
# (`automation/market-signal-snapshot`), NOT merged to main. The previous shape
# landed on protected main through a PR squash merge, but the Nishfleet org
# policy "Allow GitHub Actions to create and approve pull requests" is disabled,
# so `gh pr create` died with a GraphQL error on every run from 2026-08-21 on.
# Flipping that org setting needs admin:org scope and loosens an org-wide
# security control for one daily data file, which is not worth it. Pushing to a
# data branch needs no PR, so no org or repo policy is weakened. Hermes reads
# the snapshot from this branch directly (see
# automation/HERMES_MARKET_SIGNAL.md), so no human merge is required for the
# daily signal to flow. A human can review the snapshot diff on the data branch
# at any time; the publish step writes a job summary pointing at it, which is
# the mechanism that surfaces the snapshot to a human without Actions opening a
# PR. A snapshot that cannot be produced or pushed fails the job -- never exit 0
# on a publish failure.
on:
  schedule:
    # Daily 00:07 UTC = 05:37 IST: before the Hermes morning report reads the
    # snapshot, and outside the 20:07/20:47 UTC provider-mutation windows.
    - cron: "7 0 * * *"
  workflow_dispatch:

concurrency:
  group: 0509-production-provider-mutations
  cancel-in-progress: false
  queue: max

# The snapshot script reads the repository's issue list for the github section
# of the signal, so the token needs issues: read in addition to the contents
# write needed to push the snapshot to the data branch. Without issues: read
# the script's `gh api .../issues` call dies with "Resource not accessible by
# integration (HTTP 403)" (seen on the first three restored runs,
# 2026-08-12T01:21Z/01:29Z/01:33Z); since #682 the scheduled token carries
# issues: read, and if a read ever fails again the script degrades to
# github: { unavailable: true } and the snapshot still publishes.
# No pull-requests scope is requested: the snapshot no longer lands through a
# PR, so the workflow never needs to create or merge one.
permissions:
  contents: write
  issues: read

jobs:
  snapshot:
    name: Generate and commit market-signal snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Scheduled runs execute on the default branch; manual dispatches must also
    # name main so a branch dispatch cannot push the snapshot from a fork.
    if: github.ref == 'refs/heads/main'
    env:
      SNAPSHOT_PATH: ops/market-signal/0509-market-signal.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Refuse empty Cloudflare secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "market_signal_missing_cloudflare_secret: ${missing[*]}" >&2
            exit 1
          fi
          echo "market_signal_cloudflare_secrets_present"
      - name: Generate market-signal D1 snapshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/market-signal-wrangler-config
        run: |
          unset CF_API_TOKEN CF_API_KEY CF_EMAIL CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL
          npm run signal:market -- --output "$SNAPSHOT_PATH"
      - name: Verify snapshot freshness
        run: |
          node -e "
            const fs = require('fs');
            const snapshot = JSON.parse(fs.readFileSync(process.env.SNAPSHOT_PATH, 'utf8'));
            const generatedAt = Date.parse(snapshot.generatedAt);
            if (!Number.isFinite(generatedAt)) {
              console.error('market_signal_snapshot_invalid: generatedAt missing');
              process.exit(1);
            }
            if (Math.abs(Date.now() - generatedAt) > 60 * 60 * 1000) {
              console.error('market_signal_snapshot_stale: ' + snapshot.generatedAt);
              process.exit(1);
            }
            console.log('market_signal_snapshot_fresh ' + snapshot.generatedAt);
          "
      - name: Publish snapshot to data branch
        # The snapshot is pushed to a dedicated automation-owned data branch
        # instead of merged to main, because the Nishfleet org forbids Actions
        # from creating PRs (see the workflow header). No PR is opened, so no
        # org or repo policy is weakened. The branch is automation-owned (one
        # commit on top of main per day), so a force push is safe. A snapshot
        # that cannot be pushed fails the job -- never exit 0 on a publish
        # failure. The job summary surfaces the branch and commit to a human
        # for review without Actions opening a PR; Hermes reads the snapshot
        # from this branch directly (automation/HERMES_MARKET_SIGNAL.md).
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SNAPSHOT_PATH"
          if git diff --cached --quiet; then
            echo "market_signal_snapshot_unchanged"
            exit 0
          fi
          git commit -m "chore(automation): daily market-signal D1 snapshot $(date -u +%Y-%m-%d)"
          SNAPSHOT_BRANCH="automation/market-signal-snapshot"
          # -C resets an existing data branch from a rerun instead of failing;
          # the branch is automation-owned, so a force push is safe.
          git switch -C "$SNAPSHOT_BRANCH"
          # --force-if-includes refuses the push if a remote-only commit has
          # slipped in (e.g. a manual commit landed on the data branch). If the
          # branch has no upstream yet, --force creates it; the automation owns
          # the branch so a force push is safe and the explicit fallback keeps
          # the workflow from dying on the very first run.
          set +e
          git push --force-if-includes origin "HEAD:$SNAPSHOT_BRANCH"
          push_status=$?
          set -e
          if [ "$push_status" -ne 0 ]; then
            git push --force origin "HEAD:$SNAPSHOT_BRANCH"
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          BRANCH_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${SNAPSHOT_BRANCH}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"
          echo "market_signal_snapshot_published ${BRANCH_URL}"
          # Surface the snapshot to a human without Actions opening a PR: the
          # data branch and commit are reviewable in the GitHub UI, and this
          # job summary records where to look. Hermes reads the snapshot from
          # this branch directly, so no human merge is required for the daily
          # signal to flow.
          {
            echo "## Market-signal snapshot published"
            echo ""
            echo "Branch: ${BRANCH_URL}"
            echo "Commit: ${COMMIT_URL}"
            echo ""
            echo "The snapshot is pushed to \`${SNAPSHOT_BRANCH}\` instead of merged to \`main\`, because the Nishfleet org forbids Actions from creating PRs. Hermes reads it from this branch (see \`automation/HERMES_MARKET_SIGNAL.md\`). Review the diff on the branch before it feeds the morning report."
          } >> "$GITHUB_STEP_SUMMARY"
