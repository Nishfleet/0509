name: Daily market-signal D1 snapshot

# Restores the daily 0509 market-signal D1 snapshot after the host cron's
# wrangler OAuth session expired 2026-08-04T13:26:24Z and could not refresh in
# a non-interactive cron (no CLOUDFLARE_API_TOKEN there), which left the
# snapshot stale for five mornings (scout 2026-08-09; see PR #557 for the
# self-diagnosing failure classifier). This workflow generates the snapshot on
# the repository's self-hosted verify runner using the production-environment
# Cloudflare token secrets and commits it to main, so the host Hermes job
# never needs a Cloudflare credential at all.
#
# The runner must be self-hosted like every other workflow in this repository
# (d1-backup-r2, d1-remote-restore-evidence, uptime-health, ...): GitHub-hosted
# jobs are intermittently refused with "recent account payments have failed or
# your spending limit needs to be increased", which is exactly how the snapshot
# went stale before. The lane-wrapped commands below and the conditional npm
# cache are the same self-hosted-aware pattern the d1-backup workflows use.
#
# The commit is a no-op when the snapshot is unchanged, and no workflow in this
# repository triggers on push to main, so a snapshot commit cannot cascade CI
# or deploys.
#
# The snapshot lands on protected main through a PR squash merge: a direct push
# is rejected with GH006 (strict required status checks, enforce_admins). The
# landing step arms GitHub auto-merge and waits for the required checks before
# confirming the merge, so a fresh snapshot is committed every morning without
# a human in the loop (see the step comment for the race this closes).
on:
  schedule:
    # Daily 00:07 UTC = 05:37 IST: before the Hermes morning report reads the
    # snapshot, and outside the 20:07/20:47 UTC provider-mutation windows.
    - cron: "7 0 * * *"
  workflow_dispatch:

concurrency:
  group: 0509-market-signal-snapshot
  cancel-in-progress: false
  queue: max

# The snapshot script reads the repository's issue list for the github section
# of the signal, so the token needs issues: read in addition to the write
# needed to commit the snapshot. Without it gh api .../issues dies with
# "Resource not accessible by integration (HTTP 403)" (seen on the first
# three restored runs, 2026-08-12T01:21Z/01:29Z/01:33Z). Since #682 the
# scheduled token carries issues: read; if a read ever fails again, the script
# degrades to github: { unavailable: true } and the snapshot still commits.
# pull-requests: write is needed because main's branch protection rejects
# direct pushes (strict required status checks, enforce_admins) with GH006,
# so the snapshot lands through a PR squash merge.
permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  snapshot:
    name: Generate and commit market-signal snapshot
    runs-on: [self-hosted, linux, x64, vps-verify]
    timeout-minutes: 30
    environment: production
    # Scheduled runs execute on the default branch; manual dispatches must also
    # name main so a branch dispatch cannot push the snapshot from a fork.
    if: github.ref == 'refs/heads/main'
    env:
      SNAPSHOT_PATH: ops/market-signal/0509-market-signal.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install pinned dependencies
        run: ./scripts/deploy-window-lock.sh run -- npm ci --ignore-scripts
      - name: Refuse empty Cloudflare secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "market_signal_missing_cloudflare_secret: ${missing[*]}" >&2
            exit 1
          fi
          echo "market_signal_cloudflare_secrets_present"
      - name: Generate market-signal D1 snapshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/market-signal-wrangler-config
        run: |
          unset CF_API_TOKEN CF_API_KEY CF_EMAIL CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL
          ./scripts/deploy-window-lock.sh run -- npm run signal:market -- --output "$SNAPSHOT_PATH"
      - name: Verify snapshot freshness
        run: |
          node -e "
            const fs = require('fs');
            const snapshot = JSON.parse(fs.readFileSync(process.env.SNAPSHOT_PATH, 'utf8'));
            const generatedAt = Date.parse(snapshot.generatedAt);
            if (!Number.isFinite(generatedAt)) {
              console.error('market_signal_snapshot_invalid: generatedAt missing');
              process.exit(1);
            }
            if (Math.abs(Date.now() - generatedAt) > 60 * 60 * 1000) {
              console.error('market_signal_snapshot_stale: ' + snapshot.generatedAt);
              process.exit(1);
            }
            console.log('market_signal_snapshot_fresh ' + snapshot.generatedAt);
          "
      - name: Commit snapshot to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SNAPSHOT_PATH"
          if git diff --cached --quiet; then
            echo "market_signal_snapshot_unchanged"
            exit 0
          fi
          git commit -m "chore(automation): daily market-signal D1 snapshot $(date -u +%Y-%m-%d)"
          # main is protected (strict required status checks, enforce_admins), so
          # a direct push is rejected with GH006. Land the snapshot through a PR
          # and merge it with the REST API; the repo has allow_auto_merge enabled
          # and every human merge so far is a plain squash merge, so this matches
          # repository practice.
          #
          # The merge must wait for the required checks (codex-node-checks,
          # Gitleaks, required-verifier-integrity): calling gh pr merge
          # immediately after gh pr create loses the race on every run ("required
          # status check is expected") and the snapshot never lands. Arm GitHub
          # auto-merge first so the squash merge still lands even if this workflow
          # run dies after this point, then watch the required checks and fail
          # loudly on a check failure or on a stuck wait.
          SNAPSHOT_BRANCH="automation/market-signal-snapshot-$(date -u +%Y%m%d)"
          # Use a single automation branch per day so concurrent and stuck
          # runs land on the same PR (the previous timestamped branch per run
          # produced 30+ stale PRs that the merge step kept racing and never
          # resolving). A fresh suffix only changes if the previous run's PR
          # is still open or unmerged - that keeps daily snapshots idempotent.
          EXISTING_PR="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${SNAPSHOT_BRANCH}" --json number --jq '.[0].number' || true)"
          if [ -n "${EXISTING_PR}" ] && [ "${EXISTING_PR}" != "null" ]; then
            PR_URL="$(gh pr view "${EXISTING_PR}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)"
            echo "market_signal_snapshot_existing_pr ${PR_URL}"
          else
            # -C resets an existing branch from a same-day rerun instead of
            # failing; the branch is automation-owned, so a force push is safe.
            git switch -C "$SNAPSHOT_BRANCH"
            # Use --force-if-includes to refuse the push if a remote-only
            # commit has slipped in (e.g. a manual commit landed after the
            # last restore). If the branch has no upstream yet, --force
            # creates it; the automation owns the branch so a force push is
            # safe and the explicit fallback keeps the workflow from dying
            # on the very first run of the day.
            set +e
            git push --force-if-includes origin "HEAD:$SNAPSHOT_BRANCH"
            push_status=$?
            set -e
            if [ "$push_status" -ne 0 ]; then
              git push --force origin "HEAD:$SNAPSHOT_BRANCH"
            fi
            # Self-hosted runners ship an older gh where `pr create --json` is
            # unsupported; the command prints the PR URL on stdout instead.
            PR_URL="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "$SNAPSHOT_BRANCH" \
              --title "chore(automation): daily market-signal D1 snapshot $(date -u +%Y-%m-%d)" \
              --body "Automated daily market-signal D1 snapshot.

              Generated by the scheduled market-signal-snapshot workflow. Main's branch protection
              rejects direct pushes (strict required status checks), so the snapshot lands through
              this PR and a squash merge.")"
            echo "market_signal_snapshot_pr $PR_URL"
          fi
          gh pr merge "$PR_URL" --repo "${GITHUB_REPOSITORY}" --auto --squash --delete-branch \
            --subject "chore(automation): daily market-signal D1 snapshot $(date -u +%Y-%m-%d)"
          # Watch only the required checks; --watch returns 0 when all of them
          # pass and non-zero when one fails. A wait longer than 25 minutes means
          # a check is stuck or the runner pool is saturated: fail loudly and let
          # the next scheduled run retry. Even if this wait is killed by the
          # 30-minute job cap, auto-merge above still lands the squash merge the
          # moment the required checks pass, so the snapshot is not lost.
          set +e
          timeout 1500 gh pr checks "$PR_URL" --repo "${GITHUB_REPOSITORY}" --watch --required --interval 15 --fail-fast
          checks_status=$?
          set -e
          if [ "$checks_status" -ne 0 ]; then
            if [ "$checks_status" -eq 124 ]; then
              echo "market_signal_snapshot_checks_timeout: required checks did not finish within 25 minutes" >&2
            else
              echo "market_signal_snapshot_checks_failed" >&2
            fi
            exit 1
          fi
          # Auto-merge lands the squash merge seconds after the last check
          # passes; confirm it actually merged so the marker is truthful.
          for _ in $(seq 1 12); do
            merged_at="$(gh pr view "$PR_URL" --repo "${GITHUB_REPOSITORY}" --json mergedAt --jq .mergedAt)"
            if [ -n "$merged_at" ] && [ "$merged_at" != "null" ]; then
              echo "market_signal_snapshot_merged"
              exit 0
            fi
            sleep 10
          done
          echo "market_signal_snapshot_merge_timeout: snapshot PR was not merged within 2 minutes of checks passing" >&2
          exit 1
