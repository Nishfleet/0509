name: SEO parity

# Regression guard for issue #1283: every /ads/:domain URL listed in the
# production sitemap must be served WITHOUT a `<meta name="robots"
# content="noindex">` tag. This bug was closed and re-emerged three times
# (#912, #1071, #1120, #1142), so the manual fix is not durable — the guard is
# the mechanical-fix (fleet-ops#366) that fails closed on recurrence.
#
# It runs on every PR and fails closed: any sitemap /ads page that serves
# noindex makes this job exit non-zero. The check is a live-production probe
# (curl https://0509.io), so it is deliberately a separate, non-required job
# rather than one of the required-context codex-node-checks shards — a
# production blip must not block every PR, but a real noindex regression must
# be surfaced loudly.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: seo-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-parity:
    name: seo-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run sitemap/noindex parity canary
        run: bash tests/seo/sitemap-noindex-parity.test.sh
