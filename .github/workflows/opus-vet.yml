# Trigger stub. The vet and sizer live once in Nishfleet/fleet-ops.
# keep and close there remove needs-nish-decision; park is the only verdict that leaves it.
name: opus-vet
on:
  issues:
    types: [labeled]
jobs:
  vet:
    if: contains(fromJSON('["needs-orchestrator","needs-nish-decision","needs-split"]'), github.event.label.name)
    uses: Nishfleet/fleet-ops/.github/workflows/opus-vet.yml@main # same ref runner group 3 enforces for agent.yml; a SHA pin here drifts from agent.yml@main and strands jobs (0509#5231)
    permissions:
      contents: read
      issues: write
      actions: write
      id-token: write
    with:
      close_fleet_work: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
