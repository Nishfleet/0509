name: Codex Issue To PR

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      task:
        description: Plain-English task for Codex to turn into a PR
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codex-issue-to-pr-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  codex-issue-to-pr:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'codex:build' || contains(github.event.issue.labels.*.name, 'codex:build') }}
    runs-on: ubuntu-latest
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - name: Check MiniMax secret
        id: ai_secret
        shell: bash
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "MINIMAX_API_KEY is not configured; skipping MiniMax implementation."
          else
            echo "::add-mask::$MINIMAX_API_KEY"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.ai_secret.outputs.has_key == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        if: steps.ai_secret.outputs.has_key == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm install -g opencode-ai

      - name: Configure OpenCode MiniMax
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "minimax": {
                "npm": "@ai-sdk/anthropic",
                "options": {
                  "baseURL": "https://api.minimax.io/anthropic/v1",
                  "apiKey": "{env:MINIMAX_API_KEY}"
                },
                "models": {
                  "MiniMax-M2.7": {
                    "name": "MiniMax-M2.7"
                  }
                }
              }
            },
            "permission": {
              "bash": {
                "git push*": "deny",
                "git merge*": "deny",
                "git tag*": "deny",
                "git rebase*": "deny",
                "gh pr merge*": "deny",
                "gh release*": "deny",
                "wrangler deploy*": "deny",
                "vercel deploy*": "deny",
                "supabase deploy*": "deny",
                "cloudflared tunnel*": "deny",
                "npm publish*": "deny",
                "npm run deploy*": "deny",
                "npx wrangler deploy*": "deny",
                "npx vercel deploy*": "deny",
                "pnpm publish*": "deny",
                "pnpm run deploy*": "deny",
                "bun publish*": "deny",
                "bun run deploy*": "deny"
              }
            }
          }
          JSON

      - name: Prepare task brief
        if: steps.ai_secret.outputs.has_key == 'true'
        uses: actions/github-script@v8
        env:
          DISPATCH_TASK: ${{ github.event.inputs.task }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            fs.mkdirSync(".codex-runtime", { recursive: true });

            let title = "Manual Codex task";
            let body = process.env.DISPATCH_TASK || "";
            let source = `workflow_dispatch run ${context.runId}`;

            if (context.eventName === "issues") {
              const issue = context.payload.issue;
              title = issue.title || "";
              body = issue.body || "";
              source = `issue #${issue.number} opened by ${issue.user?.login || "unknown"} and labeled by ${context.actor}`;
            }

            const task = [
              `# ${title}`,
              "",
              `Source: ${source}`,
              "",
              "## Task Brief",
              "",
              body,
              "",
              "## Guardrails",
              "",
              "- Make one bounded implementation PR.",
              "- Do not deploy, merge, approve, close, or touch secrets.",
              "- If the task is unsafe or too broad, leave a small blocker note instead of broad changes.",
            ].join("\n");

            fs.writeFileSync(".codex-runtime/issue-task.md", task);

      - name: Run MiniMax implementation
        id: run_opencode
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        run: |
          prompt="$(cat .github/codex/prompts/issue-to-pr.md)"
          opencode run \
            --pure \
            --model minimax/MiniMax-M2.7 \
            --dangerously-skip-permissions \
            "$prompt" > codex-issue-to-pr-output.md

      - name: Upload MiniMax artifact
        if: steps.ai_secret.outputs.has_key == 'true' && hashFiles('codex-issue-to-pr-output.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: codex-issue-to-pr
          path: codex-issue-to-pr-output.md

      - name: Prepare PR body
        id: pr_body
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        run: |
          body_delim="MINIMAX_BODY_$(date +%s%N)"
          source_line="${{ github.event_name == 'issues' && format('Issue #{0}', github.event.issue.number) || format('Manual workflow run {0}', github.run_id) }}"
          {
            echo "body<<$body_delim"
            echo 'Automated PR created by MiniMax through OpenCode.'
            echo
            echo "Source: $source_line"
            echo
            echo 'MiniMax result:'
            if [ -f codex-issue-to-pr-output.md ]; then
              cat codex-issue-to-pr-output.md
            else
              echo 'No model output file was produced.'
            fi
            echo "$body_delim"
          } >> "$GITHUB_OUTPUT"

      - name: Remove runtime-only files from PR diff
        if: steps.ai_secret.outputs.has_key == 'true'
        shell: bash
        run: |
          rm -rf .codex-runtime
          rm -f codex-issue-to-pr-output.md

      - name: Ensure automation labels exist
        if: steps.ai_secret.outputs.has_key == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const labels = [
              { name: "codex", color: "5319e7", description: "Created or reviewed by Codex automation" },
              { name: "codex:build", color: "1d76db", description: "Ask Codex to turn this issue into a bounded PR" },
              { name: "codex:auto-merge", color: "0e8a16", description: "Eligible for gated Codex auto-merge" },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

      - name: Create pull request
        id: cpr
        if: steps.ai_secret.outputs.has_key == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: "codex/issue-${{ github.event.issue.number || github.run_id }}"
          delete-branch: true
          draft: false
          labels: |
            codex
            codex:auto-merge
          title: "${{ github.event_name == 'issues' && format('codex: {0}', github.event.issue.title) || 'codex: manual task' }}"
          body: ${{ steps.pr_body.outputs.body }}

      - name: Comment on issue
        if: steps.cpr.outputs.pull-request-url != '' && github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Codex opened a PR: ${process.env.PR_URL}`,
            });
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
