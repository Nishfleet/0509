name: tmp-soak-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production-e2e
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "--- version"
          npx wrangler --version 2>&1 | tail -2
          echo "--- plain count"
          set +e
          out=$(npx wrangler d1 execute 0509 --remote --json --command "SELECT COUNT(*) AS n FROM send_attempt" 2>&1); rc=$?
          echo "rc=$rc"
          echo "$out"
          echo "--- soak sends query"
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          scope=" AND workspace_id IN (SELECT id FROM workspace WHERE owner_user_id IN (SELECT id FROM user WHERE email = 'e2e+soak@0509.io'))"
          out2=$(npx wrangler d1 execute 0509 --remote --json --command "SELECT CASE WHEN digest_id IS NULL THEN 'other (no digest)' ELSE 'brief' END AS kind, status, COUNT(*) AS n FROM send_attempt WHERE attempted_at >= '$since'$scope GROUP BY 1, 2 ORDER BY 1, 2" 2>&1); rc2=$?
          echo "rc=$rc2"
          echo "$out2"
