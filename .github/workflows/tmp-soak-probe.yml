name: tmp-soak-probe
on:
  push:
    branches: [orch/issue-7711]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          echo "--- whoami"
          npx wrangler whoami 2>&1 | tail -30
          echo "--- d1 list"
          npx wrangler d1 list 2>&1 | tail -8
          echo "--- workflows list"
          npx wrangler workflows list 2>&1 | tail -8
          echo "--- accounts endpoint"
          curl -sS -o /tmp/acc.json -w "http=%{http_code}\n" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts
          jq -c '{success, errors, result: (.result // [] | map({name, id}))}' /tmp/acc.json
