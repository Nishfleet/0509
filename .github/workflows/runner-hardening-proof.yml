name: Hardened runner proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify lane isolation (${{ matrix.instance }})
    if: github.repository == 'Nishfleet/0509' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: verify1
            label: 0509-verify1
            account: gha0509-verify1
          - instance: verify2
            label: 0509-verify2
            account: gha0509-verify2
          - instance: verify3
            label: 0509-verify3
            account: gha0509-verify3
    runs-on: [self-hosted, linux, x64, vps-verify, "${{ matrix.label }}"]
    timeout-minutes: 3
    steps:
      - name: Prove verification runner boundary
        shell: bash
        env:
          EXPECTED_ACCOUNT: ${{ matrix.account }}
          EXPECTED_LANE: vps-verify
        run: |
          set -euo pipefail
          actual_user="$(id -un)"
          [[ "$actual_user" = "$EXPECTED_ACCOUNT" ]]
          [[ "${DEPLOY_WINDOW_LOCK_FILE:-}" = "/run/lock/0509/deploy-window.lock" ]]
          [[ -r "$DEPLOY_WINDOW_LOCK_FILE" && -w "$DEPLOY_WINDOW_LOCK_FILE" ]]
          ! { [[ -r /home/nish ]] || [[ -x /home/nish ]]; }
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            printf 'runner unexpectedly has passwordless sudo\n' >&2
            exit 1
          fi
          grep -Fq 'github-0509.slice' /proc/self/cgroup
          printf 'lane=%s user=%s cgroup=github-0509.slice lock=ok\n' \
            "$EXPECTED_LANE" "$actual_user" >> "$GITHUB_STEP_SUMMARY"
