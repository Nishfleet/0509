# Every merge to main deploys staging: the 0509-staging Worker on its own D1, R2, KV and queues,
# built with cf from cloudflare.config.ts. Its own workflow, so a staging failure never reddens the
# production deploy run the fleet's deploy-failed alert reads (0509#7656, fleet-ops#9889).
# Secrets stay on the Worker: a deploy keeps every secret it does not upload
# (https://developers.cloudflare.com/workers/configuration/secrets/).
name: Deploy staging

on: {push: {branches: [main]}, workflow_dispatch: {}}

permissions: {contents: read}

jobs:
  staging:
    name: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: {group: deploy-staging, cancel-in-progress: false}
    environment: {name: staging, url: https://staging.0509.io}
    timeout-minutes: 15
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: CLOUDFLARE_VITE_FORCE_BUILD_OUTPUT=true npx react-router build --mode staging
      - name: Apply D1 migrations to the staging database only (627cffe8, cloudflare.config.ts)
        run: |
          id=$(jq -r .env.DB.id .cloudflare/output/v0/workers/default/worker.config.json)
          case "$id" in
            627cffe8-*) ;;
            *) echo "::error::refusing to migrate non-staging database: $id"; exit 1 ;;
          esac
          npx cf d1 migrations apply "$id" --mode staging
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the staging Worker
        run: |
          worker=$(jq -r .name .cloudflare/output/v0/workers/default/worker.config.json)
          [ "$worker" = "0509-staging" ] || { echo "::error::refusing to deploy non-staging worker: $worker"; exit 1; }
          npx cf deploy --prebuilt --mode staging
        env: *cloudflare
      - name: Smoke staging
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS https://staging.0509.io/api/health 2>&1 || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "/api/health never answered ok with commit $GITHUB_SHA; last body: $body"
          exit 1
