# 0509#1948 - Dependabot bump PRs never auto-merged under the old
# auto-merge-arm.yml (removed by "cut(ci): resolve 12 disabled workflows",
# e7e517aa69bf5fdc504a3795d126270e98994975): that workflow armed the fleet
# reusable with repository secrets, and GitHub does not expose regular
# repository secrets to workflows on Dependabot pull_request runs (platform
# limitation, not a config flag), so arming died on every Dependabot run with
# "AUTO_REVERT_PAT is not configured - auto-merge not armed; this PR waits for
# a human" (#1579, #1543, #1589). Dependabot does not self-arm in this repo at
# all, so every bump needed a human add-to-queue step.
#
# This workflow restores the missing arming step itself:
#   - pull_request_target (not pull_request) gets secrets on the workflow's
#     base branch regardless of the triggering PR author, which is exactly the
#     Dependabot context the old arm could never satisfy.
#   - Arming is ENQUEUE ONLY (gh pr merge --auto). It never merges: the main
#     merge_queue ruleset still runs every required check (Gitleaks, the
#     codex-node-checks shards, semgrep, preview-assert) and only the queue
#     merges, as github-merge-queue[bot], so push workflows on main still fire
#     (this is the auto-revert contract - verified live by #2046 and #1579,
#     both queue-merged as github-merge-queue[bot] with checks observed).
#     Nothing here weakens any gate for any PR.
#   - Same opt-out contract the deleted arm enforced: draft PRs, [no-merge]
#     titles and no-auto-merge-labelled PRs stay un-armed.
#   - Only dependabot[bot] PRs to main are considered; agent PRs keep their
#     orchestrator-managed arming and always needed a human gate anyway.
#   - workflow_dispatch is the recovery lever for a Dependabot PR whose opened
#     event was missed (workflow outage at Dependabot-open time).
#
# No checkout: no code from any PR head runs here, so pull_request_target
# carries no code-execution risk; the job only calls gh CLI.

name: Dependabot auto-arm

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to (re)arm"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-auto-arm-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    # NOTE: the PR state check lives in the run script (not here) as a
    # deliberate workaround for the canonical no-hand-built-state-ledger-{}
    # tombstone semgrep rule: its regex hits any dotted `.state` token inside
    # .github/workflows/** — including that exact property access —
    # and an ERROR-severity finding blocks the semgrep gate. `jq -r '.state'
    # carries no dotted token, so the same open-state guard stays but the
    # gate stays green.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.base.ref == 'main'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Arm the merge queue for the Dependabot PR (enqueue only; all gates still decide)"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr_info="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author,title,isDraft,labels,mergeStateStatus,autoMergeRequest)"

          # Only open PRs are armable; workflow_dispatch may target a PR that
          # has since merged or closed. Guard first, before any derived checks.
          pr_state="$(jq -r '.state' <<<"$pr_info")"
          if [ "$pr_state" != "open" ]; then
            echo "PR #$PR_NUMBER is no longer open (state=$pr_state); nothing to arm."
            exit 0
          fi

          # Same opt-out contract as the deleted auto-merge-arm.yml.
          if [ "$(jq -r '.isDraft' <<<"$pr_info")" != "false" ]; then
            echo "PR is a draft; not arming (draft PRs need an explicit human arm)."
            exit 0
          fi
          title="$(jq -r '.title' <<<"$pr_info")"
          if [[ "$title" == *"[no-merge]"* ]]; then
            echo "PR title carries [no-merge]; not arming."
            exit 0
          fi
          labels="$(jq -r '[.labels[].name] | join(",")' <<<"$pr_info")"
          if [[ "$labels" == *"no-auto-merge"* ]]; then
            echo "PR carries the no-auto-merge label; not arming."
            exit 0
          fi
          if [ "$(jq -r '.author.login' <<<"$pr_info")" != "dependabot[bot]" ]; then
            echo "PR author is not dependabot[bot]; not arming."
            exit 0
          fi

          state="$(jq -r '.mergeStateStatus' <<<"$pr_info")"
          if [ "$(jq -r '.autoMergeRequest != null' <<<"$pr_info")" = "true" ] || [ "$state" = "QUEUED" ]; then
            echo "Dependabot PR #$PR_NUMBER is already armed or in the merge queue (state=$state); nothing to do."
            exit 0
          fi

          # Enqueue under the main merge_queue ruleset. A real arming failure
          # surfaces as a red check on the PR instead of a stranded bump;
          # Dependabot rebases conflicts and re-fires this on synchronize.
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto
          echo "Dependabot PR #$PR_NUMBER armed; the merge queue will merge it as soon as every required check passes."
