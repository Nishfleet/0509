name: e2e-scheduled

# Journeys that need calendar time or break the fixture for hours run here on
# their own clock, never per deploy (0509#4124, 0509#4128). So does the full
# production suite, `journey=suite` (the `e2e-production` job below): it runs
# everything except @scheduled, on demand, off the deploy path because its
# sign-ins send real emails against the daily quota (0509#6033, 0509#6034).
# `signin` is the one real sign-in smoke a day (0509#6093): the only production
# run that sends a real email besides the suite, once, at 04:17 UTC.
# `soak-report` posts one comment a day on #4730 while the 7-day soak runs
# (0509#4730), at 06:30 UTC, after the 02:00 site sweep and 03:00 rollover.
# Not a required check.
on:
  schedule:
    - cron: "5 10 * * 3"
    - cron: "17 4 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      journey:
        description: Journey to run now
        type: choice
        options: [none, j12, suite, signin, j8-hard, j8-soft, soak-report, proof-4012]
        default: none
      spec:
        description: 'One spec or a filter to run now against https://0509.io, e.g. e2e/j3-onboard-domain.spec.ts (0509 sign-up verdict, 2026-09-28)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-scheduled-${{ inputs.spec && 'spec' || github.event.schedule == '30 6 * * *' && 'soak' || inputs.journey == 'soak-report' && 'soak' || inputs.journey == 'suite' && 'suite' || github.event.schedule == '17 4 * * *' && 'signin' || inputs.journey == 'signin' && 'signin' || startsWith(inputs.journey, 'j8-') && 'j8' || 'j12' }}
  cancel-in-progress: false

jobs:
  j12:
    name: j12
    if: github.event.schedule == '5 10 * * 3' || inputs.journey == 'j12'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run J12 against production
        run: npm run e2e -- e2e/j12-rollovers.spec.ts --project=desktop-1440 --retries=0 --reporter=github,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
  spec:
    name: spec
    # No trace is uploaded: the repo is public and a trace can hold the Access
    # cookie (0509#5999); a failure is read from the job log.
    if: inputs.spec != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the spec against production
        run: npm run e2e -- "$SPEC" --project=desktop-1440 --retries=0 --reporter=github,list
        env:
          SPEC: ${{ inputs.spec }}
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
          FIXTURE_SITE_TOKEN: ${{ secrets.FIXTURE_SITE_TOKEN }}
      - name: Print what the page showed when it failed
        # Playwright writes the page snapshot next to each failure; printing it
        # is how a failure is read, since nothing is uploaded.
        if: failure()
        run: tail -n +1 test-results/*/error-context.md
  proof-4012:
    name: proof-4012
    if: inputs.journey == 'proof-4012' && inputs.spec == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: J14 proof against production
        run: npm run e2e -- e2e/proof-4012.spec.ts --project=desktop-1440 --retries=0 --workers=1 --reporter=list
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Print what the page showed when it failed
        if: failure()
        run: tail -n +1 test-results/*/error-context.md
  signin:
    name: signin
    # One sign-in, one real email against the Email Service daily quota
    # (0509#6033, 0509#6093): no retries, no loop, no other spec. No trace is
    # uploaded: the repo is public and a trace can hold the Access cookie
    # (0509#5999); a failure is read from the job log.
    if: github.event.schedule == '17 4 * * *' || (inputs.journey == 'signin' && inputs.spec == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exchange the Access service token for its cookie
        # The setup project sends no email; the desktop project's other
        # dependencies each sign in, so the next step runs without them.
        run: npm run e2e -- --project=setup --retries=0 --reporter=github,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Sign in once against production
        run: npm run e2e -- e2e/j1-magic-link.spec.ts --project=desktop-1440 --no-deps --retries=0 --workers=1 --reporter=github,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
      - name: Print what the page showed when it failed
        if: failure()
        run: tail -n +1 test-results/*/error-context.md
  j8:
    name: j8
    # One break of j8-hard.fixture.0509.in or j8-soft.fixture.0509.in per dispatch, journey j8-hard or j8-soft,
    # each with its own account (0509#4124). Both modes together would run past
    # the 6 hour cap, so they are two dispatches; each mode has its own fixture
    # host (the incident email is once per site per day), and they still share the
    # j8 concurrency group so the mail inbox is read by one run at a time. Dispatch only: a
    # run is hours long and sends real mail. No trace is uploaded: the repo is
    # public and a trace can hold the Access cookie (0509#5999); a failure is
    # read from the job log. 350 minutes is the most a hosted job may run under
    # the 6 hour cap.
    if: startsWith(inputs.journey, 'j8-') && inputs.spec == ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exchange the Access service token for its cookie
        run: npm run e2e -- --project=setup --retries=0 --reporter=github,list
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Run J8 against production
        run: npm run e2e -- e2e/j8-own-site-break.spec.ts --grep "J8 your own site breaks ${MODE}:" --project=desktop-1440 --no-deps --retries=0 --workers=1 --reporter=github,list
        env:
          MODE: ${{ inputs.journey == 'j8-hard' && 'hard' || 'soft' }}
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
          FIXTURE_SITE_TOKEN: ${{ secrets.FIXTURE_SITE_TOKEN }}
      - name: Leave the fixture unbroken
        # The spec resets the break in a finally block; a cancel or a timeout
        # kills the runner before it can.
        if: always()
        run: |
          rc=0
          for host in j8-hard.fixture.0509.in j8-soft.fixture.0509.in; do
            curl --fail --silent --show-error --request POST --header "authorization: Bearer $FIXTURE_SITE_TOKEN" "https://$host/__break?mode=off" || rc=1
          done
          exit $rc
        env:
          FIXTURE_SITE_TOKEN: ${{ secrets.FIXTURE_SITE_TOKEN }}
      - name: Print what the page showed when it failed
        if: failure()
        run: tail -n +1 test-results/*/error-context.md
  production-sha:
    name: production-sha
    # The suite runs the code of the deploy that is live, not main's head; no
    # deployment, or one that is not yet successful, fails this job and the
    # shards never start.
    if: inputs.journey == 'suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: read
    outputs:
      sha: ${{ steps.deploy.outputs.sha }}
    steps:
      - name: Newest production deployment
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=1" --jq '.[0] // empty')
          test -n "$deploy"
          sha=$(jq -r .sha <<<"$deploy")
          test "${#sha}" = 40
          state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$(jq -r .id <<<"$deploy")/statuses?per_page=1" --jq '.[0].state')
          test "$state" = success
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  suite-shard:
    name: e2e-production shard ${{ matrix.shard }}
    # Every sign-in in the suite sends a real email and the Cloudflare Email
    # Service daily quota is spent (0509#6033, 0509#6034), so the full suite no
    # longer starts on every deploy (Nish 2026-09-28: "take the full production
    # e2e off every deploy ... run it on demand and hourly instead"; hourly after
    # 0509#6034 lands, when a run signs in once). No trace is
    # uploaded: the repo is public and a trace can hold the Access cookie
    # (0509#5999); a failure is read from the job log.
    needs: production-sha
    if: inputs.journey == 'suite'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.production-sha.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run this shard of the suite against production
        # @scheduled journeys run on their own clock above: J12 now, J8 with its spec (0509#4124, 0509#4128).
        # https://playwright.dev/docs/test-sharding
        timeout-minutes: 25
        run: npm run e2e -- --shard=${{ matrix.shard }}/4 --reporter=github,list --grep-invert @scheduled --retries=0
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://0509.io
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          E2E_INBOX_TOKEN: ${{ secrets.E2E_INBOX_TOKEN }}
          FIXTURE_SITE_TOKEN: ${{ secrets.FIXTURE_SITE_TOKEN }}
  suite:
    name: e2e-production
    needs: [production-sha, suite-shard]
    if: always() && inputs.journey == 'suite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHARDS: ${{ needs.suite-shard.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue that dispatches the fix
        if: env.SHARDS == 'failure'
        id: red
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ needs.production-sha.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/red-main/e2e-production.md
          update_existing: true
          search_existing: open
      - name: Hand the issue to a worker
        # A GITHUB_TOKEN label fires no workflow, so dispatch by number.
        if: steps.red.outputs.number
        env:
          N: ${{ steps.red.outputs.number }}
        run: gh workflow run agent-dispatch.yml --repo "$GITHUB_REPOSITORY" -f issue="$N"
      - name: Close the issue once this check is green again
        if: env.SHARDS == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"e2e-production red on main" in:title' --json number --jq '.[0].number // empty')
          [ -z "$N" ] || gh issue close "$N" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Green again on $RUN_URL."
      - name: Red unless every shard passed
        run: test "$SHARDS" = success
  soak-report:
    name: soak-report
    # Reads counts only, never rows: no email, report text or other customer
    # data reaches the log or the comment. Every query is a SELECT. The
    # healthchecks.io pings and the Sentry issue count are not read here: no
    # read credential for either is a repository secret, and the comment says so.
    if: github.event.schedule == '30 6 * * *' || (inputs.journey == 'soak-report' && inputs.spec == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post the day's soak numbers on the issue
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          scope=" AND workspace_id IN (SELECT id FROM workspace WHERE owner_user_id IN (SELECT id FROM user WHERE email = 'e2e+soak@0509.io'))"
          label="soak workspace"
          sends=$(npx wrangler d1 execute 0509 --remote --json --command "SELECT CASE WHEN digest_id IS NULL THEN 'other (no digest)' ELSE 'brief' END AS kind, status, COUNT(*) AS n FROM send_attempt WHERE attempted_at >= '$since'$scope GROUP BY 1, 2 ORDER BY 1, 2" | jq -r '.[0].results | if length == 0 then "none" else map("\(.kind) \(.status): \(.n)") | join(", ") end')
          sweeps=$(npx wrangler d1 execute 0509 --remote --json --command "SELECT COUNT(*) AS runs, COALESCE(SUM(pages), 0) AS pages, COALESCE(SUM(failed), 0) AS failed FROM sweep_run WHERE finished_at >= '$since'" | jq -r '.[0].results[0] | "\(.runs) finished, \(.pages) pages, \(.failed) failed pages"')
          instances() {
            page=1
            rows=""
            while [ "$page" -le 50 ]; do
              batch=$(curl -sS --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/$1/instances?per_page=100&page=$page&date_start=$since" \
                | jq -c '.result')
              rows="$rows$batch"$'\n'
              [ "$(jq 'length' <<< "$batch")" -eq 100 ] || break
              page=$((page + 1))
            done
            jq -s -r 'add | if length == 0 then "no instances" else (group_by(.status) | map("\(.[0].status): \(length)") | join(", ")) end' <<< "$rows"
          }
          d1() {
            npx wrangler d1 execute 0509 --remote --json --command "$1" | jq -c '.[0].results'
          }
          failed=0
          missed=""
          cron_instances() {
            npx wrangler workflows instances list "$1" --date-start "$since" --per-page 100 --json | jq -s -r --arg prefix "$1-" '(add // []) | map(select(.id | startswith($prefix))) | length'
          }
          crons=""
          for name in mentions-sweep site-sweep hiring-sweep snapshot-backup; do
            n=$(cron_instances "$name") || n=unreadable
            crons="$crons$name $n, "
            [[ "$n" =~ ^[1-9][0-9]*$ ]] || { missed="$missed$name "; failed=1; }
          done
          required='["is_competitor","still_competitor","noteworthy_change","own_site_breakage","read_this_first","mention_is_about_brand","mention_matters","page_role","identity_field_confidence.name","identity_field_confidence.description","identity_field_confidence.socials"]'
          verdicts=$(d1 "SELECT question_id, COUNT(*) AS n, MAX(decided_at) AS last FROM jev_verdict GROUP BY question_id")
          missing=$(jq -r --argjson req "$required" '[.[].question_id] as $have | $req - $have | join(", ")' <<< "$verdicts")
          dup=$(jq -r '[.[] | select(.question_id == "duplicate_signal")] | if length == 0 then "no rows yet" else "\(.[0].n) rows, last \(.[0].last)" end' <<< "$verdicts")
          [ -z "$missing" ] || failed=1
          stale=$(d1 "SELECT s.key AS key FROM source s WHERE s.is_enabled = 1 AND s.degraded_reason IS NULL AND (s.latest_fetched_at IS NULL OR s.latest_fetched_at < '$since') AND EXISTS (SELECT 1 FROM watch w WHERE w.source_id = s.id AND w.is_active = 1 AND COALESCE(CASE WHEN json_valid(w.config_json) THEN json_extract(w.config_json, '$.noChannel.state') END, '') <> 'degraded') ORDER BY s.key" | jq -r 'map(.key) | join(", ")')
          [ -z "$stale" ] || failed=1
          gdelt=$(d1 "SELECT COUNT(*) AS n FROM snapshot sn JOIN watch w ON w.id = sn.watch_id JOIN source s ON s.id = w.source_id WHERE s.key = 'gdelt.doc' AND sn.item_count > 0 AND sn.fetched_at >= '$since'" | jq -r '.[0].n')
          mentions=$(d1 "SELECT COUNT(*) AS n FROM signal WHERE kind = 'mention' AND observed_at >= '$since'" | jq -r '.[0].n')
          [ "$gdelt" -gt 0 ] && [ "$mentions" -gt 0 ] || failed=1
          pricing=$(d1 "SELECT e.domain AS brand, p.url IS NOT NULL AS judged, COUNT(DISTINCT w.id) AS watches, COUNT(sn.id) AS snapshots FROM entity e LEFT JOIN page p ON p.entity_id = e.id AND p.role = 'pricing' AND p.role_decided_for_hash IS NOT NULL LEFT JOIN watch w ON w.entity_id = e.id AND w.target_key = p.url AND w.is_active = 1 AND w.source_id = (SELECT id FROM source WHERE key = 'site.web') LEFT JOIN snapshot sn ON sn.watch_id = w.id AND sn.fetched_at >= '$since' WHERE e.role = 'competitor' AND e.state = 'on'$scope GROUP BY e.id ORDER BY e.domain")
          pricing_lines=$(jq -r 'map("\(.brand) " + (if .judged == 0 then "no pricing page judged" elif .watches == 0 then "pricing page judged, NO WATCH" elif .snapshots == 0 then "watched, no snapshot" else "watched, \(.snapshots) snapshots" end)) | join("; ")' <<< "$pricing")
          pricing_bad=$(jq -r '[.[] | select(.judged == 1 and (.watches == 0 or .snapshots == 0))] | length' <<< "$pricing")
          pricing_any=$(jq -r '[.[] | select(.judged == 1)] | length' <<< "$pricing")
          [ "$pricing_bad" -eq 0 ] && [ "$pricing_any" -gt 0 ] || failed=1
          {
            echo "Soak report for the 24 hours before $(date -u +%Y-%m-%dT%H:%MZ) (send counts: $label)."
            echo
            echo "- cron-started Workflow instances in the last 24 h (newest 100 each): ${crons%, }$([ -z "$missed" ] || echo " (FAIL, none or unreadable for: ${missed% })")"
            echo "- site-sweep Workflow instances: $(instances site-sweep)"
            echo "- site sweeps recorded in sweep_run: $sweeps"
            echo "- standing-rollover Workflow instances: $(instances standing-rollover)"
            echo "- send_attempt rows by status: $sends"
            echo "- Jev verdicts: $([ -z "$missing" ] && echo "every required question has a row" || echo "FAIL, no rows for: $missing"); duplicate_signal (informational): $dup"
            echo "- enabled sources with an active watch: $([ -z "$stale" ] && echo "all fetched in the last 24 h or marked degraded" || echo "FAIL, stale and not degraded: $stale")"
            echo "- #6110 news: $gdelt gdelt.doc snapshots with items, $mentions mention signals in the last 24 h$([ "$gdelt" -gt 0 ] && [ "$mentions" -gt 0 ] || echo " (FAIL)")"
            echo "- pricing-page watches, soak brands: $pricing_lines$([ "$pricing_bad" -eq 0 ] && [ "$pricing_any" -gt 0 ] || echo " (FAIL, $pricing_any brands have a judged pricing page and $pricing_bad of those lack a watch or a snapshot)")"
            echo "- healthchecks.io dead-man and site-sweep pings: not read, no healthchecks.io read key is a repository secret"
            echo "- new Sentry issues: not read, no Sentry auth token is a repository secret"
          } > comment.md
          gh issue comment 4730 --body-file comment.md
          [ "$failed" -eq 0 ] || { echo "An engine check failed, see the issue comment"; exit 1; }
