name: Market-signal snapshot age monitor

# Detects a stale or missing daily D1 market-signal snapshot and files a
# `market-signal-stale` issue so a missed daily run is never silent. The daily
# snapshot is generated by market-signal-snapshot.yml and pushed to the PRIVATE
# sink Nishfleet/0509-telemetry; this monitor reads it back from there and
# checks its `generatedAt` age. The 2026-09-06 miss (issue #1894) went stale
# >26h with no alert because the snapshot workflow was cancelled by deploy churn
# and nothing else watched the published file's age.
#
# Alert shape (matches auto-revert.yml): on a stale/missing snapshot the monitor
# opens or comments a single `market-signal-stale` issue and exits 0 -- the
# filed issue IS the signal, so the run does not double a stale-snapshot fault
# with its own GitHub failure email. On a fresh snapshot it closes any open
# stale issue with a recovery note so the alert self-clears.
#
# The monitor reuses the existing TELEMETRY_DEPLOY_KEY secret (the same
# write-enabled deploy key the publish step uses; read is lower privilege) to
# fetch the private snapshot over SSH. It needs `issues: write` to file/close
# the alert issue and `contents: read` to check out the script.

on:
  workflow_dispatch:
    inputs:
      max-age-hours:
        description: "Stale threshold in hours (default 24). Set to 0 to force the stale path for testing."
        required: false
        default: "24"
  schedule:
    # Every 6 hours: catches a missed daily run well within the 24h threshold
    # without polling. 05:00/11:00/17:00/23:00 UTC avoids the 00:07 snapshot
    # generation and the 20:07/20:47 provider-mutation windows.
    - cron: "0 5,11,17,23 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: market-signal-snapshot-age
  cancel-in-progress: false

jobs:
  check:
    name: Check market-signal snapshot age
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check snapshot age
        id: age
        env:
          TELEMETRY_DEPLOY_KEY: ${{ secrets.TELEMETRY_DEPLOY_KEY }}
          MAX_AGE_HOURS: ${{ inputs.max-age-hours || '24' }}
        run: |
          set -euo pipefail
          # A missing deploy key would make the fetch fall back to anonymous
          # https, which 404s the private repo and reads as "missing snapshot".
          # Fail loud instead so the monitor does not silently false-alarm.
          if [ -z "${TELEMETRY_DEPLOY_KEY:-}" ]; then
            echo "market_signal_monitor_missing_deploy_key" >&2
            exit 1
          fi
          if scripts/check-d1-snapshot-age.sh --max-age-hours "$MAX_AGE_HOURS"; then
            echo "result=fresh" >> "$GITHUB_OUTPUT"
          else
            echo "result=stale" >> "$GITHUB_OUTPUT"
          fi
      - name: Alert or recover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ steps.age.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create market-signal-stale --repo "$REPO" --color B60205 \
            --description "Daily market-signal D1 snapshot is stale or missing -- a human must look" --force >/dev/null 2>&1 || true
          num="$(gh issue list --repo "$REPO" --state open --label market-signal-stale \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "$RESULT" = "stale" ]; then
            body="The daily market-signal D1 snapshot is stale or missing (age exceeds the threshold).

          - Monitor run: $RUN_URL
          - Snapshot location: private repo \`Nishfleet/0509-telemetry\` branch \`automation/market-signal-snapshot\` path \`ops/market-signal/0509-market-signal.json\`
          - Recovery: re-run the \`Daily market-signal D1 snapshot\` workflow, then re-run this monitor to confirm it clears.

          This issue was filed automatically by the market-signal-snapshot-age monitor."
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$REPO" --body "Still stale as of $(date -u +%Y-%m-%dT%H:%M:%SZ). $body"
            else
              gh issue create --repo "$REPO" --title "Market-signal D1 snapshot is stale" --body "$body" --label market-signal-stale
            fi
          else
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$REPO" --body "Recovered: the market-signal D1 snapshot is fresh again as of $(date -u +%Y-%m-%dT%H:%M:%SZ). Monitor run: $RUN_URL"
              gh issue close "$num" --repo "$REPO"
            fi
          fi
