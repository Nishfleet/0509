name: Preview assert

# Run the release-gate assertion BEFORE the merge (0509#1576). 9 of the last
# 120 merges were auto-reverted because `Deploy production` failed on main
# AFTER merge — the check exists, it ran on the wrong side of the merge
# (latest run 33561746667: `AssertionError: expected false to be true` in
# tests/d1-remote-restore-evidence.test.ts:222, missed by sharded PR CI,
# caught by the deploy job's full unsharded run).
#
# This workflow runs the deploy job's own pre-deploy verification against the
# PR head, invoked unchanged from deploy-production.yml:
#   - `npm run typecheck` (same step, same NODE_OPTIONS heap budget)
#   - `npm run test`      (the FULL unsharded suite — the demonstrated
#                          failure class is a test that passes sharded and
#                          fails when the whole suite runs together)
#   - `npm run build`     (the deploy pipeline's react-router build; emits
#                          build/server/wrangler.json + the .wrangler config
#                          redirect that the deploy uses)
#   - `wrangler versions upload` of the PR head with a preview alias — the
#     preview URL Cloudflare itself assigns (Nish, 2026-09-04: "wrangler
#     versions upload / preview alias"), proving the PR head builds and
#     uploads as a real Worker version. The upload is inert: a version is
#     not deployed and receives no traffic, so production D1/R2/email
#     bindings are never touched.
#
# The post-deploy release-gate canaries (Gate C, scripts/verify-post-deploy-
# release.mjs) CANNOT run against a preview "unchanged": they hardcode
# https://0509.io, pin the deployed production worker version, write billing
# records to production D1, and send real proof emails (defaultBilling /
# defaultProof / defaultCleanup in that script). Running them on a preview
# would mutate production from a PR check, which the operating model reserves
# for Nish. They stay post-merge on production exactly as today.
#
# Required-check contract (branch protection adds `preview-assert` to main):
# a required context must be structurally incapable of concluding SKIPPED, so
# this job carries no job-level `if:` / `needs:` and its authorizer is step 1
# (tests/required-context-no-skip.test.ts enforces the contract).

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for the preview assertion
        required: true
        type: string

concurrency:
  group: preview-assert-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-assert:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Authorize exact verification candidate
        # Fork guard as a step, not a job: it refuses fork PRs with a real
        # failure of the required check. Same contract as ci.yml.
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "Nishfleet/0509"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            merge_group)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" =~ ^refs/heads/gh-readonly-queue/ ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' && hashFiles('package-lock.json') != '' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Install Playwright browsers
        # Same runner shape as the deploy job: the full suite's process-
        # lifecycle tests spawn detached provider children that the deploy
        # runner proves with browsers installed. Keep the shapes identical so
        # a pass here predicts a pass on the deploy runner.
        run: npx playwright install chromium firefox webkit

      - name: Typecheck
        env:
          # Same heap budget as deploy-production.yml and ci.yml.
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run typecheck

      - name: Test
        # The FULL unsharded suite, exactly as the deploy job runs it. PR CI
        # shards this suite across 4 jobs; the deploy job runs it whole, and
        # a test that passes sharded can fail when all 529 files run together
        # (run 33561746667). This is the demonstrated failure class.
        run: npm run test

      - name: Build
        # The deploy pipeline's own build (react-router build via the
        # Cloudflare vite plugin, part of "launch:readiness:predeploy"). It
        # emits build/server/index.js + build/server/wrangler.json
        # (no_bundle, main index.js) and the .wrangler/deploy/config.json
        # redirect that `wrangler deploy` uses in production. The preview
        # upload uploads the SAME built artifacts; without this step the
        # upload would bundle workers/app.ts raw and fail on the project's
        # ~/ path aliases and the react-router virtual server-build (seen on
        # the first preview-assert run of PR #1580).
        run: npm run build

      - name: Upload preview version
        # Cloudflare's own preview mechanism ("wrangler versions upload /
        # preview alias", Nish 2026-09-04). Uploads the PR head as a Worker
        # version with a preview alias and prints the preview URL. A version
        # upload is inert: it is not deployed, receives no traffic, and never
        # touches the production D1/R2/email bindings of the worker it
        # belongs to. Credentials are org-level secrets (visibility: all),
        # already readable by every workflow in the org; no production
        # environment is referenced, so the PR branch is allowed.
        #
        # Do not fetch the preview URL here: the version carries the worker's
        # production bindings, and a request to it would hit production
        # D1/email bindings. Upload-only proof.
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
          PREVIEW_ALIAS: preview-assert-${{ github.sha }}
        run: |
          set -euo pipefail
          upload_output="$(mktemp)"
          trap 'rm -f -- "$upload_output"' EXIT
          if ! ./node_modules/.bin/wrangler versions upload \
            --preview-alias "$PREVIEW_ALIAS" \
            --message "preview-assert ${{ github.repository }}@${{ github.sha }} (event ${{ github.event_name }})" \
            >"$upload_output" 2>&1; then
            cat "$upload_output"
            exit 1
          fi
          cat "$upload_output"
          echo "Uploaded preview version under alias: $PREVIEW_ALIAS"
          echo "Upload-only proof: the preview URL is never requested here — the version carries the worker's production bindings, so a request to it would hit production D1/email."