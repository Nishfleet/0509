name: cloudflare-settings

# Cloudflare settings outside wrangler.jsonc, stock wrangler only, on demand
# and from main only (Nish 2026-10-03). Safe to re-run (0509#5699, fleet-ops#10577).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-settings
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SETTINGS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      SUPPORT_INBOX_WORKER: 0509-support-inbox-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Backup bucket lifecycle rules, before
        run: npx wrangler r2 bucket lifecycle list 0509-snapshots-backup
      - name: Set the backup bucket lifecycle rules
        run: npx wrangler r2 bucket lifecycle set 0509-snapshots-backup --file .github/cloudflare/r2-backup-lifecycle.json --force
      - name: Backup bucket lifecycle rules, after
        run: npx wrangler r2 bucket lifecycle list 0509-snapshots-backup
      - name: Route support@, brief@, hello@, dmarc@, alerts@ and fleet-signup@ to the support-inbox Worker
        run: |
          set -o pipefail
          for name in support brief hello dmarc alerts fleet-signup; do
            id=$(npx wrangler email routing rules list 0509.io | awk -v m="Matchers: to:$name@0509.io" '/^Rule:/ {id=$2} $0 ~ m"$" {print id}')
            if [ -n "$id" ]; then verb=(update 0509.io "$id"); else verb=(create 0509.io); fi
            npx wrangler email routing rules "${verb[@]}" --name "$name" \
              --match-type literal --match-field to --match-value "$name@0509.io" \
              --action-type worker --action-value "$SUPPORT_INBOX_WORKER"
          done
      - name: Point the catch-all at the support-inbox Worker
        run: |
          set -o pipefail; umask 077
          cfg="$RUNNER_TEMP/cf-auth"; trap 'rm -f "$cfg"' EXIT
          jq -rn '"header = \"Authorization: Bearer " + env.CLOUDFLARE_API_TOKEN + "\""' > "$cfg"
          z=$(curl -sS --fail-with-body --retry 3 --retry-connrefused --config "$cfg" "https://api.cloudflare.com/client/v4/zones?name=0509.io" | jq -er '.result[0].id')
          jq -nc --arg w "$SUPPORT_INBOX_WORKER" '{name:"catch-all",enabled:true,matchers:[{type:"all"}],actions:[{type:"worker",value:[$w]}]}' \
            | curl -sS --fail-with-body --retry 3 --retry-connrefused --config "$cfg" -X PUT "https://api.cloudflare.com/client/v4/zones/$z/email/routing/rules/catch_all" --json @- | jq 'if .success then (.result | {name, enabled, matchers, actions}) else error("catch-all failed: \(.errors)") end'
      - name: Email Routing rules, after
        run: npx wrangler email routing rules list 0509.io
