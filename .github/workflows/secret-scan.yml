name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for secret scanning
        required: true
        type: string

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize_release:
    name: Authorize exact secret-scan candidate
    # No job-level fork guard here: a fork PR must produce a real job outcome,
    # never a skip (GitHub accepts skipped required contexts as satisfied).
    # The fork guard lives in the authorize step below, which refuses fork PRs
    # with a real failure. The required Gitleaks job below turns any failed
    # authorization into a real failure via its "Require authorization gate"
    # step.
    if: github.repository == 'nish3451/0509'
    runs-on: [self-hosted, linux, x64, vps-verify]
    permissions: {}
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Authorize secret-scan request
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "nish3451/0509"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            push)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" = "refs/heads/main" || "$GITHUB_REF" = "refs/heads/master" ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Gitleaks
    # Required context. It runs unconditionally (never skips on a fork PR):
    # the "Require authorization gate" step below turns any failed or skipped
    # authorization (fork PRs included) into a real job failure, so a fork PR
    # can never render this required check green or skipped.
    if: >-
      github.repository == 'nish3451/0509' &&
      !cancelled()
    needs: authorize_release
    runs-on: [self-hosted, linux, x64, vps-verify]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require authorization gate
        if: needs.authorize_release.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Gitleaks refused: authorize_release concluded '${{ needs.authorize_release.result }}' (expected 'success'). Fork PRs and unapproved dispatch candidates are never secret-scanned."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_release.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ needs.authorize_release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - name: Clear stale gitleaks installer artifacts
        shell: bash
        run: rm -f /tmp/gitleaks.tmp
      - name: Scan repository
        # Fork guard on the only step in this workflow that consumes a secret
        # (GITHUB_TOKEN). The authorization gate above already fails fork PRs
        # before this step; this guard keeps untrusted fork code away from the
        # token even if that gate is ever removed.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
