name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for secret scanning
        required: true
        type: string

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    # Required context (branch protection). It must be structurally incapable
    # of concluding SKIPPED: GitHub counts a skipped required context as
    # satisfying branch protection, so there is NO job-level `if:` and NO
    # `needs` here (a job with needs is skipped when its dependency fails;
    # an if: can skip on cancellation or any future condition edit). The
    # authorizer is step 1 of THIS job, so a fork PR or unapproved dispatch
    # candidate fails the required check with a real failure - a gate that
    # cannot verify must say no, never render green or skipped. Path
    # optimization lives in step-level conditions only (see the fork guard on
    # the scan step below).
    runs-on: [self-hosted, linux, x64, vps-verify]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Authorize exact secret-scan candidate
        # Fork guard as a step, not a job: it refuses fork PRs and unapproved
        # dispatch candidates with a real failure of the required job.
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          # The repository was renamed: the canonical full_name is Nishfleet/0509
          # while GitHub Actions reports GITHUB_REPOSITORY as the nish3451/0509
          # redirect alias, and a PR's head.repo.full_name resolves to the
          # canonical Nishfleet/0509. All three forms map to the same repository
          # (id 1202826239). Accept every name form that resolves to this
          # repository instead of a single hard-coded string, otherwise internal
          # PRs are falsely rejected as forks. A genuine fork (a different
          # owner/repo) is still refused.
          repo_aliases=("nishfleet/0509" "nish3451/0509")
          is_known_repo() {
            local r; r="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            local a
            for a in "${repo_aliases[@]}"; do
              [[ "$r" == "$a" ]] && return 0
            done
            return 1
          }
          is_known_repo "$GITHUB_REPOSITORY" || { echo "unknown GITHUB_REPOSITORY: $GITHUB_REPOSITORY" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -z "$EXPECTED_SHA"
              is_known_repo "$HEAD_REPOSITORY" || { echo "fork guard: head repo $HEAD_REPOSITORY is not this repository" >&2; exit 1; }
              [[ "$GITHUB_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]
              ;;
            push)
              test -z "$EXPECTED_SHA"
              [[ "$GITHUB_REF" = "refs/heads/main" || "$GITHUB_REF" = "refs/heads/master" ]]
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = "refs/heads/main"
              test "$GITHUB_RUN_ATTEMPT" = "1"
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify authorized checkout
        shell: bash
        env:
          AUTHORIZED_SHA: ${{ steps.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$AUTHORIZED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - name: Clear stale gitleaks installer artifacts
        shell: bash
        run: rm -f /tmp/gitleaks.tmp
      - name: Scan repository
        # Fork guard on the only step in this workflow that consumes a secret
        # (GITHUB_TOKEN). The authorizer above already fails fork PRs before
        # this step; this guard keeps untrusted fork code away from the token
        # even if that gate is ever removed.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
