name: Codex PR Auto Fix

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: codex-pr-auto-fix
  cancel-in-progress: false

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - name: Check MiniMax secret
        id: ai_secret
        shell: bash
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "MINIMAX_API_KEY is not configured; skipping MiniMax repair."
          else
            echo "::add-mask::$MINIMAX_API_KEY"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail missing MiniMax secret
        if: steps.ai_secret.outputs.has_key == 'false'
        shell: bash
        run: |
          echo "MINIMAX_API_KEY is required for Codex PR Auto Fix."
          exit 1

      - name: Pick blocked Codex PR
        id: pick
        if: steps.ai_secret.outputs.has_key == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullName = `${owner}/${repo}`;

            async function listFiles(pr) {
              return await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
            }

            async function latestChecks(sha) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });
              const byName = new Map();
              for (const run of runs.sort((a, b) => new Date(b.started_at || b.created_at) - new Date(a.started_at || a.created_at))) {
                if (!byName.has(run.name)) byName.set(run.name, run);
              }
              return byName;
            }

            async function comments(pr) {
              return await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
            }

            function labels(pr) {
              return new Set((pr.labels || []).map((label) => label.name));
            }

            function isEligible(pr) {
              const set = labels(pr);
              return (
                pr.base.ref === "main" &&
                !pr.draft &&
                pr.head.repo?.full_name === fullName &&
                pr.head.ref.startsWith("codex/issue-") &&
                set.has("codex:auto-merge")
              );
            }

            function protectedFilesTouched(files) {
              const protectedPatterns = [
                /^\.github\/workflows\//,
                /^\.github\/codex\//,
                /^wrangler\.jsonc$/,
                /^d1_migrations\//,
                /^migrations\//,
                /^app\/routes\/auth/,
                /^app\/routes\/api\.auth/,
                /^app\/routes\/stripe/,
                /^app\/lib\/stripe/,
                /^app\/lib\/delivery/,
                /^app\/lib\/env/,
                /^workers\//,
              ];
              return files.some((file) => protectedPatterns.some((pattern) => pattern.test(file.filename)));
            }

            async function needsFix(pr) {
              const set = labels(pr);
              if (set.has("codex:needs-review")) return "auto-merge gate marked this PR as needing review";

              const checks = await latestChecks(pr.head.sha);
              const failed = [...checks.values()].filter((run) =>
                ["codex-node-checks", "codex-pr-review"].includes(run.name) &&
                run.status === "completed" &&
                !["success", "skipped", "neutral"].includes(run.conclusion)
              );
              if (failed.length) return `failed checks: ${failed.map((run) => `${run.name}=${run.conclusion}`).join(", ")}`;

              const review = (await comments(pr)).reverse().find((comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes("<!-- codex-pr-review -->")
              );
              const body = review?.body?.toLowerCase() || "";
              if (body.includes("merge posture: block") || body.includes("merge posture: fix first")) {
                return "Codex review requested fixes before merge";
              }
              return "";
            }

            let candidates = [];
            if (context.payload.pull_request) {
              candidates = [context.payload.pull_request];
            } else {
              candidates = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                base: "main",
                per_page: 100,
              });
            }

            for (const pr of candidates) {
              if (!isEligible(pr)) continue;
              const files = await listFiles(pr);
              if (protectedFilesTouched(files)) continue;
              const reason = await needsFix(pr);
              if (!reason) continue;

              fs.mkdirSync(".codex-runtime", { recursive: true });
              fs.writeFileSync(".codex-runtime/pr-fix.md", [
                `# PR #${pr.number}: ${pr.title}`,
                "",
                `URL: ${pr.html_url}`,
                `Branch: ${pr.head.ref}`,
                `Head SHA: ${pr.head.sha}`,
                `Reason: ${reason}`,
                "",
                "## PR Body",
                "",
                pr.body || "",
                "",
                "## Changed Files",
                "",
                ...files.map((file) => `- ${file.filename} (+${file.additions}/-${file.deletions})`),
              ].join("\n"));

              core.setOutput("number", String(pr.number));
              core.setOutput("head_ref", pr.head.ref);
              core.setOutput("title", pr.title);
              core.setOutput("reason", reason);
              return;
            }

            core.setOutput("number", "");

      - uses: actions/checkout@v6.0.2
        if: steps.pick.outputs.number != ''
        with:
          ref: ${{ steps.pick.outputs.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        if: steps.pick.outputs.number != ''
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.pick.outputs.number != ''
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && break
            sleep $((attempt * 10))
            if [ "$attempt" = "3" ]; then exit 1; fi
          done
          for attempt in 1 2 3; do
            npm install -g opencode-ai && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Configure OpenCode MiniMax
        if: steps.pick.outputs.number != ''
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "minimax": {
                "npm": "@ai-sdk/anthropic",
                "options": {
                  "baseURL": "https://api.minimax.io/anthropic/v1",
                  "apiKey": "{env:MINIMAX_API_KEY}"
                },
                "models": {
                  "MiniMax-M2.7-highspeed": {
                    "name": "MiniMax-M2.7-highspeed"
                  },
                  "MiniMax-M2.7": {
                    "name": "MiniMax-M2.7"
                  }
                }
              }
            },
            "permission": {
              "bash": {
                "git push*": "deny",
                "git merge*": "deny",
                "git tag*": "deny",
                "git rebase*": "deny",
                "gh pr merge*": "deny",
                "gh release*": "deny",
                "wrangler deploy*": "deny",
                "vercel deploy*": "deny",
                "supabase deploy*": "deny",
                "cloudflared tunnel*": "deny",
                "npm publish*": "deny",
                "npm run deploy*": "deny",
                "npx wrangler deploy*": "deny",
                "npx vercel deploy*": "deny",
                "pnpm publish*": "deny",
                "pnpm run deploy*": "deny",
                "bun publish*": "deny",
                "bun run deploy*": "deny"
              }
            }
          }
          JSON

      - name: Restore repair brief
        if: steps.pick.outputs.number != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            fs.mkdirSync(".codex-runtime", { recursive: true });
            fs.writeFileSync(".codex-runtime/pr-fix.md", [
              `# PR #${process.env.PR_NUMBER}: ${process.env.PR_TITLE}`,
              "",
              `Reason: ${process.env.PR_REASON}`,
              "",
              "Repair this PR without broadening its scope.",
            ].join("\n"));
        env:
          PR_NUMBER: ${{ steps.pick.outputs.number }}
          PR_TITLE: ${{ steps.pick.outputs.title }}
          PR_REASON: ${{ steps.pick.outputs.reason }}

      - name: Run MiniMax repair
        id: run_opencode
        if: steps.ai_secret.outputs.has_key == 'true' && steps.pick.outputs.number != ''
        timeout-minutes: 10
        shell: bash
        run: |
          prompt="$(cat .github/codex/prompts/pr-auto-fix.md)"
          models=(
            "minimax/MiniMax-M2.7-highspeed"
            "minimax/MiniMax-M2.7"
          )

          for model in "${models[@]}"; do
            echo "Trying repair model: $model"
            safe_model="${model//\//-}"
            safe_model="${safe_model//./-}"
            output_file="codex-pr-auto-fix-${safe_model}.md"

            set +e
            timeout 270s opencode run \
              --pure \
              --model "$model" \
              --dangerously-skip-permissions \
              "$prompt" > "$output_file" 2>&1
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              mv "$output_file" codex-pr-auto-fix-output.md
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "model=$model" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            {
              echo "Repair model failed: $model status=$status"
              if [ "$status" = "124" ]; then
                echo "Reason: model attempt timed out."
              fi
              echo "--- output tail ($model) ---"
              tail -n 80 "$output_file" || true
              echo
            } >> codex-pr-auto-fix-failures.log
          done

          {
            echo "MiniMax repair did not complete."
            echo
            echo "No repair commit was pushed because every configured model attempt failed or timed out."
            echo
            echo "Failure log:"
            cat codex-pr-auto-fix-failures.log
          } > codex-pr-auto-fix-output.md
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Upload repair artifact
        if: ${{ always() && steps.pick.outputs.number != '' && hashFiles('codex-pr-auto-fix-output.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: codex-pr-auto-fix
          path: codex-pr-auto-fix-output.md

      - name: Surface MiniMax repair failure
        if: steps.pick.outputs.number != '' && steps.run_opencode.outputs.ok == 'false'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const output = fs.existsSync("codex-pr-auto-fix-output.md")
              ? fs.readFileSync("codex-pr-auto-fix-output.md", "utf8").slice(0, 6000)
              : "No output file was produced.";
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              labels: ["codex:needs-review"],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: [
                "<!-- codex-auto-fix-failed -->",
                "MiniMax auto-fix did not complete.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "```",
                output,
                "```",
              ].join("\n"),
            });
        env:
          PR_NUMBER: ${{ steps.pick.outputs.number }}

      - name: Fail MiniMax repair failure
        if: steps.pick.outputs.number != '' && steps.run_opencode.outputs.ok == 'false'
        shell: bash
        run: |
          echo "MiniMax auto-fix did not complete with any configured fallback model."
          exit 1

      - name: Prepare repair PR body
        id: pr_body
        if: steps.pick.outputs.number != '' && steps.run_opencode.outputs.ok == 'true'
        shell: bash
        run: |
          body_delim="MINIMAX_BODY_$(date +%s%N)"
          {
            echo "body<<$body_delim"
            echo 'MiniMax repaired this PR after the merge gate or review found a blocker.'
            echo
            echo 'Repair reason: ${{ steps.pick.outputs.reason }}'
            echo
            echo 'MiniMax result:'
            if [ -f codex-pr-auto-fix-output.md ]; then
              cat codex-pr-auto-fix-output.md
            else
              echo 'No model output file was produced.'
            fi
            echo "$body_delim"
          } >> "$GITHUB_OUTPUT"

      - name: Remove runtime-only files from PR diff
        if: steps.pick.outputs.number != ''
        shell: bash
        run: |
          rm -rf .codex-runtime
          rm -f codex-pr-auto-fix-output.md

      - name: Detect repair diff
        id: diff
        if: steps.pick.outputs.number != '' && steps.run_opencode.outputs.ok == 'true'
        shell: bash
        run: |
          git add -N .
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Surface empty repair result
        if: steps.pick.outputs.number != '' && steps.run_opencode.outputs.ok == 'true' && steps.diff.outputs.has_changes == 'false'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              labels: ["codex:needs-review"],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: "<!-- codex-auto-fix-empty -->\nMiniMax completed but left no repository changes, so this PR still needs review.",
            });
        env:
          PR_NUMBER: ${{ steps.pick.outputs.number }}

      - name: Fail empty repair result
        if: steps.pick.outputs.number != '' && steps.run_opencode.outputs.ok == 'true' && steps.diff.outputs.has_changes == 'false'
        shell: bash
        run: |
          echo "MiniMax completed but left no repair changes."
          exit 1

      - name: Push repair commit
        id: cpr
        if: steps.pick.outputs.number != '' && steps.run_opencode.outputs.ok == 'true' && steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: ${{ steps.pick.outputs.head_ref }}
          base: main
          labels: |
            codex
            codex:auto-merge
          title: ${{ steps.pick.outputs.title }}
          body: ${{ steps.pr_body.outputs.body }}

      - name: Reset review label and comment
        if: steps.pick.outputs.number != '' && steps.cpr.outputs.pull-request-url != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "codex:needs-review" });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `<!-- codex-auto-fixed -->\nCodex pushed a repair attempt. CI and review will rerun.\n\nReason fixed: ${process.env.PR_REASON}`,
            });
        env:
          PR_NUMBER: ${{ steps.pick.outputs.number }}
          PR_REASON: ${{ steps.pick.outputs.reason }}
