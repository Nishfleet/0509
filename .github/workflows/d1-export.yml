# A weekly SQL dump of this repository's D1 database, kept off Cloudflare
# (fleet-ops#10829, fleet-ops#10837).
#
# Time Travel covers the last 30 days and only reaches back as far as the
# deploy's own bookmark. The weekly dump is the copy that survives everything
# else: a wrong restore, a deleted database, an account problem. It lands as an
# encrypted GitHub artifact on GitHub's storage, outside Cloudflare's account.
#
# The dump is sealed with age before it is uploaded: anyone with read access to
# this repository can download its artifacts, so only the ciphertext leaves the
# runner. AGE_RECIPIENT below is the backup key's public half, never a secret
# and never the private half, which stays on the fleet host and never enters
# Actions. It is a literal rather than a repository variable so this backup
# needs no GitHub settings change to start: rotating the key is a one-line edit
# in each repository that holds this job. A run without a recipient fails loud
# on purpose: a backup that quietly shipped plaintext, or quietly shipped
# nothing, is the invisibility this job exists to end. The age release is
# digest-checked before it runs.
#
# The dump itself is the stock command (`wrangler d1 export --remote`), the same
# one a person runs; this file adds only the seal and the upload. 90 days of
# retention keeps 13 weekly points, past Time Travel's 30 days.
name: D1 weekly backup

on:
  schedule:
    - cron: "37 5 * * 1" # Mondays 05:37 UTC, the same minute as the sibling repos
  workflow_dispatch: {} # a manual run for restore drills

concurrency:
  group: d1-export
  cancel-in-progress: false # a backup never kills a backup

permissions:
  contents: read

jobs:
  export:
    name: export 0509
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install age, pinned by digest
        env:
          AGE_VERSION: v1.3.2
          AGE_LINUX_AMD64_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          curl -sSLo "$RUNNER_TEMP/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_LINUX_AMD64_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age
          test -x "$RUNNER_TEMP/age-bin/age"
      - name: Dump and seal the database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGE_RECIPIENT: age1650j6pxe55udk93gv3qsjeugfrdkhazc3ynpydjm64qm8k7fvvjqc093e4
        run: |
          set -euo pipefail
          test -n "$AGE_RECIPIENT" || { echo "::error::the age recipient is empty: this backup refuses to ship a plaintext dump"; exit 1; }
          file="$RUNNER_TEMP/0509-$(date -u +%Y%m%d).sql"
          npx wrangler d1 export 0509 --remote -y --output "$file"
          echo "exported ${file##*/} ($(wc -c < "$file") bytes)"
          "$RUNNER_TEMP/age-bin/age" -r "$AGE_RECIPIENT" -o "$file.age" "$file"
          rm -f "$file"
      - name: Upload the sealed dump off Cloudflare
        # A failed dump never reaches this step, so its failure is the job's own
        # red and never a quietly empty artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup-0509
          path: ${{ runner.temp }}/0509-*.sql.age
          retention-days: 90
          if-no-files-found: error
