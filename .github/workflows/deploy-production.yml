# Every merge to main deploys production: build, D1 bookmark, migrations, deploy, smoke, and a
# rollback to the serving version when the smoke fails (0509#7004). Its run conclusion is what the
# fleet's deploy-failed alert reads, so nothing else lives in this workflow (0509#7656).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # A dispatch can name any ref; only main, the tree the queue tested, deploys (0509#7004).
    if: github.ref == 'refs/heads/main'
    concurrency: {group: deploy-production, cancel-in-progress: false}
    environment: {name: production, url: https://0509.io}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Record the D1 Time Travel bookmark before migrating (docs/REBUILD-SCHEMA.md, #5130)
        run: npx wrangler d1 time-travel info 0509 --json >> "$GITHUB_STEP_SUMMARY"
        # The token stays off `npm ci`, so no dependency install script runs beside it.
        env: &cloudflare
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply 0509 --remote
        env: *cloudflare
      - name: Record the serving Worker version, the rollback target
        run: |
          target=$(npx wrangler deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "ROLLBACK_TARGET=$target" >> "$GITHUB_ENV"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        env: *cloudflare
      - name: Deploy the Worker
        id: deploy
        run: npm run deploy -- --var "GIT_SHA:$GITHUB_SHA"
        env: *cloudflare
      - name: Smoke /api/health for this commit
        id: smoke
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS https://0509.io/api/health || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "/api/health never answered ok with commit $GITHUB_SHA; last body: $body"
          exit 1
      - name: Roll back to the serving Worker version
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: npx wrangler rollback "$ROLLBACK_TARGET" --yes --message "smoke failed $GITHUB_SHA"
        env: *cloudflare
      - name: Deploy the support inbox Worker (docs/USER-REPORTS.md, 0509#4229)
        continue-on-error: true
        run: npx wrangler deploy --config workers/support-inbox.wrangler.jsonc
        env: *cloudflare
