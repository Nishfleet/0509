name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy Worker
    if: github.repository == 'nish3451/0509' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://0509.io
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Verify Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANARY_BYPASS_TOKEN: ${{ secrets.CANARY_BYPASS_TOKEN }}
          D1_REMOTE_RESTORE_EVIDENCE_JSON: ${{ secrets.D1_REMOTE_RESTORE_EVIDENCE_JSON }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            missing+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -z "${CANARY_BYPASS_TOKEN:-}" ]; then
            missing+=("CANARY_BYPASS_TOKEN")
          fi
          if [ -z "${D1_REMOTE_RESTORE_EVIDENCE_JSON:-}" ]; then
            missing+=("D1_REMOTE_RESTORE_EVIDENCE_JSON")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secret(s): %s\n' "${missing[*]}" >&2
            printf 'Add them as repository or production-environment secrets so every main push deploys automatically.\n' >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Materialize private remote-restore evidence
        shell: bash
        env:
          D1_REMOTE_RESTORE_EVIDENCE_JSON: ${{ secrets.D1_REMOTE_RESTORE_EVIDENCE_JSON }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          umask 077
          printf '%s' "$D1_REMOTE_RESTORE_EVIDENCE_JSON" > test-results/d1-remote-restore-evidence.json

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANARY_BYPASS_TOKEN: ${{ secrets.CANARY_BYPASS_TOKEN }}
          D1_REMOTE_RESTORE_EVIDENCE_PATH: test-results/d1-remote-restore-evidence.json
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: npm run deploy

      - name: Verify complete release evidence set
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          readiness=(test-results/deploy-readiness-*.json)
          wrangler=(test-results/wrangler-deploy-output-*.jsonl)
          rollback=(test-results/worker-rollback-target-*.json)
          gate_c=(test-results/gate-c-*.json)
          production_soak=(test-results/production-soak-*.json)

          [ "${#readiness[@]}" -ge 5 ]
          [ "${#wrangler[@]}" -eq 1 ]
          [ "${#rollback[@]}" -eq 1 ]
          [ "${#gate_c[@]}" -eq 1 ]
          [ "${#production_soak[@]}" -eq 1 ]
          [ -n "$(find test-results/gate-b-artifacts -type f -print -quit)" ]
          node scripts/gate-c-soak.mjs verify-start --journal "${production_soak[0]}"

      - name: Archive permission-preserving release evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/release-evidence-archive.mjs create \
            --output "test-results/production-release-evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

      - name: Preserve release evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/production-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Preserve failed release diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/deploy-readiness-*.json
            test-results/gate-b-manifest-*.json
            test-results/gate-b-artifacts/**
            test-results/wrangler-deploy-output-*.jsonl
            test-results/worker-rollback-target-*.json
            test-results/gate-c-*.json
            test-results/production-soak-*.json
          if-no-files-found: warn
          retention-days: 90
