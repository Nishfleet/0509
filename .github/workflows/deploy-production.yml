# Push to main deploys; migrations apply before the Worker so schema and code
# land in one ordered step. The first run of this workflow wiped the pre-rebuild
# schema (0001_rebuild.sql DROP prologue; approved by Nish 2026-09-20, 0 users).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # 0509#7004: a dispatch can name any ref, so only a tree the merge queue
    # tested deploys; skipping here skips lighthouse and lighthouse-report too.
    if: github.ref == 'refs/heads/main'
    # Job-level, so the lighthouse audit below never holds back the next deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The production environment records each deploy as a GitHub Deployment.
    environment:
      name: production
      url: https://0509.io
    # 0509#7004: no `npm test` repeat here (run 37179881263 bought 20 minutes
    # and no verdict). 15 minutes keeps a slow build or rollout from cancelling
    # the job before the smoke verdict and rollback.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 0509#7004: typecheck and the full suite already passed on this tree in
      # the merge queue (ruleset 21391031: no bypass actor, no other merge path);
      # a second verdict cost 12 minutes. `npm run build` stays: the deploy uses it.
      - run: npm run build

      - name: Record the D1 Time Travel bookmark taken just before migrating
        # docs/REBUILD-SCHEMA.md + #5130: a migration that drops or rewrites a
        # tracked table is undone by restoring this bookmark.
        run: npx wrangler d1 time-travel info 0509 --json >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        # Read this step's output before calling a deploy good: the production
        # database is reset here.
        run: npx wrangler d1 migrations apply 0509 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record the serving Worker version before this deploy replaces it
        # 0509#7004: `wrangler rollback` with no version-id picks the previous
        # stable entry, which the deploy below changes. Fails the job when no
        # version at 100% traffic can be read: no way back, no deploy.
        id: previous
        run: |
          target=$(npx wrangler deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "version_id=$target" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        id: deploy
        # GIT_SHA is the commit /api/health names (#7187). `--var KEY:VALUE`
        # overrides the empty default in wrangler.jsonc's vars:
        # https://developers.cloudflare.com/workers/wrangler/commands/#deploy
        run: npm run deploy -- --var "GIT_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Sentry source maps for the new release
        # 0509#7192: the Sentry release name is the Worker version id
        # (workers/sentry.ts reads CF_VERSION_METADATA.id), and wrangler's
        # upload_source_maps never touches Sentry. Skipped without the token
        # secret; continue-on-error so a Sentry outage never rolls a deploy back.
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: 0509-gg
          SENTRY_PROJECT: five-to-nine
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN secret is not set; skipping the Sentry source-map upload."
            exit 0
          fi
          version=$(npx wrangler deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read the deployed Worker version id." >&2
            exit 1
          fi
          npx -y @sentry/cli@2.58.6 releases new "$version"
          npx -y @sentry/cli@2.58.6 releases files "$version" upload-sourcemaps ./build/server --rewrite --ext js --ext map --strip-prefix ./build/server
          npx -y @sentry/cli@2.58.6 releases finalize "$version"
          set -- build/server/*.map build/server/assets/*.map
          echo "Sentry release $version carries $# source maps." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke the deployed Worker
        id: smoke
        # 0509#7004: a step timeout fails the step so the rollback still runs; a job timeout would skip it.
        timeout-minutes: 3
        # A 500 from the previous version is not a success: the body must name
        # this run's commit (#7187). 20 tries, 5 s apart, waits out the edge rollout.
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS https://0509.io/api/health || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "/api/health never answered ok with commit $GITHUB_SHA; last body: $body"
          exit 1

      - name: Roll back to the serving Worker version
        # 0509#7004: a red smoke used to leave the new Worker live. Scoped to a
        # successful deploy whose smoke failed, was cancelled or was skipped
        # (smoke.outcome != 'success'), and always() so a cancelled job still
        # rolls back (failure() alone would skip it on cancellation); placed
        # before the fixture Workers, which never roll back a good deploy.
        # Migrations are additive, so the schema is not rolled back: the D1 Time
        # Travel bookmark above is the path for tables.
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        # --yes: wrangler 4.144.0 declares it; prompts take their fallback (yes)
        # because CI=true. A Durable Object migration (new_sqlite_classes) can
        # make rollback impossible: that deploy needs a manual recovery.
        run: npx wrangler rollback "$ROLLBACK_TARGET" --yes --message "smoke failed $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TARGET: ${{ steps.previous.outputs.version_id }}

      - name: Deploy the fixture-site Worker
        # J8's breakable own-site fixture (0509#4046): a separate Worker on
        # fixture.0509.in, deployed by the normal CI path. continue-on-error:
        # this job carries `environment: production` and gates lighthouse, so
        # test infrastructure must never stand between a good app deploy and its
        # verification (the likeliest failure is the zone's first custom domain).
        # Break and price state live in a SQLite Durable Object (0509#4305);
        # migration tag v1 in the wrangler config creates the class on deploy.
        continue-on-error: true
        run: npx wrangler deploy --config workers/fixture-site.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the e2e inbox Worker
        # The J1 mail sink (0509#3927): a separate Worker on its own route, same
        # fixture shape as J8. Runs AFTER the app smoke so test-infra can never
        # stand between a good app deploy and its verification.
        run: npx wrangler deploy --config workers/e2e-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the support inbox Worker
        # The user-report door (0509#4229, docs/USER-REPORTS.md): the support
        # address routes here once the Email Routing rule moves (child 4, gated
        # on Nish). Runs AFTER the app smoke so it can never stand between a
        # good app deploy and its verification; continue-on-error for the same
        # `environment: production` gating as fixture-site. Its D1 table
        # (`support_report`) comes from the `Apply D1 migrations` step above.
        continue-on-error: true
        run: npx wrangler deploy --config workers/support-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  lighthouse:
    name: lighthouse
    # The performance half of verification (talk 14:30): correctness says the
    # feature works, this says it is still fast. The audit and its budgets are
    # the fleet's, defined once in fleet-ops (lighthouse.yml and
    # config/lighthouserc.json); this repo passes only the URLs, so no change
    # here can loosen them. Called at @main on purpose, like the agent-dispatch
    # stub: .github/zizmor.yml. Not required: it cannot run on a pull request.
    needs: [deploy]
    permissions:
      contents: read
    uses: Nishfleet/fleet-ops/.github/workflows/lighthouse.yml@main
    with:
      # The public pages: no Access, no session, so a deploy sends no
      # email and needs no secret. / is the homepage (the landing LCP bar in
      # docs/REBUILD-DONE.md B). The signed-in pages are measured by the
      # scheduled suite once 0509#6034 lands.
      urls: |
        https://0509.io/
        https://0509.io/privacy
        https://0509.io/terms

  lighthouse-report:
    name: lighthouse-report
    # What this repo does with the called audit's verdict: open the issue that
    # dispatches the fix when it is red, close it when it is green. Its own job
    # because a job that calls a reusable workflow has no steps, and so that
    # issues: write and actions: write are held by this job and not the audit.
    needs: [deploy, lighthouse]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue that dispatches the fix
        if: needs.lighthouse.result == 'failure' || needs.lighthouse.result == 'cancelled'
        id: red
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/red-main/lighthouse.md
          update_existing: true
          search_existing: open
      - name: Hand the issue to a worker
        # A GITHUB_TOKEN label fires no workflow, so dispatch by number;
        # agent.yml's Gate sizes it. needs-split alone left #4620 unworked.
        if: (needs.lighthouse.result == 'failure' || needs.lighthouse.result == 'cancelled') && steps.red.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.red.outputs.number }}
        run: gh workflow run agent-dispatch.yml --repo "$GITHUB_REPOSITORY" -f issue="$N"
      - name: Close the issue once this check is green again
        if: needs.lighthouse.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"lighthouse red on main" in:title' --json number --jq '.[0].number // empty')
          [ -z "$N" ] || gh issue close "$N" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Green again on $RUN_URL."
