name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://0509.io
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Record the D1 Time Travel bookmark taken just before migrating
        run: npx wrangler d1 time-travel info 0509 --json >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply 0509 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record the serving Worker version before this deploy replaces it
        id: previous
        run: |
          target=$(npx wrangler deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "version_id=$target" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        id: deploy
        run: npm run deploy -- --var "GIT_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke the deployed Worker
        id: smoke
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS https://0509.io/api/health || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "/api/health never answered ok with commit $GITHUB_SHA; last body: $body"
          exit 1

      - name: Roll back to the serving Worker version
        # 0509#7004: a red smoke test used to leave the new Worker live. Scoped
        # by steps.deploy.outcome (a failed deploy has nothing to undo) and
        # placed before the fixture Workers, which never roll back a good deploy.
        # always() so a cancelled job (job timeout, manual cancel) mid-smoke
        # still rolls back: failure() is false on cancellation and would skip
        # this step. smoke.outcome != 'success' covers failure, cancelled and
        # skipped; deploy.outcome == 'success' keeps it off any run whose
        # deploy never went out.
        # The Worker version is rolled back, the schema is not: migrations are
        # additive, and the D1 Time Travel bookmark above is the path for tables.
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: npx wrangler rollback "$ROLLBACK_TARGET" --yes --message "smoke failed $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TARGET: ${{ steps.previous.outputs.version_id }}

      - name: Deploy the fixture-site Worker
        # continue-on-error, because this job carries `environment: production`
        # and its status gates the lighthouse job below. A
        # failure here — the likeliest being the first-ever custom domain created
        # on the 0509.in zone — would otherwise skip the app's own production
        # verification, which is exactly the inverting this comment needs to keep
        # false: test infrastructure must never stand between a good app deploy
        # and its verification.
        continue-on-error: true
        run: npx wrangler deploy --config workers/fixture-site.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the e2e inbox Worker
        run: npx wrangler deploy --config workers/e2e-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the support inbox Worker
        # continue-on-error for the same reason as the fixture-site step: this
        # job carries `environment: production` and its status gates the
        # lighthouse job below. Its D1 table (`support_report`)
        # comes from the `Apply D1 migrations` step earlier in this job.
        continue-on-error: true
        run: npx wrangler deploy --config workers/support-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  staging:
    name: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.0509.io
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: CLOUDFLARE_VITE_FORCE_BUILD_OUTPUT=true npx react-router build --mode staging
      - name: Apply D1 migrations
        run: npx cf d1 migrations apply "$(jq -r .env.DB.id .cloudflare/output/v0/workers/default/worker.config.json)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the staging Worker
        run: |
          [ -n "$DODO_TEST_API_KEY" ] || { echo "::error::DODO_TEST_API_KEY is empty"; exit 1; }
          secrets=$(mktemp)
          trap 'rm -f "$secrets"' EXIT
          jq -n '{DODO_PAYMENTS_API_KEY: env.DODO_TEST_API_KEY}' > "$secrets"
          npx cf deploy --prebuilt --mode staging --secrets-file "$secrets"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DODO_TEST_API_KEY: ${{ secrets.DODO_TEST_API_KEY }}
      - name: Smoke staging
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS https://staging.0509.io/api/health || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "/api/health never answered ok with commit $GITHUB_SHA; last body: $body"
          exit 1

  lighthouse:
    name: lighthouse
    # The performance half of verification (talk 14:30): correctness says the
    # feature works, this says it is still fast. The audit and its budgets are
    # the fleet's, defined once in fleet-ops (lighthouse.yml and
    # config/lighthouserc.json); this repo passes only the URLs, so no change
    # here can loosen them. Called at @main on purpose, like the agent-dispatch
    # stub: .github/zizmor.yml. Not required: it cannot run on a pull request.
    needs: [deploy]
    permissions:
      contents: read
    uses: Nishfleet/fleet-ops/.github/workflows/lighthouse.yml@main
    with:
      # The public pages: no Access, no session, so a deploy sends no
      # email and needs no secret. / is the homepage (the landing LCP bar in
      # docs/REBUILD-DONE.md B). The signed-in pages are measured by the
      # scheduled suite once 0509#6034 lands.
      urls: |
        https://0509.io/
        https://0509.io/privacy
        https://0509.io/terms

  lighthouse-report:
    name: lighthouse-report
    # What this repo does with the called audit's verdict: open the issue that
    # dispatches the fix when it is red, close it when it is green. Its own job
    # because a job that calls a reusable workflow has no steps, and so that
    # issues: write and actions: write are held by this job and not the audit.
    needs: [deploy, lighthouse]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue that dispatches the fix
        if: needs.lighthouse.result == 'failure' || needs.lighthouse.result == 'cancelled'
        id: red
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/red-main/lighthouse.md
          update_existing: true
          search_existing: open
      - name: Hand the issue to a worker
        # A GITHUB_TOKEN label fires no workflow, so dispatch by number;
        # agent.yml's Gate sizes it. needs-split alone left #4620 unworked.
        if: (needs.lighthouse.result == 'failure' || needs.lighthouse.result == 'cancelled') && steps.red.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.red.outputs.number }}
        run: gh workflow run agent-dispatch.yml --repo "$GITHUB_REPOSITORY" -f issue="$N"
      - name: Close the issue once this check is green again
        if: needs.lighthouse.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"lighthouse red on main" in:title' --json number --jq '.[0].number // empty')
          [ -z "$N" ] || gh issue close "$N" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Green again on $RUN_URL."
