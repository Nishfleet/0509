# Push to main deploys. The migration step runs before the Worker goes out, so
# schema and code land in one ordered step — and note what that means for this
# rebuild: the first run of this workflow applies 0001_rebuild.sql, whose DROP
# prologue wipes the pre-rebuild schema from production D1. Nish approved that
# wipe on 2026-09-20; there are 0 users.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # 0509#7004: workflow_dispatch can name any ref, so before this guard a
    # dispatch started from a feature branch deployed code that never passed
    # the merge queue. A push arrives from main and a dispatch names its ref,
    # so only a tree the queue tested gets deployed. Skipping here skips
    # lighthouse and lighthouse-report with it, because both need this job.
    if: github.ref == 'refs/heads/main'
    # Job-level, so the lighthouse audit below never holds back the next deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The production environment records each deploy as a GitHub Deployment.
    environment:
      name: production
      url: https://0509.io
    # 0509#7004: 20 minutes bought a full `npm test` repeat this job does not
    # run, and a run that spent it in `npm test` (37179881263) had no verdict
    # to show for it. The workflow now builds, migrates, deploys and smokes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 0509#7004: typecheck and the full test suite ran here and in the merge
      # queue, which passed on this same tree before main accepted it
      # (ruleset 21391031 has no bypass actor and no other merge path). A
      # second identical verdict bought 12 minutes of deploy time and could
      # time out. `npm run build` stays: it produces the bundle `npm run
      # deploy` uploads.
      - run: npm run build

      - name: Record the D1 Time Travel bookmark taken just before migrating
        # docs/REBUILD-SCHEMA.md: a migration that drops or rewrites a table
        # with tracking history is undone by restoring this bookmark (#5130).
        run: npx wrangler d1 time-travel info 0509 --json >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        # Read this step's output before calling a deploy good: this is where
        # the production database is reset.
        run: npx wrangler d1 migrations apply 0509 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record the serving Worker version before this deploy replaces it
        # 0509#7004: the rollback below needs the version to return to, and
        # `wrangler rollback` with no version-id resolves one itself: the
        # previous stable entry in the deployment list, which the deploy that
        # follows then changes. Recording costs one authenticated read and
        # makes the target a fact instead of a guess. Fails the job when no
        # live version at 100% traffic can be read, because deploying with no
        # way back is the state this file stops choosing.
        id: previous
        run: |
          target=$(npx wrangler deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "version_id=$target" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        id: deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke the deployed Worker
        # 0509#7004: id'd so the rollback below can tell a failed deploy from
        # a red smoke test.
        id: smoke
        # 0509#7004: a step timeout fails the step and the rollback still
        # runs; the job timeout would cancel the job and skip the rollback.
        timeout-minutes: 3
        # A deploy that reports success while the site 500s is not a success.
        run: curl -fsS --retry 20 --retry-delay 5 --retry-all-errors https://0509.io/api/health | grep -q '"status":"ok"'

      - name: Roll back to the serving Worker version
        # 0509#7004: a red smoke test used to leave the new Worker live until
        # a human read the run. It runs directly after the smoke step, so only
        # the deploy and the smoke can have failed; the fixture Workers below
        # are test infrastructure and never roll back a good app deploy.
        # `steps.deploy.outcome == 'success'` is what scopes it: with a
        # failed deploy there is no new version to undo.
        #
        # The Worker version is rolled back, the schema is not: migrations are
        # additive so the previous version runs against the new schema, and
        # the D1 Time Travel bookmark above is the path back for tables. This
        # is the fast rollback, not the undo of the migration.
        #
        # Wrangler reads the message and the confirmation from
        # non-interactive defaults (--message set, confirm falls back to yes),
        # so this step never waits on a prompt.
        if: failure() && steps.deploy.outcome == 'success'
        run: npx wrangler rollback "$ROLLBACK_TARGET" --message "smoke failed $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TARGET: ${{ steps.previous.outputs.version_id }}

      - name: Deploy the fixture-site Worker
        # J8's breakable own-site fixture (0509#4046): a separate Worker with
        # its own name and route on fixture.0509.in, deployed by the normal CI
        # deploy job — no bespoke deploy path.
        #
        # continue-on-error, because this job carries `environment: production`
        # and its status gates the lighthouse job below. A
        # failure here — the likeliest being the first-ever custom domain created
        # on the 0509.in zone — would otherwise skip the app's own production
        # verification, which is exactly the inverting this comment needs to keep
        # false: test infrastructure must never stand between a good app deploy
        # and its verification.
        #
        # The break and price state live in a SQLite Durable Object (0509#4305).
        # Migration tag v1 in the wrangler config creates the class on deploy, so
        # there is no KV namespace to provision.
        continue-on-error: true
        run: npx wrangler deploy --config workers/fixture-site.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the e2e inbox Worker
        # The J1 mail sink (0509#3927): a separate Worker with its own name
        # and route, same fixture shape as J8's fixture.0509.in. Runs AFTER the
        # app smoke so test-infra can never stand between a good app deploy and
        # its verification.
        run: npx wrangler deploy --config workers/e2e-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the support inbox Worker
        # The user-report door (0509#4229, docs/USER-REPORTS.md): the support
        # address lands in workers/support-inbox.ts once the Email Routing rule
        # moves (child 4, gated on Nish). Runs AFTER the app smoke so it can
        # never stand between a good app deploy and its verification.
        # continue-on-error for the same reason as the fixture-site step: this
        # job carries `environment: production` and its status gates the
        # lighthouse job below. Its D1 table (`support_report`)
        # comes from the `Apply D1 migrations` step earlier in this job.
        continue-on-error: true
        run: npx wrangler deploy --config workers/support-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  lighthouse:
    name: lighthouse
    # The performance half of verification (talk 14:30): correctness says the
    # feature works, this says it is still fast. The audit and its budgets are
    # the fleet's, defined once in fleet-ops (lighthouse.yml and
    # config/lighthouserc.json); this repo passes only the URLs, so no change
    # here can loosen them. Called at @main on purpose, like the agent-dispatch
    # stub: .github/zizmor.yml. Not required: it cannot run on a pull request.
    needs: [deploy]
    permissions:
      contents: read
    uses: Nishfleet/fleet-ops/.github/workflows/lighthouse.yml@main
    with:
      # The public pages: no Access, no session, so a deploy sends no
      # email and needs no secret. /design/landing is the staged homepage
      # (the landing LCP bar in docs/REBUILD-DONE.md B) and is public until
      # 0509#4834 moves it to /. The signed-in pages are measured by the
      # scheduled suite once 0509#6034 lands.
      urls: |
        https://0509.io/
        https://0509.io/privacy
        https://0509.io/terms
        https://0509.io/design/landing

  lighthouse-report:
    name: lighthouse-report
    # What this repo does with the called audit's verdict: open the issue that
    # dispatches the fix when it is red, close it when it is green. Its own job
    # because a job that calls a reusable workflow has no steps, and so that
    # issues: write and actions: write are held by this job and not the audit.
    needs: [deploy, lighthouse]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue that dispatches the fix
        if: needs.lighthouse.result == 'failure' || needs.lighthouse.result == 'cancelled'
        id: red
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/red-main/lighthouse.md
          update_existing: true
          search_existing: open
      - name: Hand the issue to a worker
        # A GITHUB_TOKEN label fires no workflow, so dispatch by number;
        # agent.yml's Gate sizes it. needs-split alone left #4620 unworked.
        if: (needs.lighthouse.result == 'failure' || needs.lighthouse.result == 'cancelled') && steps.red.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.red.outputs.number }}
        run: gh workflow run agent-dispatch.yml --repo "$GITHUB_REPOSITORY" -f issue="$N"
      - name: Close the issue once this check is green again
        if: needs.lighthouse.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"lighthouse red on main" in:title' --json number --jq '.[0].number // empty')
          [ -z "$N" ] || gh issue close "$N" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Green again on $RUN_URL."
