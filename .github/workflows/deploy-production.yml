name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  prepare_remote_restore_evidence:
    name: Prepare D1 remote restore evidence
    if: github.repository == 'nish3451/0509' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vps-verify]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: ./scripts/deploy-window-lock.sh run -- npm ci --ignore-scripts
      - run: ./scripts/deploy-window-lock.sh run -- node scripts/validate-d1-backup.mjs
      - name: Bind a clean exact-main candidate manifest
        shell: bash
        run: |
          ./scripts/deploy-window-lock.sh run -- bash -euo pipefail <<'VERIFY_LANE'
          set -euo pipefail
          umask 077
          node scripts/customer-readiness-candidate.mjs --base HEAD \
            > "$RUNNER_TEMP/d1-remote-restore-candidate.json"
          node scripts/build-remote-restore-candidate-manifest.mjs \
            --candidate "$RUNNER_TEMP/d1-remote-restore-candidate.json" \
            --output "$RUNNER_TEMP/d1-remote-restore-candidate-manifest.json"
          VERIFY_LANE
      - name: Verify pre-generated exact R2 restore evidence
        shell: bash
        env:
          D1_REMOTE_RESTORE_EVIDENCE_MIN_VALIDITY_MS: "43200000"
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/deploy-window-lock.sh run -- bash -euo pipefail <<'VERIFY_LANE'
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/d1-remote-restore-evidence.json"
          manifest="$RUNNER_TEMP/d1-remote-restore-candidate-manifest.json"
          cache="$RUNNER_TEMP/d1-remote-restore-evidence-cache"
          evidence_valid=false

          verify_evidence() {
            local attempt
            local status
            for attempt in 1 2 3; do
              set +e
              node scripts/verify-remote-restore-evidence.mjs \
                --manifest "$manifest" \
                --remote-evidence "$evidence"
              status=$?
              set -e
              if [ "$status" -ne 2 ]; then
                return "$status"
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 2
          }

          find_recent_artifact() {
            local attempt
            local output
            local status
            for attempt in 1 2 3; do
              set +e
              output="$(
                node scripts/find-recent-remote-restore-artifact.mjs
              )"
              status=$?
              set -e
              if [ "$status" -ne 2 ]; then
                if [ "$status" -eq 0 ]; then
                  printf '%s\n' "$output"
                fi
                return "$status"
              fi
              printf '::warning::Restore-evidence artifact lookup infrastructure failure; retrying (%s/3).\n' \
                "$attempt" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 2
          }

          download_artifact() {
            local attempt
            local name="$2"
            local run_id="$1"
            local target="$3"
            if ! command -v gh >/dev/null 2>&1; then
              printf '::warning::GitHub CLI is unavailable on this runner; restore-evidence artifact reuse is unavailable.\n' >&2
              return 1
            fi
            for attempt in 1 2 3; do
              if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$name" \
                --dir "$target"; then
                return 0
              fi
              printf '::warning::Restore-evidence artifact download infrastructure failure; retrying (%s/3).\n' \
                "$attempt" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 2
          }

          rm -f -- "$evidence"
          mkdir -p -- "$cache"
          artifact_status=0
          artifact_tsv=""
          artifact_tsv="$(find_recent_artifact)" ||
            artifact_status=$?
          if [ "$artifact_status" -eq 0 ]; then
            prior_run_id=""
            prior_name=""
            IFS=$'\t' read -r prior_run_id prior_name <<< "$artifact_tsv"
            if [[ ! "$prior_run_id" =~ ^[0-9]+$ ]] ||
              [[ ! "$prior_name" =~ ^d1-remote-restore-evidence-[a-f0-9]{40}-[0-9]+$ ]]; then
              printf '::error::Restore-evidence artifact finder returned an invalid identity.\n' >&2
              exit 2
            fi
            download_status=0
            download_artifact "$prior_run_id" "$prior_name" "$cache" ||
              download_status=$?
            if [ "$download_status" -eq 2 ]; then
              printf '::error::Restore-evidence artifact download failed after retries.\n' >&2
              exit "$download_status"
            fi
            if [ "$download_status" -eq 0 ]; then
              shopt -s nullglob
              archives=("$cache"/*.tar.gz)
              if [ "${#archives[@]}" -eq 1 ] &&
                [ "$(tar -tzf "${archives[0]}")" = "d1-remote-restore-evidence.json" ] &&
                [[ "$(tar -tvzf "${archives[0]}")" = -* ]]; then
                if tar -xOzf "${archives[0]}" \
                  d1-remote-restore-evidence.json > "$evidence"; then
                  chmod 600 "$evidence"
                  verification_status=0
                  verify_evidence || verification_status=$?
                  if [ "$verification_status" -eq 0 ]; then
                    printf 'Recent private restore evidence is valid for this deploy.\n'
                    evidence_valid=true
                  elif [ "$verification_status" -eq 1 ]; then
                    rm -f -- "$evidence"
                  else
                    exit "$verification_status"
                  fi
                else
                  rm -f -- "$evidence"
                fi
              fi
            fi
          elif [ "$artifact_status" -ne 1 ]; then
            printf '::error::Restore-evidence artifact lookup infrastructure failed after retries.\n' >&2
            exit "$artifact_status"
          fi

          rm -rf -- "$cache"
          if [ "$evidence_valid" != true ]; then
            printf '::error::No valid pre-generated restore evidence is available. Run the D1 remote restore evidence workflow in its recovery window, then rerun this deploy.\n' >&2
            exit 1
          fi

          verify_evidence
          test "$(stat -c '%a' "$evidence")" = "600"
          archive="$GITHUB_WORKSPACE/.d1-remote-restore-evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
          evidence_dir="${evidence%/*}"
          evidence_name="${evidence##*/}"
          tar --format=posix -czf "$archive" \
            -C "$evidence_dir" \
            "$evidence_name"
          chmod 600 "$archive"
          VERIFY_LANE
      - name: Preserve private restore evidence for this deploy only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d1-remote-restore-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ github.workspace }}/.d1-remote-restore-evidence-${{ github.sha }}-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 8
      - name: Remove local restore evidence archive
        if: always()
        shell: bash
        run: rm -f -- "$GITHUB_WORKSPACE/.d1-remote-restore-evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"

  deploy:
    name: Deploy Worker
    if: >-
      github.repository == 'nish3451/0509' &&
      github.ref == 'refs/heads/main' &&
      needs.prepare_remote_restore_evidence.result == 'success'
    needs: prepare_remote_restore_evidence
    runs-on: ubuntu-latest
    # Budget: 180m maximum deploy-window wait + 60m conservative pipeline +
    # 30m cancellation/release slack = 270m. With cancel-in-progress: false,
    # a queued deploy cannot drain until the running job (including its lock
    # wait) finishes, so stacked pushes may each consume this full budget.
    timeout-minutes: 270
    environment:
      name: production
      url: https://0509.io
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Acquire deploy window
        shell: bash
        env:
          DEPLOY_WINDOW_CAPABILITY_FILE: ${{ runner.temp }}/deploy-window-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.capability
        run: ./scripts/deploy-window-lock.sh acquire

      - name: Verify Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANARY_BYPASS_TOKEN: ${{ secrets.CANARY_BYPASS_TOKEN }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            missing+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -z "${CANARY_BYPASS_TOKEN:-}" ]; then
            missing+=("CANARY_BYPASS_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secret(s): %s\n' "${missing[*]}" >&2
            printf 'Add them as repository or production-environment secrets so every main push deploys automatically.\n' >&2
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Materialize private remote-restore evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: d1-remote-restore-evidence-${{ github.sha }}-${{ github.run_id }}
          path: test-results/remote-restore-download

      - name: Verify and extract private remote-restore evidence
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          umask 077
          archives=(test-results/remote-restore-download/*.tar.gz)
          [ "${#archives[@]}" -eq 1 ]
          [ "$(tar -tzf "${archives[0]}")" = "d1-remote-restore-evidence.json" ]
          [[ "$(tar -tvzf "${archives[0]}")" = -* ]]
          tar -xOzf "${archives[0]}" \
            d1-remote-restore-evidence.json \
            > test-results/d1-remote-restore-evidence.json
          chmod 600 test-results/d1-remote-restore-evidence.json
          rm -rf -- test-results/remote-restore-download

      - name: Synchronize private canary token
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANARY_BYPASS_TOKEN: ${{ secrets.CANARY_BYPASS_TOKEN }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: |
          set -euo pipefail
          printf '%s' "$CANARY_BYPASS_TOKEN" |
            ./node_modules/.bin/wrangler secret put CANARY_BYPASS_TOKEN --name 0509

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CANARY_BYPASS_TOKEN: ${{ secrets.CANARY_BYPASS_TOKEN }}
          D1_REMOTE_RESTORE_EVIDENCE_PATH: test-results/d1-remote-restore-evidence.json
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: npm run deploy

      - name: Verify complete release evidence set
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          readiness=(test-results/deploy-readiness-*.json)
          wrangler=(test-results/wrangler-deploy-output-*.jsonl)
          rollback=(test-results/worker-rollback-target-*.json)
          gate_c=(test-results/gate-c-*.json)
          production_soak=(test-results/production-soak-*.json)

          # The authoritative deploy-readiness manifest is the single
          # deploy-readiness-<pid>-<hex>.json written by the release gate. The
          # deploy-readiness-local-release-<project>.json files are side-effects
          # of the cross_browser_risk_proof step, which became a non-blocking
          # diagnostic on 2026-07-20 and is allowed to fail partway on starved
          # runners — so it emits an unstable subset (0-4) of its per-project
          # manifests. Counting all deploy-readiness-*.json and requiring >= 5
          # therefore FAILED genuinely-successful deploys once that diagnostic
          # stopped completing (runs 29767292426 / 29804405475 produced only 3:
          # the real manifest + firefox + webkit). Prove the authoritative
          # manifest exists (exactly one) without depending on the flaky
          # diagnostic's output — stricter than the old >= 5, not weaker.
          authoritative_readiness=()
          for manifest in "${readiness[@]}"; do
            case "$manifest" in
              test-results/deploy-readiness-local-release-*.json) ;;
              *) authoritative_readiness+=("$manifest") ;;
            esac
          done

          [ "${#authoritative_readiness[@]}" -eq 1 ]
          [ "${#wrangler[@]}" -eq 1 ]
          [ "${#rollback[@]}" -eq 1 ]
          [ "${#gate_c[@]}" -eq 1 ]
          [ "${#production_soak[@]}" -eq 1 ]
          [ -n "$(find test-results/gate-b-artifacts -type f -print -quit)" ]
          node scripts/gate-c-soak.mjs verify-start --journal "${production_soak[0]}"

      - name: Archive permission-preserving release evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/release-evidence-archive.mjs create \
            --output "test-results/production-release-evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

      - name: Preserve release evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/production-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Preserve failed release diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-release-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/deploy-readiness-*.json
            test-results/gate-b-manifest-*.json
            test-results/gate-b-artifacts/**
            test-results/wrangler-deploy-output-*.jsonl
            test-results/worker-rollback-target-*.json
            test-results/gate-c-*.json
            test-results/production-soak-*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Release deploy window
        if: always()
        shell: bash
        env:
          DEPLOY_WINDOW_CAPABILITY_FILE: ${{ runner.temp }}/deploy-window-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.capability
        run: ./scripts/deploy-window-lock.sh release

      - name: Remove deploy-window capability file
        if: always()
        shell: bash
        env:
          DEPLOY_WINDOW_CAPABILITY_FILE: ${{ runner.temp }}/deploy-window-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.capability
        run: |
          umask 077
          rm -f -- "$DEPLOY_WINDOW_CAPABILITY_FILE"
