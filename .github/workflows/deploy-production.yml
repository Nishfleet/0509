# Push to main deploys. The migration step runs before the Worker goes out, so
# schema and code land in one ordered step — and note what that means for this
# rebuild: the first run of this workflow applies 0001_rebuild.sql, whose DROP
# prologue wipes the pre-rebuild schema from production D1. Nish approved that
# wipe on 2026-09-20; there are 0 users.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # A job with an environment gets a GitHub Deployment and deployment_status
    # events for free; ci.yml's e2e-production and lighthouse jobs key off that
    # event and read the url below as PLAYWRIGHT_TEST_BASE_URL. Without this
    # block those jobs never fire (no deployment was created since C4).
    environment:
      name: production
      url: https://0509.io
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Apply D1 migrations
        # Read this step's output before calling a deploy good: this is where
        # the production database is reset.
        run: npx wrangler d1 migrations apply 0509 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke the deployed Worker
        # A deploy that reports success while the site 500s is not a success.
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS https://0509.io/api/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 5
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Deploy the fixture-site Worker
        # J8's breakable own-site fixture (0509#4046): a separate Worker with
        # its own name and route on fixture.0509.in, deployed by the normal CI
        # deploy job — no bespoke deploy path.
        #
        # continue-on-error, because this job carries `environment: production`
        # and its status gates ci.yml's e2e-production and lighthouse jobs. A
        # failure here — the likeliest being the first-ever custom domain created
        # on the 0509.in zone — would otherwise skip the app's own production
        # verification, which is exactly the inverting this comment needs to keep
        # false: test infrastructure must never stand between a good app deploy
        # and its verification.
        #
        # The KV binding has no id on purpose, matching the e2e inbox: wrangler's
        # deploy-time resource provisioning creates the 0509-fixture-site-state
        # namespace on first deploy and inherits it from the deployed Worker's
        # settings on later ones.
        continue-on-error: true
        run: npx wrangler deploy --config workers/fixture-site.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the e2e inbox Worker
        # The J1 mail sink (0509#3927): a separate Worker with its own name
        # and route, same fixture shape as J8's fixture.0509.in. Runs AFTER the
        # app smoke so test-infra can never stand between a good app deploy and
        # its verification. The KV binding has no id on purpose: wrangler's
        # deploy-time resource provisioning (default on, --x-provision) creates
        # the 0509-e2e-inbox-inbox namespace on first deploy and inherits it
        # from the deployed Worker's settings on later ones — verified against
        # wrangler 4.136's provisionBindings/KVHandler source.
        run: npx wrangler deploy --config workers/e2e-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the support inbox Worker
        # User reports (0509#4229): a separate Worker, after the e2e inbox so
        # it stays behind the app smoke. Email Routing is not changed here.
        # The support@0509.io rule moves only after this Worker is up and
        # SUPPORT_INBOX_GITHUB_TOKEN is set on it. The secret is not in this file.
        run: npx wrangler deploy --config workers/support-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
