# Production deploy. Stock pipeline (0509#3679, 2026-09-20):
# verify (no secrets) -> deploy: migrate, wrangler deploy, smoke, wrangler
# rollback on a failed smoke. Restore is D1 Time Travel; the weekly export is
# d1-backup-weekly.yml. No gate scripts, no evidence artifacts.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 0509-production-provider-mutations
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://0509.io
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Only main deploys
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply 0509 --remote
      - name: Deploy Worker
        run: npm run deploy
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Smoke test production
        id: smoke
        run: npm run e2e:prod:public
      - name: Roll back on failed smoke
        if: failure() && steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --yes --message "smoke failed on ${{ github.sha }}"
      - name: Keep smoke traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: prod-smoke-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
