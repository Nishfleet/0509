name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # 0509#7004: workflow_dispatch can name any ref, so before this guard a
    # dispatch started from a feature branch deployed code that never passed
    # the merge queue. A push arrives from main and a dispatch names its ref,
    # so only a tree the queue tested gets deployed.
    if: github.ref == 'refs/heads/main'
    # Job-level, so a queued deploy waits for the running one instead of
    # cancelling it, and the running deploy finishes its rollback if it fails.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://0509.io
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Record the D1 Time Travel bookmark taken just before migrating
        # docs/REBUILD-SCHEMA.md: a migration that drops or rewrites a table
        # with tracking history is undone by restoring this bookmark (#5130).
        run: npx wrangler d1 time-travel info 0509 --json >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply 0509 --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record the serving Worker version before this deploy replaces it
        id: previous
        run: |
          target=$(npx wrangler deployments status --json | jq -r '[.versions[] | select(.percentage == 100) | .version_id][0]')
          if [ -z "$target" ] || [ "$target" = "null" ]; then
            echo "::error::Could not read the serving Worker version id. Refusing to deploy with no rollback target." >&2
            exit 1
          fi
          echo "version_id=$target" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $target" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        id: deploy
        run: npm run deploy -- --var "GIT_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke the deployed Worker
        id: smoke
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS https://0509.io/api/health || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "/api/health never answered ok with commit $GITHUB_SHA; last body: $body"
          exit 1

      - name: Roll back to the serving Worker version
        # 0509#7004: a red smoke test used to leave the new Worker live. Scoped
        # by steps.deploy.outcome (a failed deploy has nothing to undo) and
        # placed before the fixture Workers, which never roll back a good deploy.
        # always() so a cancelled job (job timeout, manual cancel) mid-smoke
        # still rolls back: failure() is false on cancellation and would skip
        # this step. smoke.outcome != 'success' covers failure, cancelled and
        # skipped; deploy.outcome == 'success' keeps it off any run whose
        # deploy never went out.
        # The Worker version is rolled back, the schema is not: migrations are
        # additive, and the D1 Time Travel bookmark above is the path for tables.
        if: always() && steps.deploy.outcome == 'success' && steps.smoke.outcome != 'success'
        run: npx wrangler rollback "$ROLLBACK_TARGET" --yes --message "smoke failed $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TARGET: ${{ steps.previous.outputs.version_id }}

      - name: Deploy the fixture-site Worker
        # J8's breakable own-site fixture (0509#4046): a separate Worker with
        # its own name and route on fixture.0509.in, deployed by the normal CI
        # deploy job — no bespoke deploy path.
        #
        # continue-on-error, because this job carries `environment: production`,
        # so a failure here — the likeliest being the first-ever custom domain
        # created on the 0509.in zone — would otherwise mark the deploy run
        # failed. That is exactly the inversion this comment needs to keep false:
        # test infrastructure must never stand between a good app deploy and its
        # verification.
        #
        # The break and price state live in a SQLite Durable Object (0509#4305).
        # Migration tag v1 in the wrangler config creates the class on deploy, so
        # there is no KV namespace to provision.
        continue-on-error: true
        run: npx wrangler deploy --config workers/fixture-site.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the e2e inbox Worker
        run: npx wrangler deploy --config workers/e2e-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the support inbox Worker
        # The user-report door (0509#4229, docs/USER-REPORTS.md): the support
        # address lands in workers/support-inbox.ts once the Email Routing rule
        # moves (child 4, gated on Nish). Runs AFTER the app smoke so it can
        # never stand between a good app deploy and its verification.
        # continue-on-error for the same reason as the fixture-site step. Its D1
        # table (`support_report`) comes from the `Apply D1 migrations` step
        # earlier in this job.
        continue-on-error: true
        run: npx wrangler deploy --config workers/support-inbox.wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  staging:
    name: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.0509.io
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: CLOUDFLARE_VITE_FORCE_BUILD_OUTPUT=true npx react-router build --mode staging
      - name: Apply D1 migrations
        run: npx cf d1 migrations apply "$(jq -r .env.DB.id .cloudflare/output/v0/workers/default/worker.config.json)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the staging Worker
        run: |
          [ -n "$DODO_TEST_API_KEY" ] || { echo "::error::DODO_TEST_API_KEY is empty"; exit 1; }
          secrets=$(mktemp)
          trap 'rm -f "$secrets"' EXIT
          jq -n '{DODO_PAYMENTS_API_KEY: env.DODO_TEST_API_KEY}' > "$secrets"
          npx cf deploy --prebuilt --mode staging --secrets-file "$secrets"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DODO_TEST_API_KEY: ${{ secrets.DODO_TEST_API_KEY }}
      - name: Smoke staging
        timeout-minutes: 3
        run: |
          for _ in $(seq 1 20); do
            body=$(curl -fsS https://staging.0509.io/api/health || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 5
          done
          echo "/api/health never answered ok with commit $GITHUB_SHA; last body: $body"
          exit 1

  # No post-deploy audit in this workflow. 0509.io sits behind the team-only
  # Cloudflare Access wall (0509#7656), so an unauthenticated Lighthouse run is
  # redirected to the Access login page: it measures that page, fails the fleet's
  # budgets, and reddens a run whose deploy succeeded. The fleet's deploy-failed
  # alert reads this run's conclusion, so that red read as "Production is not
  # running main" while /api/health served the main head (fleet-ops#9889,
  # fleet-ops#9872). Every other repo's deploy workflow holds only the deploy job
  # for this reason. The audit and its budgets are unchanged in fleet-ops; they
  # come back here once 0509#7656 decides how the audited URLs are reached.
