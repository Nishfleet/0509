# Trigger stub. Monday 03:30 UTC is 09:00 IST. The scorecard lives once in
# Nishfleet/fleet-ops and posts to issue 4267.
name: Parity scorecard
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
jobs:
  scorecard:
    uses: Nishfleet/fleet-ops/.github/workflows/parity-scorecard.yml@main
    permissions:
      issues: write
      actions: read
      contents: read
      pull-requests: read
    with:
      issue: 4267
