name: Validate D1 backup tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/d1-backup*.mjs"
      - "scripts/validate-d1-backup.mjs"
      - "config/r2-retention-policy.json"
      - "wrangler.jsonc"
      - "migrations/**"
      - ".github/workflows/d1-backup-validate.yml"

concurrency:
  group: d1-backup-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'nish3451/0509' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.RECOVERY_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: node scripts/validate-d1-backup.mjs
