name: Validate D1 backup tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/d1-backup*.mjs"
      - "scripts/validate-d1-backup.mjs"
      - "wrangler.jsonc"
      - "migrations/**"
      - ".github/workflows/d1-backup-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/validate-d1-backup.mjs
