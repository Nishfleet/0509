name: Validate D1 backup tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/d1-backup*.mjs"
      - "scripts/validate-d1-backup.mjs"
      - "config/r2-retention-policy.json"
      - "wrangler.jsonc"
      - "migrations/**"
      - ".github/workflows/d1-backup-validate.yml"

concurrency:
  group: d1-backup-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'Nishfleet/0509' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: npm ci
      - run: node scripts/validate-d1-backup.mjs
