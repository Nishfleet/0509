# Weekly D1 export to R2 (0509#3679). Point-in-time restore is D1 Time Travel
# (30 days, built in); this is the cold copy beyond that window. Retention is
# the R2 lifecycle rule in config/r2-retention-policy.json (backups/d1/, 90d).
name: D1 backup weekly

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 0509-production-provider-mutations
  cancel-in-progress: false

jobs:
  export:
    name: Export D1 to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: d1-backup-r2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export and upload
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          file="0509-${stamp}.sql"
          npx wrangler d1 export 0509 --remote --output "$file"
          npx wrangler r2 object put "0509-landing-page-artifacts/backups/d1/${file}" --file "$file" --remote
          echo "uploaded r2://0509-landing-page-artifacts/backups/d1/${file} ($(wc -c < "$file") bytes)" >> "$GITHUB_STEP_SUMMARY"
