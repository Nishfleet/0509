name: grader-calibration

# Nish 2026-09-28: "make sure k3 max is upto the task, we're trusting vibes".
# Grades a fixed labeled set (.github/grader-calibration/cases.json) with the
# Devin grader exactly as fleet-ops grade.yml runs it: the prompt-build and grade
# steps are read out of Nishfleet/fleet-ops main at run time, so a grader change
# is measured as it will run. Results and the catch rate go on 0509#5872. Run on
# demand only: 19 serial grades occupy a fleet-ci runner for about an hour and
# a half. Not a required check.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue the results are posted on
        type: number
        default: 5872

permissions:
  contents: read

concurrency:
  group: grader-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cases:
    name: cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ids
        run: echo "ids=$(jq -c '[.cases[].id]' .github/grader-calibration/cases.json)" >> "$GITHUB_OUTPUT"

  grade:
    name: grade
    needs: cases
    runs-on: ${{ fromJSON('["self-hosted","fleet-ci"]') }}
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.ids) }}
    env:
      CASE: ${{ matrix.case }}
      RESULTS_ISSUE: ${{ inputs.issue || 5872 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the Devin grader exactly as grade.yml runs it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nishfleet/fleet-ops
          ref: main
          path: .bar
          fetch-depth: 1
          persist-credentials: false
      - name: Grade with Devin
        timeout-minutes: 30
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cases="$GITHUB_WORKSPACE/.github/grader-calibration/cases.json"
          jq -e --arg id "$CASE" '.cases[] | select(.id == $id)' "$cases" > "$RUNNER_TEMP/case.json"
          base=$(jq -r .base "$RUNNER_TEMP/case.json")
          head=$(jq -r .head "$RUNNER_TEMP/case.json")
          patch=$(jq -r '.patch // empty' "$RUNNER_TEMP/case.json")
          rm -rf "$RUNNER_TEMP/devin-in"
          mkdir "$RUNNER_TEMP/devin-in"
          cd "$RUNNER_TEMP/devin-in"
          cp "$GITHUB_WORKSPACE/.bar/docs/quality-bar.md" bar.md
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/docs/REBUILD-TRUST.md?ref=$base" > trust.md
          jq -e '.pr' "$RUNNER_TEMP/case.json" > pr.json
          jq -c '.issues[]' "$RUNNER_TEMP/case.json" > issues.json
          if [ -n "$patch" ]; then
            cp "$GITHUB_WORKSPACE/.github/grader-calibration/$patch" pr.diff
          else
            gh api -H "Accept: application/vnd.github.diff" "repos/$GITHUB_REPOSITORY/compare/$base...$head" > pr.diff
          fi
          cd "$GITHUB_WORKSPACE"
          grade=.bar/.github/workflows/grade.yml
          for id in devin-prompt devin-grade; do
            yq -e ".jobs.grade.steps[] | select(.id == \"$id\") | .run" "$grade" > "$RUNNER_TEMP/$id.sh"
            test -s "$RUNNER_TEMP/$id.sh"
          done
          yq -e '.jobs.grade.env.DEVIN_PROMPT' "$grade" > "$RUNNER_TEMP/devin-head.txt"
          test -s "$RUNNER_TEMP/devin-head.txt"
          export DEVIN_PROMPT
          DEVIN_PROMPT=$(cat "$RUNNER_TEMP/devin-head.txt")
          bash -eo pipefail "$RUNNER_TEMP/devin-prompt.sh"
          bash -eo pipefail "$RUNNER_TEMP/devin-grade.sh"
      - name: Post the result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: swe-2-max
          LABEL: Devin
          OUT: devin
        run: |
          expect=$(jq -r .expect "$RUNNER_TEMP/case.json")
          tr -d '\r' < "$RUNNER_TEMP/$OUT.txt" > "$RUNNER_TEMP/$OUT-clean.txt" 2>/dev/null || : > "$RUNNER_TEMP/$OUT-clean.txt"
          : > "$RUNNER_TEMP/$OUT-graded.txt"
          if [ "$(grep -cxE "$LABEL grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)" "$RUNNER_TEMP/$OUT-clean.txt")" = 1 ]; then
            sed -nE "/^$LABEL grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)\$/,\$p" "$RUNNER_TEMP/$OUT-clean.txt" > "$RUNNER_TEMP/$OUT-graded.txt"
          fi
          line=$(head -n1 "$RUNNER_TEMP/$OUT-graded.txt")
          got=$(printf '%s\n' "$line" | sed -nE "s/^$LABEL grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)\$/\1/p")
          case "$expect:${got:-none}" in
            *:none) result=no-grade ;;
            block:A+) result=false-A+ ;;
            block:*) result=caught ;;
            pass:A+) result=passed ;;
            pass:*) result=false-block ;;
          esac
          {
            printf 'calibration run %s case %s model %s expect=%s got=%s result=%s\n\n' "$GITHUB_RUN_ID" "$CASE" "$MODEL" "$expect" "${got:-none}" "$result"
            printf 'Why this case: %s\n\n~~~text\n' "$(jq -r .why "$RUNNER_TEMP/case.json")"
            head -n 12 "$RUNNER_TEMP/$OUT-graded.txt" | head -c 8000 | tr -d '~'
            printf '~~~\n'
          } > "$RUNNER_TEMP/result.md"
          gh issue comment "$RESULTS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"

      - name: Remove the copied Devin login
        if: always()
        run: rm -rf "$RUNNER_TEMP/devin-home" "$RUNNER_TEMP/devin-in" "$RUNNER_TEMP/devin-prompt.txt"

  summary:
    name: summary
    needs: grade
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      RESULTS_ISSUE: ${{ inputs.issue || 5872 }}
    steps:
      - name: Count catches and false A+ grades for this run
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: swe-2-max
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$RESULTS_ISSUE/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | .body | select(startswith(\"calibration run $GITHUB_RUN_ID \")) | split(\"\n\")[0]" \
            > "$RUNNER_TEMP/lines.txt"
          count() { grep -c "result=$1\$" "$RUNNER_TEMP/lines.txt" || true; }
          caught=$(count caught); falsepass=$(count false-A+); passed=$(count passed); falseblock=$(count false-block); nograde=$(count no-grade)
          {
            printf 'calibration summary run %s model %s (%s)\n\n' "$GITHUB_RUN_ID" "$MODEL" "$GITHUB_SHA"
            printf -- '- Known-bad caught: %s of %s\n' "$caught" "$((caught + falsepass))"
            printf -- '- Known-bad given A+ (false A+): %s\n' "$falsepass"
            printf -- '- Known-good given A+: %s of %s\n' "$passed" "$((passed + falseblock))"
            printf -- '- Known-good blocked (false block): %s\n' "$falseblock"
            printf -- '- No grade produced: %s\n\n' "$nograde"
            printf '~~~text\n'
            sort "$RUNNER_TEMP/lines.txt" | sed -E 's/^calibration run [0-9]+ //'
            printf '~~~\n'
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$RESULTS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md"
