name: grader-calibration

# Nish 2026-09-28: "make sure k3 max is upto the task, we're trusting vibes".
# Grades a fixed labeled set (.github/grader-calibration/cases.json) with the
# Devin grader exactly as fleet-ops grade.yml runs it: both call the composite
# action Nishfleet/fleet-ops/.github/actions/devin-grade@main, so a grader change
# is measured as it will run. Results and the catch rate go on 0509#5872. Run on
# demand only: 19 serial grades occupy a fleet-ci runner for about an hour and
# a half. Not a required check.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue the results are posted on
        type: number
        default: 5872

permissions:
  contents: read

concurrency:
  group: grader-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cases:
    name: cases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ids
        run: echo "ids=$(jq -c '[.cases[].id]' .github/grader-calibration/cases.json)" >> "$GITHUB_OUTPUT"

  grade:
    name: grade
    needs: cases
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, fleet-ci]
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.ids) }}
    env:
      CASE: ${{ matrix.case }}
      RESULTS_ISSUE: ${{ inputs.issue || 5872 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect this case's files for the grader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cases="$GITHUB_WORKSPACE/.github/grader-calibration/cases.json"
          jq -e --arg id "$CASE" '.cases[] | select(.id == $id)' "$cases" > "$RUNNER_TEMP/case.json"
          base=$(jq -r .base "$RUNNER_TEMP/case.json")
          head=$(jq -r .head "$RUNNER_TEMP/case.json")
          patch=$(jq -r '.patch // empty' "$RUNNER_TEMP/case.json")
          rm -rf "$RUNNER_TEMP/devin-in"
          mkdir "$RUNNER_TEMP/devin-in"
          cd "$RUNNER_TEMP/devin-in"
          gh api -H "Accept: application/vnd.github.raw" "repos/Nishfleet/fleet-ops/contents/docs/quality-bar.md?ref=main" > bar.md
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/docs/REBUILD-TRUST.md?ref=$base" > trust.md
          jq -e '.pr' "$RUNNER_TEMP/case.json" > pr.json
          jq -c '.issues[]' "$RUNNER_TEMP/case.json" > issues.json
          if [ -n "$patch" ]; then
            cp "$GITHUB_WORKSPACE/.github/grader-calibration/$patch" pr.diff
          else
            gh api -H "Accept: application/vnd.github.diff" "repos/$GITHUB_REPOSITORY/compare/$base...$head" > pr.diff
          fi
      - name: Grade with Devin
        id: devin
        timeout-minutes: 30
        uses: Nishfleet/fleet-ops/.github/actions/devin-grade@main
        with:
          dir: ${{ runner.temp }}/devin-in
      - name: Post the result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LEAKED: ${{ steps.devin.outputs.leaked }}
        run: |
          expect=$(jq -r .expect "$RUNNER_TEMP/case.json")
          graded="$RUNNER_TEMP/devin-graded.txt"
          : > "$graded"
          if [ "$LEAKED" != false ]; then
            printf 'calibration run %s case %s expect=%s got=none result=leak-blocked\n' "$GITHUB_RUN_ID" "$CASE" "$expect" > "$RUNNER_TEMP/result.md"
            gh issue comment "$RESULTS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
            exit 0
          fi
          clean="$RUNNER_TEMP/devin-clean.txt"
          [ -f "$clean" ] || : > "$clean"
          if [ "$(grep -cxE 'Devin grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)' "$clean")" = 1 ]; then
            sed -nE '/^Devin grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)$/,$p' "$clean" > "$graded"
          fi
          got=$(head -n1 "$graded" | sed -nE 's/^Devin grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)$/\1/p')
          case "$expect:${got:-none}" in
            *:none) result=no-grade ;;
            block:A+) result=false-A+ ;;
            block:*) result=caught ;;
            pass:A+) result=passed ;;
            pass:*) result=false-block ;;
          esac
          {
            printf 'calibration run %s case %s expect=%s got=%s result=%s\n\n' "$GITHUB_RUN_ID" "$CASE" "$expect" "${got:-none}" "$result"
            printf 'Why this case: %s\n\n~~~text\n' "$(jq -r .why "$RUNNER_TEMP/case.json")"
            head -n 12 "$graded" | head -c 8000 | tr -d '~'
            printf '~~~\n'
          } > "$RUNNER_TEMP/result.md"
          gh issue comment "$RESULTS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"
      - name: Remove the collected files
        if: always()
        run: rm -rf "$RUNNER_TEMP/devin-in" "$RUNNER_TEMP/devin-clean.txt" "$RUNNER_TEMP/devin-graded.txt" "$RUNNER_TEMP/case.json" "$RUNNER_TEMP/result.md"

  summary:
    name: summary
    needs: grade
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      RESULTS_ISSUE: ${{ inputs.issue || 5872 }}
    steps:
      - name: Count catches and false A+ grades for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$RESULTS_ISSUE/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | .body | select(startswith(\"calibration run $GITHUB_RUN_ID \")) | split(\"\n\")[0]" \
            > "$RUNNER_TEMP/lines.txt"
          count() { grep -c "result=$1\$" "$RUNNER_TEMP/lines.txt" || true; }
          caught=$(count caught); falsepass=$(count false-A+); passed=$(count passed); falseblock=$(count false-block); nograde=$(count no-grade); leaks=$(count leak-blocked)
          {
            printf 'calibration summary run %s (%s)\n\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf -- '- Known-bad caught: %s of %s\n' "$caught" "$((caught + falsepass))"
            printf -- '- Known-bad given A+ (false A+): %s\n' "$falsepass"
            printf -- '- Known-good given A+: %s of %s\n' "$passed" "$((passed + falseblock))"
            printf -- '- Known-good blocked (false block): %s\n' "$falseblock"
            printf -- '- No grade produced: %s\n' "$nograde"
            printf -- '- Blocked by the leak check: %s\n\n' "$leaks"
            printf '~~~text\n'
            sort "$RUNNER_TEMP/lines.txt" | sed -E 's/^calibration run [0-9]+ //'
            printf '~~~\n'
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$RESULTS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md"
