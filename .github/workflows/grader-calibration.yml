name: grader-calibration

# Nish 2026-09-28: "make sure k3 max is upto the task, we're trusting vibes".
# Grades a fixed labeled set (.github/grader-calibration/cases.json) with the
# exact opus-review grading steps: the scripts and the prompt are read out of
# ci.yml at run time, so a grader change is measured as it will run. Results
# and the catch rate go on 0509#5872. Not a required check. Dispatch only.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Cursor model to grade with
        type: string
        default: kimi-k3-max
      issue:
        description: Issue the results are posted on
        type: number
        default: 5872

permissions:
  contents: read

concurrency:
  group: grader-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cases:
    name: cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ids
        run: echo "ids=$(jq -c '[.cases[].id]' .github/grader-calibration/cases.json)" >> "$GITHUB_OUTPUT"

  grade:
    name: grade
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.ids) }}
    env:
      CASE: ${{ matrix.case }}
      RESULTS_ISSUE: ${{ inputs.issue || 5872 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the grader exactly as opus-review runs it
        run: |
          job='.jobs["opus-review"]'
          for id in kimi-files-tree kimi-grade; do
            yq -e "$job.steps[] | select(.id == \"$id\") | .run" .github/workflows/ci.yml > "$RUNNER_TEMP/$id.sh"
            test -s "$RUNNER_TEMP/$id.sh"
          done
          yq -e "$job.steps[] | select(.name == \"Install the Cursor CLI\") | .run" .github/workflows/ci.yml > "$RUNNER_TEMP/cursor-install.sh.run"
          test -s "$RUNNER_TEMP/cursor-install.sh.run"
          delim="grader_$(openssl rand -hex 12)"
          for var in GRADE_RUBRIC KIMI_FILES_NOTE; do
            yq -e "$job.env.$var" .github/workflows/ci.yml > "$RUNNER_TEMP/$var.txt"
            test -s "$RUNNER_TEMP/$var.txt"
          done
          for var in GRADE_RUBRIC KIMI_FILES_NOTE; do
            printf '%s<<%s\n' "$var" "$delim"
            cat "$RUNNER_TEMP/$var.txt"
            printf '%s\n' "$delim"
          done >> "$GITHUB_ENV"
      - name: Hand the grader this case
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cases="$GITHUB_WORKSPACE/.github/grader-calibration/cases.json"
          jq -e --arg id "$CASE" '.cases[] | select(.id == $id)' "$cases" > "$RUNNER_TEMP/case.json"
          mkdir -p "$RUNNER_TEMP/grade-files"
          cd "$RUNNER_TEMP/grade-files"
          jq -e '.pr' "$RUNNER_TEMP/case.json" > pr.json
          jq -c '.issues[]' "$RUNNER_TEMP/case.json" > issues.json
          BASE_REF=main BASE_SHA=$(jq -r .base "$RUNNER_TEMP/case.json") HEAD_SHA=$(jq -r .head "$RUNNER_TEMP/case.json") \
            bash -eo pipefail "$RUNNER_TEMP/kimi-files-tree.sh"
          rm -rf base/.github/grader-calibration base/.github/workflows/grader-calibration.yml
          patch=$(jq -r '.patch // empty' "$RUNNER_TEMP/case.json")
          if [ -n "$patch" ]; then
            cp "$GITHUB_WORKSPACE/.github/grader-calibration/$patch" pr.diff
            cp -a base "$RUNNER_TEMP/patched"
            (cd "$RUNNER_TEMP/patched" && git apply "$RUNNER_TEMP/grade-files/pr.diff")
            git apply --numstat pr.diff | cut -f3 | while read -r path; do
              mkdir -p "head/$(dirname "$path")"
              cp "$RUNNER_TEMP/patched/$path" "head/$path"
            done
          fi
          ls
          find head -type f
      - name: Install the Cursor CLI
        run: bash -eo pipefail "$RUNNER_TEMP/cursor-install.sh.run"
      - name: Grade
        working-directory: ${{ runner.temp }}/grade-files
        timeout-minutes: 30
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GRADE_MODEL: ${{ inputs.model || 'kimi-k3-max' }}
        run: bash -eo pipefail "$RUNNER_TEMP/kimi-grade.sh"
      - name: Post the result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model || 'kimi-k3-max' }}
        run: |
          expect=$(jq -r .expect "$RUNNER_TEMP/case.json")
          tr -d '\r' < "$RUNNER_TEMP/kimi.txt" > "$RUNNER_TEMP/kimi-clean.txt" 2>/dev/null || : > "$RUNNER_TEMP/kimi-clean.txt"
          : > "$RUNNER_TEMP/kimi-graded.txt"
          if [ "$(grep -cxE 'Kimi grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)' "$RUNNER_TEMP/kimi-clean.txt")" = 1 ]; then
            sed -nE '/^Kimi grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)$/,$p' "$RUNNER_TEMP/kimi-clean.txt" > "$RUNNER_TEMP/kimi-graded.txt"
          fi
          line=$(head -n1 "$RUNNER_TEMP/kimi-graded.txt")
          got=$(printf '%s\n' "$line" | sed -nE 's/^Kimi grade: (A\+|A|A-|B\+|B|B-|C\+|C|C-|D|F)$/\1/p')
          case "$expect:${got:-none}" in
            *:none) result=no-grade ;;
            block:A+) result=false-A+ ;;
            block:*) result=caught ;;
            pass:A+) result=passed ;;
            pass:*) result=false-block ;;
          esac
          {
            printf 'calibration run %s case %s model %s expect=%s got=%s result=%s\n\n' "$GITHUB_RUN_ID" "$CASE" "$MODEL" "$expect" "${got:-none}" "$result"
            printf 'Why this case: %s\n\n~~~text\n' "$(jq -r .why "$RUNNER_TEMP/case.json")"
            head -n 12 "$RUNNER_TEMP/kimi-graded.txt" | head -c 8000 | tr -d '~'
            printf '~~~\n'
          } > "$RUNNER_TEMP/result.md"
          gh issue comment "$RESULTS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/result.md"

  summary:
    name: summary
    needs: grade
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      RESULTS_ISSUE: ${{ inputs.issue || 5872 }}
    steps:
      - name: Count catches and false A+ grades for this run
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model || 'kimi-k3-max' }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$RESULTS_ISSUE/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | .body | select(startswith(\"calibration run $GITHUB_RUN_ID \")) | split(\"\n\")[0]" \
            > "$RUNNER_TEMP/lines.txt"
          count() { grep -c "result=$1\$" "$RUNNER_TEMP/lines.txt" || true; }
          caught=$(count caught); falsepass=$(count false-A+); passed=$(count passed); falseblock=$(count false-block); nograde=$(count no-grade)
          {
            printf 'calibration summary run %s model %s (%s)\n\n' "$GITHUB_RUN_ID" "$MODEL" "$GITHUB_SHA"
            printf -- '- Known-bad caught: %s of %s\n' "$caught" "$((caught + falsepass))"
            printf -- '- Known-bad given A+ (false A+): %s\n' "$falsepass"
            printf -- '- Known-good given A+: %s of %s\n' "$passed" "$((passed + falseblock))"
            printf -- '- Known-good blocked (false block): %s\n' "$falseblock"
            printf -- '- No grade produced: %s\n\n' "$nograde"
            printf '~~~text\n'
            sort "$RUNNER_TEMP/lines.txt" | sed -E 's/^calibration run [0-9]+ //'
            printf '~~~\n'
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment "$RESULTS_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md"
