name: D1 restore proof auto-refresh

# Self-refreshing backup proof for the production deploy gate.
#
# Why this exists
# ----------------
# The deploy gate's "backup proof" is the D1 remote restore evidence
# artifact (`d1-remote-restore-evidence-<sha>-<run_id>.tar.gz`) produced
# by this repo's `d1-remote-restore-evidence.yml`. The gate reads it via
# `scripts/find-recent-remote-restore-artifact.mjs`, which enforces two
# thresholds on every artifact it accepts, regardless of which workflow
# produced it:
#   1. EXACT COMMIT MATCH — the artifact's SHA, embedded in its name, must
#      equal the deploy's pinned SHA.
#   2. FRESHNESS — the deploy adds a 12-hour freshness headroom on top of
#      the absolute 14-day max age in `validateRemoteRestoreEvidence`.
#
# The existing nightly schedule on `d1-remote-restore-evidence.yml`
# (`cron: "47 20 * * *"`, i.e. 02:17 IST) refreshes evidence ONCE per day
# for whatever SHA main had at that moment. Auto-deploy-on-green went live
# on 2026-08-25 (`103e2318`) so every merge to main now triggers a deploy;
# between nightly runs, every push lands with no pre-generated evidence for
# its exact SHA. The deploy's `prepare_remote_restore_evidence` job then
# reports "No valid pre-generated restore evidence is available" and the
# deploy's inline `generate_restore_evidence` fallback fires — which has
# been failing on production schema drift (most recently: "no such table:
# main.event_candidate: SQLITE_ERROR" on runs 32822047118, 32820674758,
# 32820002307, 32819810058, and 32822722001). The result: every push since
# auto-deploy turned on is sitting undeployed and stranded.
#
# This workflow fires the same backup + isolated remote restore drill on
# every push to main, plus a 3-hourly safety-net schedule so a missed push
# webhook or a single failed run cannot leave the gate without evidence
# well under its 12-hour freshness window. Its artifacts are accepted by
# the gate via `TRUSTED_WORKFLOWS` (the threshold logic — exact-commit +
# freshness — is unchanged and applied identically to its artifacts).
#
# Named reason for the schedule (P9-C)
# ------------------------------------
# Backup freshness is inherently time-based. Even if every push fires this
# workflow, a single failed run or a missed webhook would still strand the
# next deploy. The 3-hourly cron at minute :17 is the named safety net: it
# is one quarter of the deploy's 12-hour freshness window, deliberately
# offset from the nightly drill (`:47`) and the busy hourly marks, and runs
# on a hosted runner (free for this public repository) so provider work
# never touches a self-hosted runner. This matches Nish's standing rule:
# "Schedule a cron, don't sit and wait."
#
# What the workflow does (same proven drill as the nightly workflow)
# -------------------------------------------------------------------
#   1. `authorize_release` — pin the exact SHA and refuse any unexpected
#      shape (push/schedule leave `expected_sha` empty; `workflow_dispatch`
#      must name a SHA that equals `GITHUB_SHA`).
#   2. `restore` — checkout the pinned SHA, run the same
#      `node scripts/d1-remote-restore-evidence.mjs` drill the nightly
#      workflow runs: fresh D1 export to R2, transform, isolated remote
#      restore on a fresh scratch D1, aggregate round-trip, evidence
#      JSON, then upload as
#      `d1-remote-restore-evidence-<sha>-<run_id>.tar.gz` (mode 0600).
#   3. `cleanup` — independent `if: always()` job that deletes every
#      run-scoped scratch database, so a hard-killed generation attempt
#      cannot leave production data parked.
#
# Push-trigger rationale
# ----------------------
# The deploy workflow runs on every merge to main. A push event is the
# only trigger that knows the exact SHA being shipped BEFORE the deploy's
# `prepare_remote_restore_evidence` job runs, so the evidence produced is
# already in `TRUSTED_WORKFLOWS` by the time the deploy starts. The deploy
# then finds it on the fast path and the inline `generate_restore_evidence`
# fallback is no longer the only line of defense against stale evidence.
#
# Drift tolerance (same rationale as the nightly workflow's post-pin CAS)
# -----------------------------------------------------------------------
# A push-triggered run and the deploy for that push race against each
# other on the same SHA. A *mid-run* move of main does not change what
# THIS run is producing evidence for — the SHA is already pinned. We
# record drift loudly and continue. Any other CAS failure stays
# fail-closed, and the authorize step's empty-`expected_sha` contract on
# push/schedule still forbids smuggling a chosen commit into an unattended
# run.
#
# Secrets used
# ------------
#   - `secrets.CLOUDFLARE_ACCOUNT_ID`, `secrets.CLOUDFLARE_API_TOKEN` —
#     already present in the repo (`production` environment). No new
#     credentials are provisioned by this workflow.

on:
  push:
    branches: [main]
  schedule:
    # 3-hourly safety net: one quarter of the deploy's 12h freshness
    # window. Minute ":17" deliberately offset so it never collides with
    # the nightly `d1-remote-restore-evidence.yml` ("47 20 * * *") or the
    # busy hourly marks where the upstream Cloudflare D1 export queue is
    # busiest.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to refresh the proof for (push/schedule leave this blank)
        required: false
        default: ""
        type: string

concurrency:
  group: 0509-production-provider-mutations
  cancel-in-progress: false
  # `queue: max` is intentional. A burst of pushes queues multiple
  # evidence runs in the same group, but cancel-in-progress is false so
  # every run completes and produces its own exact-SHA artifact. The
  # deploy's artifact finder (`find-recent-remote-restore-artifact.mjs`)
  # sorts by `created_at` and returns the newest artifact whose SHA
  # matches the deploy's pinned SHA, so a queued backlog cannot starve
  # the deploy of fresh evidence.
  queue: max

permissions: {}

jobs:
  authorize_release:
    name: Authorize exact restore candidate
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Authorize auto-refresh request
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "Nishfleet/0509"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            push)
              # Every push to main is the auto-refresh contract: the gate
              # is about to run for exactly this SHA. No expected_sha
              # allowed on an unattended push.
              test -z "$EXPECTED_SHA"
              ;;
            schedule)
              # Scheduled runs backup whatever main is at run start. No
              # expected_sha allowed on an unattended schedule.
              test -z "$EXPECTED_SHA"
              ;;
            workflow_dispatch)
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  restore:
    name: Prove isolated remote restore
    if: needs.authorize_release.result == 'success'
    needs: authorize_release
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: production
    permissions:
      contents: read
    env:
      D1_DATABASE_NAME: "0509"
      R2_BACKUP_BUCKET: "0509-landing-page-artifacts"
      PINNED_SHA: ${{ needs.authorize_release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_release.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify pinned candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-verify-production-candidate.sh
      - name: Bind run-scoped backup directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'D1_BACKUP_LOCAL_DIRECTORY=%s\n' \
            "$RUNNER_TEMP/0509-d1-backups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-d1-backup.mjs
      - name: Reconfirm frozen main before backup mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Push-triggered runs race the deploy for the same SHA. A
          # mid-run move of main does not change what THIS run is
          # producing evidence FOR — the SHA is already pinned. Drift is
          # recorded, not fatal. Every other CAS failure stays
          # fail-closed, and the authorize step's empty-`expected_sha`
          # contract on push/schedule still forbids smuggling a chosen
          # commit into an unattended run.
          TOLERATE_MAIN_DRIFT: "1"
        run: ./scripts/ci-verify-production-candidate.sh
      - name: Create fresh backup and prove an isolated remote restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_BACKUP_AUTOMATION_APPROVED: "0509-weekly-d1-to-r2"
          D1_REMOTE_RESTORE_AUTOMATION_APPROVED: "0509-remote-restore-evidence"
          D1_REMOTE_RESTORE_MAX_SQL_BYTES: ${{ vars.D1_REMOTE_RESTORE_MAX_SQL_BYTES }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/d1-remote-restore-evidence.mjs \
            --output test-results/d1-remote-restore-evidence.json
      - name: Remove run-scoped plaintext backup files
        if: always()
        run: node scripts/d1-backup-local-cleanup.mjs
      - name: Archive permission-preserving restore evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(stat -c '%a' test-results/d1-remote-restore-evidence.json)" = "600"
          tar --format=posix -czf \
            "test-results/d1-remote-restore-evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz" \
            -C test-results \
            d1-remote-restore-evidence.json
      - name: Preserve private restore evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d1-remote-restore-evidence-${{ github.sha }}-${{ github.run_id }}
          path: test-results/d1-remote-restore-evidence-${{ github.sha }}-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 8

  cleanup:
    name: Confirm scratch D1 cleanup
    if: "always() && needs.authorize_release.result == 'success'"
    needs:
      - authorize_release
      - restore
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
    env:
      PINNED_SHA: ${{ needs.authorize_release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_release.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify authorized cleanup checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$PINNED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - name: Bind run-scoped backup directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'D1_BACKUP_LOCAL_DIRECTORY=%s\n' \
            "$RUNNER_TEMP/0509-d1-backups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: npm ci --ignore-scripts
      - name: Delete every exact scratch database from this run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_REMOTE_RESTORE_AUTOMATION_APPROVED: "0509-remote-restore-evidence"
        run: node scripts/d1-remote-restore-evidence.mjs --cleanup-only