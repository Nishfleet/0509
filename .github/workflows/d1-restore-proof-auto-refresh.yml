name: D1 restore proof auto-refresh

# Self-refreshing backup proof for the production deploy gate.
#
# Why this exists
# ----------------
# The deploy gate's "backup proof" used to be ONE thing: the D1 remote restore
# evidence artifact (`d1-remote-restore-evidence-<sha>-<run_id>.tar.gz`)
# produced by this repo's `d1-remote-restore-evidence.yml`, found via
# `scripts/find-recent-remote-restore-artifact.mjs`. That conflated two
# different questions, and answered the cheap one with the expensive drill:
#
#   1. Is there a RECENT BACKUP?  Needs a fresh D1 export. Cheap: an export
#      imports nothing and creates no scratch database.
#   2. Is that backup RESTORABLE?  Needs an isolated scratch restore. Expensive:
#      each drill imports ~400k rows into a scratch D1, and past the free tier
#      that is ~$1/M rows (0509#3576).
#
# So the gate now reads two records, and this workflow publishes both at
# different cadences (0509#3576):
#
#   * EXPORT-ONLY, every 6 hours (`17 */6 * * *`) — `node
#     scripts/d1-backup-to-r2.mjs`, unchanged and already proven, publishes the
#     export record at the fixed R2 key `backups/d1/export-record.json`. The
#     deploy gate requires it to be under 12h old.
#   * FULL DRILL, weekly (`47 4 * * 0`) — the same scratch-restore drill as
#     before. The deploy gate requires its schemaFingerprint-matching evidence
#     to be under 7 days old (14-day absolute ceiling retained).
#
# `mode` is derived from `github.event.schedule`, never from anything a caller
# can set, so the two schedules cannot be confused for each other: the cheap
# command cannot reach the drill's job and the drill cannot be run without its
# own authorized SHA.
#
# Push-to-main restore evidence is owned solely by
# `d1-remote-restore-evidence.yml`, which already has the push trigger, so the
# two workflows do not double-run the drill on every merge. Its artifacts
# remain accepted via `TRUSTED_WORKFLOWS`.
#
# Named reason for the schedule (P9-C)
# ------------------------------------
# Backup freshness is inherently time-based. Even with a push drill in the
# evidence workflow, a failed run or missed webhook could strand the next
# deploy. The 6-hourly cron at minute :17 is the named safety net: it is one
# half of the deploy's 12-hour freshness window, deliberately offset from the
# weekly drill (`47 4 * * 0`, Sunday) and the busy hourly marks, and runs on a
# hosted runner (free for this public repository) so provider work never
# touches a self-hosted runner. This matches Nish's standing rule: "Schedule a
# cron, don't sit and wait."
#
# What the workflow does
# ----------------------
#   1. `authorize_release` — pin the exact SHA, derive `mode`, and refuse any
#      unexpected shape (schedule leaves `expected_sha` empty;
#      `workflow_dispatch` must name a SHA that equals `GITHUB_SHA`).
#   2. `backup_export` (mode `export`) — checkout the pinned SHA and run
#      `node scripts/d1-backup-to-r2.mjs`. No scratch database, no row import.
#   3. `restore` (mode `full`) — the proven drill:
#      `node scripts/d1-remote-restore-evidence.mjs` exports fresh, transforms,
#      restores into a fresh scratch D1, checks the aggregate round-trip,
#      writes evidence JSON, and uploads
#      `d1-remote-restore-evidence-<sha>-<run_id>.tar.gz` (mode 0600).
#   4. `cleanup` (mode `full`) — independent `if: always()` job that deletes
#      every run-scoped scratch database, so a hard-killed drill cannot leave
#      production data parked. Export-only runs create no scratch database, so
#      they skip it rather than paying for an empty sweep.
#
# Drift tolerance (same rationale as the evidence workflow's post-pin CAS)
# -----------------------------------------------------------------------
# A restore run and a deploy can race against each other on the same
# SHA. A *mid-run* move of main does not change what
# THIS run is producing evidence for — the SHA is already pinned. We
# record drift loudly and continue. Any other CAS failure stays
# fail-closed, and the authorize step's empty-`expected_sha` contract on
# schedule still forbids smuggling a chosen commit into an unattended
# run.
#
# Secrets used
# ------------
#   - `secrets.CLOUDFLARE_ACCOUNT_ID`, `secrets.CLOUDFLARE_API_TOKEN` —
#     already present in the repo (`production` environment). No new
#     credentials are provisioned by this workflow.

on:
  schedule:
    # 6-hourly EXPORT-ONLY safety net: one half of the deploy's 12h backup
    # freshness window. Minute ":17" deliberately offset so it never collides
    # with the weekly drill below or the busy hourly marks where the upstream
    # Cloudflare D1 export queue is busiest.
    - cron: "17 */6 * * *"
    # Weekly FULL DRILL: Sunday 04:47. The only job that pays for a scratch
    # restore, and the only thing that keeps the restore proof inside the
    # gate's 7-day window.
    - cron: "47 4 * * 0"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to refresh the proof for (push/schedule leave this blank)
        required: false
        default: ""
        type: string

concurrency:
  # One lane per candidate SHA (0509#2975): the shared
  # 0509-production-provider-mutations lane let every 2026-09-11 merge cancel
  # these runs. This workflow mutates no shared provider state (read-only D1
  # export, run-scoped scratch DB, run-keyed R2 objects); `queue: max` keeps
  # a second run for the SAME sha queued rather than colliding.
  group: 0509-d1-restore-proof-auto-refresh-${{ github.sha }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  authorize_release:
    name: Authorize exact restore candidate
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
      mode: ${{ steps.authorize.outputs.mode }}
    steps:
      - name: Authorize auto-refresh request
        id: authorize
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          test "$GITHUB_REPOSITORY" = "Nishfleet/0509"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$GITHUB_SHA" =~ $sha_pattern ]]
          case "$GITHUB_EVENT_NAME" in
            push)
              # Every push to main is the auto-refresh contract: the gate
              # is about to run for exactly this SHA. No expected_sha
              # allowed on an unattended push.
              test -z "$EXPECTED_SHA"
              mode=full
              ;;
            schedule)
              # Scheduled runs backup whatever main is at run start. No
              # expected_sha allowed on an unattended schedule.
              test -z "$EXPECTED_SHA"
              # 0509#3576: which schedule fired decides which command runs,
              # and GITHUB_EVENT_SCHEDULE is set by GitHub from the cron in
              # this file — not by anything a caller can supply. An
              # unrecognized cron is refused outright rather than defaulting
              # to either side.
              case "$GITHUB_EVENT_SCHEDULE" in
                "17 */6 * * *")
                  mode=export
                  ;;
                "47 4 * * 0")
                  mode=full
                  ;;
                *)
                  exit 1
                  ;;
              esac
              ;;
            workflow_dispatch)
              [[ "$EXPECTED_SHA" =~ $sha_pattern ]]
              test "$EXPECTED_SHA" = "$GITHUB_SHA"
              # A manual run is the "prove it now" button, so it buys the
              # full drill, never just the export.
              mode=full
              ;;
            *)
              exit 1
              ;;
          esac
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

  backup_export:
    name: Refresh backup export record
    # 0509#3576: the cheap half. The export-only runs (four a day) stop here
    # instead of paying for a scratch D1 restore they do not need.
    if: >-
      needs.authorize_release.result == 'success' &&
      needs.authorize_release.outputs.mode == 'export'
    needs: authorize_release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
    env:
      D1_DATABASE_NAME: "0509"
      R2_BACKUP_BUCKET: "0509-landing-page-artifacts"
      PINNED_SHA: ${{ needs.authorize_release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_release.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify pinned candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-verify-production-candidate.sh
      - name: Bind run-scoped backup directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'D1_BACKUP_LOCAL_DIRECTORY=%s\n' \
            "$RUNNER_TEMP/0509-d1-backups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-d1-backup.mjs
      - name: Export D1 to R2 and publish the export record
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_BACKUP_AUTOMATION_APPROVED: "0509-weekly-d1-to-r2"
        run: node scripts/d1-backup-to-r2.mjs
      - name: Remove run-scoped plaintext backup files
        if: always()
        run: node scripts/d1-backup-local-cleanup.mjs

  restore:
    name: Prove isolated remote restore
    if: >-
      needs.authorize_release.result == 'success' &&
      needs.authorize_release.outputs.mode == 'full'
    needs: authorize_release
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: production
    permissions:
      contents: read
    env:
      D1_DATABASE_NAME: "0509"
      R2_BACKUP_BUCKET: "0509-landing-page-artifacts"
      PINNED_SHA: ${{ needs.authorize_release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_release.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify pinned candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-verify-production-candidate.sh
      - name: Bind run-scoped backup directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'D1_BACKUP_LOCAL_DIRECTORY=%s\n' \
            "$RUNNER_TEMP/0509-d1-backups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-d1-backup.mjs
      - name: Reconfirm frozen main before backup mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Push-triggered runs race the deploy for the same SHA. A
          # mid-run move of main does not change what THIS run is
          # producing evidence FOR — the SHA is already pinned. Drift is
          # recorded, not fatal. Every other CAS failure stays
          # fail-closed, and the authorize step's empty-`expected_sha`
          # contract on push/schedule still forbids smuggling a chosen
          # commit into an unattended run.
          TOLERATE_MAIN_DRIFT: "1"
        run: ./scripts/ci-verify-production-candidate.sh
      - name: Create fresh backup and prove an isolated remote restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_BACKUP_AUTOMATION_APPROVED: "0509-weekly-d1-to-r2"
          D1_REMOTE_RESTORE_AUTOMATION_APPROVED: "0509-remote-restore-evidence"
          D1_REMOTE_RESTORE_MAX_SQL_BYTES: ${{ vars.D1_REMOTE_RESTORE_MAX_SQL_BYTES }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/d1-remote-restore-evidence.mjs \
            --output test-results/d1-remote-restore-evidence.json
      - name: Remove run-scoped plaintext backup files
        if: always()
        run: node scripts/d1-backup-local-cleanup.mjs
      - name: Archive permission-preserving restore evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(stat -c '%a' test-results/d1-remote-restore-evidence.json)" = "600"
          tar --format=posix -czf \
            "test-results/d1-remote-restore-evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz" \
            -C test-results \
            d1-remote-restore-evidence.json
      - name: Preserve private restore evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d1-remote-restore-evidence-${{ github.sha }}-${{ github.run_id }}
          path: test-results/d1-remote-restore-evidence-${{ github.sha }}-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 8

  cleanup:
    name: Confirm scratch D1 cleanup
    # Export-only runs create no scratch database, so there is nothing to
    # sweep. Full drills keep the independent always-run sweep so a
    # hard-killed drill cannot leave production data parked.
    if: >-
      always() && needs.authorize_release.result == 'success' &&
      needs.authorize_release.outputs.mode == 'full'
    needs:
      - authorize_release
      - restore
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
    env:
      PINNED_SHA: ${{ needs.authorize_release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_release.outputs.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify authorized cleanup checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$PINNED_SHA"
          if git symbolic-ref --quiet HEAD >/dev/null 2>&1; then
            exit 1
          fi
      - name: Bind run-scoped backup directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'D1_BACKUP_LOCAL_DIRECTORY=%s\n' \
            "$RUNNER_TEMP/0509-d1-backups-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: npm ci --ignore-scripts
      - name: Delete every exact scratch database from this run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_REMOTE_RESTORE_AUTOMATION_APPROVED: "0509-remote-restore-evidence"
        run: node scripts/d1-remote-restore-evidence.mjs --cleanup-only