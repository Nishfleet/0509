name: evals

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      split:
        description: Which cases to score
        type: choice
        options: [all, train, test]
        default: test
      filter:
        description: "Only eval files whose name contains this, e.g. discovery"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

# Dispatches queue, they do not stack (0509#7249). A run already in progress is never
# cancelled: its neurons are spent, so cancelling saves nothing and loses the report.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    name: evals
    runs-on: ubuntu-latest
    # One live-AI job at a time: they share the account's Clef call rate with customers (2003 failed two sign-ups on 2026-10-04).
    concurrency:
      group: live-ai
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Score the Jev questions
        shell: bash
        run: npm run eval -- ${FILTER:+"$FILTER"} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          EVAL_SPLIT: ${{ inputs.split || 'test' }}
          EVAL_MAX_NEURONS: ${{ vars.EVAL_MAX_NEURONS || '2000' }}
          EVAL_DAILY_NEURON_CEILING: "9000"
          FILTER: ${{ github.event_name == 'schedule' && 'read-this-first' || inputs.filter }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Open or update the issue that says evals are red
        if: failure()
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/red-main/evals.md
          update_existing: true
          search_existing: open
