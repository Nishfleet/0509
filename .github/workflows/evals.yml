name: evals

on:
  workflow_dispatch:
    inputs:
      split:
        description: Which cases to score
        type: choice
        options: [all, train, test]
        default: test
      filter:
        description: "Only eval files whose name contains this, e.g. discovery"
        type: string
        default: ""

permissions:
  contents: read

# Dispatches queue, they do not stack (0509#7249). A run already in progress is never
# cancelled: its neurons are spent, so cancelling saves nothing and loses the report.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    name: evals
    runs-on: ubuntu-latest
    # One live-AI job at a time: they share the account's Clef call rate (about 60
    # a minute) with customers, and 2003 "Rate limited" failed two sign-ups at
    # 03:33Z on 2026-10-04 (docs/incidents). Groups share one namespace across
    # every workflow in the repo. One run waits per group; a newer waiting run
    # replaces an older one (actionlint 1.7.12 rejects `queue: max`).
    # Left out: nothing else in this file. The workflow-level group `evals` queues
    # runs and never cancels one in progress.
    concurrency:
      group: live-ai
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Score the Jev questions
        shell: bash
        run: npm run eval -- ${FILTER:+"$FILTER"} 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          EVAL_SPLIT: ${{ inputs.split || 'test' }}
          # Per-run ceiling on estimated Workers AI neurons (0509#7249). 2,000 is about 117
          # Clef calls or 33 gpt-oss calls, so each run is at most 2,000 and four runs a day make 8,000.
          # Nothing counts runs per day; only a gateway limit could (needs a token scope).
          # Past it the run fails with "neuron ceiling". To switch it off, delete this line.
          EVAL_MAX_NEURONS: "2000"
          FILTER: ${{ inputs.filter }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
