name: D1 backup to R2

on:
  workflow_dispatch:

concurrency:
  group: d1-backup-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: github.repository == 'nish3451/0509' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RECOVERY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    environment: d1-backup-r2
    env:
      D1_DATABASE_NAME: "0509"
      R2_BACKUP_BUCKET: "0509-landing-page-artifacts"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-d1-backup.mjs
      - name: Run approved D1-to-R2 backup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_BACKUP_AUTOMATION_APPROVED: "0509-weekly-d1-to-r2"
        run: npm run backup:d1:r2
