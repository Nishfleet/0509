# Stock dependency watch (docs/REBUILD-STACK.md §6.5, #4740). Actions are
# pinned by SHA with a version comment; Dependabot keeps both current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Majors need their own group (0509#7074). While a group's pull
      # request is open Dependabot defers that group and marks the
      # group's dependencies handled for the whole run, so a single
      # minor/patch group swallowed the majors: runs 36721784366 and
      # 36727409669 log oauth-provider and @sentry/cloudflare in
      # "Adding dependencies as handled" and then "Found no
      # dependencies to update after filtering allowed updates".
      npm-major:
        update-types: [major]
      npm-minor-patch:
        update-types: [minor, patch]
    # Majors flow through Dependabot behind the merge-queue live e2e
    # (0509#5762). typescript and vitest stay ignored because
    # typescript-eslint 8.70.0 peers typescript <6.1.0 and
    # @cloudflare/vitest-plugin 1.1.13 peers vitest ^4.1.0 (verified
    # 2026-09-30; 0509#4913, 0509#4915).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
