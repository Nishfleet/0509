# Stock dependency watch (docs/REBUILD-STACK.md §6.5, #4740). Actions are
# pinned by SHA with a version comment; Dependabot keeps both current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Majors flow through Dependabot behind the merge-queue live e2e
    # (0509#5762, sequenced after 0509#5737); typescript and vitest stay
    # ignored because typescript-eslint 8.70.0 peers typescript <6.1.0 and
    # @cloudflare/vitest-plugin 1.1.13 peers vitest ^4.1.0 (verified
    # 2026-09-29; 0509#4913, 0509#4915).
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
